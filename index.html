      `Some talents and using Dark side results on a Force die also cost a Destiny point.`])}`],

  ['checks', '2 · Making a check', 'dice pools, difficulty, reading the result', `<div class="cols"><div>
    <h4>Build the pool</h4>${CL([`Take ${D('a')} equal to the <b>higher</b> of characteristic and skill rank; upgrade as many as the <b>lower</b> to ${D('p')}.`,
      `Add ${D('d')} for the difficulty. Add ${D('b')} for each advantage in the situation and ${D('k')} for each hindrance.`,
      `<b>Upgrade:</b> turn ${D('a')} into ${D('p')} (or ${D('d')} into ${D('c')}). With none left to turn, add one more ${D('a')} (or ${D('d')}) instead.`,
      `<b>Downgrade:</b> the reverse; ignored if there is no ${D('p')} or ${D('c')} to turn back.`])}
    <h4>Read the result</h4>${CL([`${Y.s} and ${Y.f} cancel. At least one ${Y.s} left = success.`,
      `${Y.a} and ${Y.t} cancel. Leftovers are side effects, good or bad, <b>whether or not</b> the check succeeded.`,
      `${Y.x} Triumph counts as a success <b>and</b> a major boon. ${Y.y} Despair counts as a failure <b>and</b> a major setback. Neither is cancelled by the other's special effect.`])}
    <h4>Characteristics</h4><p>1 weak · 2 average · 3–4 above average · 5–6 exceptional.</p></div><div>
    <h4>Difficulty</h4>${CT(['Level','Dice','Think of'],[['Simple','—','Routine; only roll if the margin matters'],['Easy',D('d'),'A primitive lock, a minor cut, food on a lush world'],['Average',D('dd'),'A typical lock, stitching a wound, food on a temperate world'],
      ['Hard',D('ddd'),'A complicated lock, setting bones, food on a rugged world'],['Daunting',D('dddd'),'A sophisticated lock, surgery, food on a barren world'],['Formidable',D('ddddd'),'A lock with no visible mechanism, cloning a body'],
      ['Impossible',D('ddddd')+' + 1 Destiny','Only if the GM allows it; no Destiny points may be spent on it']])}
    <h4>Other kinds of check</h4>${CL([`<b>Opposed:</b> the difficulty is the opponent's pool: ${D('d')} for the higher of their characteristic and skill, upgraded to ${D('c')} for the lower.`,
      `<b>Competitive:</b> everyone rolls; most ${Y.s} wins. Ties go to most ${Y.x}, then most ${Y.a}; still tied, the GM calls it or you roll again.`,
      `<b>Assisted</b> (usually one helper): a skilled helper lets you use the better characteristic and the better skill of the two. An unskilled helper adds ${D('b')}.`])}</div></div>`],

  ['social', '3 · Talking and skills', 'social checks and what to spend results on', `<div class="cols"><div>
    <h4>Social checks are opposed</h4>${CT(['You roll','They resist with'],[['Coercion, Deception, Leadership','Discipline'],['Charm','Cool'],['Negotiation','Negotiation or Cool']])}
    <p>An existing relationship adds ${D('b')} or ${D('k')}. Asking for something against the target's interests adds difficulty. Crowds are not opposed: the GM sets a difficulty.</p>
    <h4>Knowledge skills</h4><p>${Y.s} how much you know and how fast · ${Y.a} an especially useful detail · ${Y.x} a weakness or key fact · ${Y.t} a vital detail is missing · ${Y.y} you are confidently wrong.</p></div><div>
    <h4>Skill list</h4><p><b>Brawn:</b> Athletics, Brawl, Lightsaber, Melee, Resilience. <b>Agility:</b> Coordination, Gunnery, Piloting (Planetary, Space), Ranged (Light, Heavy), Stealth. <b>Intellect:</b> Astrogation, Computers, Mechanics, Medicine, all Knowledge skills. <b>Cunning:</b> Deception, Perception, Skulduggery, Streetwise, Survival. <b>Willpower:</b> Coercion, Discipline, Vigilance. <b>Presence:</b> Charm, Cool, Leadership, Negotiation.</p></div></div>
    <h4>Ideas for spending results, by skill</h4>${CT(['Skill',`${Y.s} / ${Y.a} / ${Y.x}`,`${Y.t} / ${Y.y}`],[
      ['Athletics',`${Y.s} faster or farther · ${Y.a} ${D('b')} on the next physical check · ${Y.a}${Y.a} an extra movement maneuver`,`${Y.t} 1 strain · ${Y.t}${Y.t} fall prone · ${Y.t}${Y.t}${Y.t} 1 wound · ${Y.y} Critical Injury`],
      ['Charm',`${Y.s} support lasts another scene · ${Y.a} sways bystanders too · ${Y.x} a recurring ally`,`${Y.t} fewer people swayed, or others turn against you · ${Y.y} a recurring enemy`],
      ['Coercion',`${Y.s}${Y.s} target suffers strain · ${Y.a}${Y.a} cows bystanders too · ${Y.x} a cowed, recurring underling`,`${Y.t} resentment builds · ${Y.y} you give away your real intentions`],
      ['Computers',`${Y.s} faster · ${Y.a} extra finds (hidden files, defences) · ${Y.x} the slice goes unnoticed`,`${Y.t} security is alerted · ${Y.y} you are traced or identified`],
      ['Cool',`${Y.a} extra insight into the situation · ${Y.x} recover 3 strain`,`${Y.t} miss a vital detail · ${Y.y} staggered for a round`],
      ['Coordination',`${Y.s} farther or faster · ${Y.a}${Y.a} an extra maneuver`,`${Y.t} lose your free maneuver for a turn · ${Y.y} 1 wound or lose a piece of gear`],
      ['Deception',`${Y.s} the lie holds longer · ${Y.a} more value gained · ${Y.x} the target trusts you from now on`,`${Y.t} they see through part of it · ${Y.y} word spreads, or they turn the lie on you`],
      ['Discipline',`${Y.s} downgrade the difficulty of your next action · ${Y.a} extra insight · ${Y.x} ${D('b')} to allies' Discipline for a round`,`${Y.t} resolve shaken: harder next action · ${Y.y} lose your action, or only one maneuver next round`],
      ['Leadership',`${Y.s} support lasts longer · ${Y.a} more people follow · ${Y.x} a faithful recurring follower`,`${Y.t} orders done slowly or badly · ${Y.y} your standing suffers until repaired`],
      ['Mechanics',`${Y.s} 10–20% faster · ${Y.a} superior repair: ${D('b')} with the item for a session · ${Y.x} a one-off new function`,`${Y.t} it will malfunction soon · ${Y.y} extra damage, or related parts start to fail`],
      ['Negotiation',`${Y.s} better profit or longer contract · ${Y.a} a perk or concession · ${Y.x} a regular client or vendor`,`${Y.t} worse price or terms · ${Y.y} a serious loophole in the deal`],
      ['Perception',`${Y.s} more detail · ${Y.a} recall something about what you noticed · ${Y.x} a useful detail: ${D('b')} later`,`${Y.t} a vital detail stays hidden · ${Y.y} false information`],
      ['Piloting',`${Y.a} ${D('b')} against this opponent's flying · ${Y.x} an extra vehicle maneuver`,`${Y.t}${Y.t} the opponent gains ${D('b')} against you · ${Y.y} damage the vehicle`],
      ['Resilience',`${Y.s} longer before the next check · ${Y.a} find a way to gain ${D('b')} on later checks · ${Y.x} recover 3 strain`,`${Y.t} ${D('k')} on the next Resilience check · ${Y.y} 1 wound or a minor Critical Injury`],
      ['Skulduggery',`${Y.a} extra items or another target spotted · ${Y.x} a permanent bypass, or extra value`,`${Y.t} someone has a chance to catch you after · ${Y.y} evidence or gear left behind`],
      ['Stealth',`${Y.s} lend a ${Y.s} to an ally · ${Y.a} faster · ${Y.x} a way to distract the opposition all scene`,`${Y.t} takes 25% longer · ${Y.y} evidence or gear left behind`],
      ['Streetwise',`${Y.s} less time or cost · ${Y.a} an extra rumour or source · ${Y.x} a lasting contact`,`${Y.t} the information includes a falsehood · ${Y.y} your questions are noticed`],
      ['Survival',`${Y.s} lend a ${Y.s} to an ally, or extra supplies · ${Y.a} ${D('b')} on later checks; a tracking detail · ${Y.x} an animal becomes a companion; where the quarry is headed`,`${Y.t} / ${Y.y} lost time, spoiled supplies, the trail goes cold`],
      ['Vigilance',`${Y.s} a needed item is at hand · ${Y.a} spot cover, an exit or an edge`,`${Y.t} miss something about the situation`],
    ])}`],

  ['fear', '4 · Fear', 'when to call for a fear check and what happens', `<div class="cols"><div>
    <p>Roll <b>Discipline</b>, or <b>Cool</b> if the character saw it coming.</p>
    ${CT(['How frightening','Difficulty','Examples'],[['Minimal',D('d'),'Somewhat overmatched; a minor threat to safety'],['Moderate',D('dd'),'Clearly overmatched; an aggressive creature; a credible threat'],['Very afraid',D('ddd'),'Battlefield combat; a pack of predators; some threat to life'],
      ['Mortally afraid',D('dddd'),'Terrifyingly intense combat; a huge predator; fearing for your life'],['Utterly terrified',D('ddddd'),'A hopeless situation; enemies beyond understanding']])}
    <p>Upgrade the difficulty once for something with a dangerous reputation, twice for something known to be deadly and rare, three times for something unique and terrible (an Inquisitor, a Sith).</p></div><div>
    <h4>Results</h4>${CL([`${Y.f} Failed: ${D('k')} on every action until the encounter ends.`,`${Y.t} Suffer strain equal to the ${Y.f} rolled. ${Y.t}${Y.t}${Y.t}: staggered for a turn.`,`${Y.y} Difficulty of every check is one higher until the encounter ends.`,
      `${Y.a} ${D('b')} to an ally's next fear check.`,`${Y.x} Cancel earlier fear penalties, or need no more fear checks this encounter.`])}
    <h4>Fear and Morality (GM option)</h4><p>On a failure the GM may give Conflict equal to the difficulty <b>instead of</b> the penalties. On a ${Y.y}, Conflict equal to the difficulty <b>as well as</b> the penalties. A ${Y.x} cannot remove that Conflict.</p></div></div>`],

  ['combat', '5 · Combat', 'initiative, turns, maneuvers, attacks, damage', `<div class="cols"><div>
    <h4>Initiative</h4>${CL([`Roll <b>Cool</b> if you were ready, <b>Vigilance</b> if surprised. No difficulty dice: count ${Y.s}, ties broken by ${Y.a}, then PCs before NPCs.`,
      `The results make <b>slots</b>, PC or NPC. Each round the players choose which PC takes each PC slot.`,`${Y.x} an extra maneuver in round one. ${Y.y} one fewer.`])}
    <h4>Your turn</h4>${CL([`<b>Incidentals</b>, any number: speak, drop something, let go, peek round a corner.`,`<b>One maneuver</b> free. A second costs 2 strain, or your action. Never more than two.`,
      `<b>One action:</b> a combat check, a skill check, activating an ability or Force power, or trading it for a maneuver.`])}
    <h4>Range bands</h4><p><b>Engaged:</b> close enough to strike or grab. <b>Short:</b> several metres. <b>Medium:</b> several dozen metres. <b>Long:</b> farther than that. <b>Extreme:</b> the limit of interaction.</p>
    <h4>Maneuvers</h4>${CL([`<b>Aim:</b> ${D('b')} on your next attack (aim twice for ${D('bb')}). Or call a shot at a specific item or location: ${D('kk')} (aim twice: ${D('k')}).`,
      `<b>Assist:</b> ${D('b')} to an engaged ally's next check.`,`<b>Guarded stance:</b> +1 melee defense, but ${D('k')} on your own combat checks, until the end of your next turn.`,
      `<b>Interact with the environment:</b> open a door, flip a table, hit a switch.`,`<b>Manage gear:</b> draw, holster, reload, stow, fetch from a pack.`,
      `<b>Move:</b> within short range; engaged ↔ short; or short ↔ medium. Two maneuvers for medium ↔ long, and for long ↔ extreme.`,`<b>Mount / dismount.</b> An untrained animal needs a ${D('dd')} Survival check.`,
      `<b>Drop prone / stand up.</b> Prone: ${D('k')} on your melee attacks; ranged attacks against you add ${D('k')}; melee attacks against you add ${D('b')}.`,`<b>Take cover:</b> +1 ranged defense.`,`<b>Preparation:</b> needed by some weapons and abilities.`])}</div><div>
    <h4>Attack difficulty</h4>${CT(['Attack','Difficulty'],[['Brawl, Melee, Lightsaber (engaged)',D('dd')],['Ranged, short',D('d')],['Ranged, medium',D('dd')],['Ranged, long',D('ddd')],['Ranged, extreme',D('dddd')],
      ['Ranged (Light) while engaged',D('dd')],['Ranged (Heavy) while engaged',D('ddd')],['Gunnery while engaged','not possible']])}
    <p>Add ${D('k')} per point of the target's melee or ranged <b>defense</b>. Firing a ranged weapon while engaged hands that opponent ${D('b')} on their next melee attack against you.</p>
    <h4>Damage</h4>${CL([`A hit deals the weapon's damage <b>+1 per ${Y.s}</b>, minus the target's <b>soak</b>.`,`Wounds above the wound threshold: <b>incapacitated</b> and suffers a Critical Injury. Wounds stop at twice the threshold.`,
      `Strain above the strain threshold: <b>incapacitated</b> (unconscious).`,`<b>Critical Injury:</b> roll d100, +10 for each one the target already has. It stays until healed, even after its short-term effect ends.`])}
    <h4>Size and concealment</h4><p>Target 2+ silhouettes larger: difficulty −1. Target 2+ smaller: difficulty +1.</p>
    ${CT(['Concealment','Ranged attacks and Perception'],[['Mist, shadow, waist-high grass',D('k')],['Fog, dawn or dusk, shoulder-high grass',D('kk')],['Heavy fog, thick smoke, night, dense undergrowth',D('kkk')]])}
    <h4>Conditions</h4><p><b>Staggered:</b> no actions. <b>Immobilized:</b> no maneuvers. <b>Disoriented:</b> ${D('k')} on all checks. Durations from several sources add together.</p></div></div>
    <div class="cols"><div><h4>Spending ${Y.a} and ${Y.x} in a fight</h4>${CT(['Cost','Effect'],[[`${Y.a} or ${Y.x}`,'Recover 1 strain · ' + D('b') + ' to the next ally to act · notice one useful detail'],[`${Y.a} per crit rating, or ${Y.x}`,'Inflict a Critical Injury (the attack must hit and deal damage)'],
      [`${Y.a}${Y.a} or ${Y.x}`,'Trigger a weapon quality · a free maneuver now · ' + D('k') + ' on the target\'s next check · ' + D('b') + ' to any ally\'s next check'],
      [`${Y.a}${Y.a}${Y.a} or ${Y.x}`,'Ignore the target\'s defense bonuses this round · ignore an environmental penalty until your next turn ends · disable instead of wound · +1 defense until your next turn ends · the target drops its weapon'],
      [`${Y.x}`,'Upgrade the difficulty of the target\'s next check, or the ability of any ally\'s next check · something dramatic'],[`${Y.x}${Y.x}`,'Destroy a piece of the target\'s equipment']])}</div>
    <div><h4>Spending ${Y.t} and ${Y.y}</h4>${CT(['Cost','Effect'],[[`${Y.t} or ${Y.y}`,'Suffer 1 strain · lose the benefit of your last maneuver (aim, cover)'],[`${Y.t}${Y.t} or ${Y.y}`,'An opponent takes a free maneuver · ' + D('b') + ' on the target\'s next check · ' + D('k') + ' on your or an ally\'s next check'],
      [`${Y.t}${Y.t}${Y.t} or ${Y.y}`,'Fall prone · your side\'s initiative slot drops to last'],[`${Y.y}`,'Ranged weapon out of ammo · upgrade the difficulty of an ally\'s next check · the tool or weapon is damaged · a ranged shot hits someone engaged with the target']])}</div></div>
    <div class="cols"><div><h4>Special attacks</h4>${CL([`<b>Two weapons:</b> one combined check using the lower skill and lower characteristic against the harder difficulty, +1 difficulty. A hit lands the first weapon; ${Y.a}${Y.a} or ${Y.x} lands the second.`,
      `<b>Unarmed:</b> Brawl; damage = Brawn; crit 5; Disorient 1, Knockdown. May deal strain instead of wounds.`,`<b>Improvised weapon:</b> Melee, with an automatic ${Y.t}; crit 5. Small: Brawn+1. Medium: Brawn+2, Cumbersome 2. Large: Brawn+3, Cumbersome 4. ${Y.t}${Y.t} or ${Y.y}: it breaks.`])}</div>
    <div><h4>Adversaries</h4>${CL([`<b>Minions</b> fight as a group: one wound track (threshold × number); each threshold of damage drops one. No strain (it becomes wounds); no skill ranks alone, but +1 rank per minion beyond the first; any Critical Injury kills one.`,
      `<b>Rivals</b> work like PCs but have no strain (it becomes wounds) and are out once past their wound threshold.`,`<b>Nemeses</b> use all the PC rules, strain and Critical Injuries included.`])}</div></div>`],

  ['crits', '6 · Critical Injuries', 'the d100 table', `<p>Roll d100, +10 per Critical Injury already suffered, + the weapon's Vicious rating × 10. Healing one takes a Medicine check at its severity.</p>
    ${CT(['d100','Severity','Result'],[['01–05',D('d'),'<b>Minor Nick:</b> 1 strain.'],['06–10',D('d'),'<b>Slowed Down:</b> may only act in the last allied initiative slot next turn.'],['11–15',D('d'),'<b>Sudden Jolt:</b> drops whatever is in hand.'],
      ['16–20',D('d'),'<b>Distracted:</b> no free maneuver next turn.'],['21–25',D('d'),'<b>Off-Balance:</b> ' + D('k') + ' on the next check.'],['26–30',D('d'),'<b>Discouraging Wound:</b> flip one Light Destiny point to Dark (reverse for an NPC).'],
      ['31–35',D('d'),'<b>Stunned:</b> staggered until the end of the next turn.'],['36–40',D('d'),'<b>Stinger:</b> next check is one step harder.'],['41–45',D('dd'),'<b>Bowled Over:</b> knocked prone, 1 strain.'],
      ['46–50',D('dd'),'<b>Head Ringer:</b> Intellect and Cunning checks one step harder this encounter.'],['51–55',D('dd'),'<b>Fearsome Wound:</b> Presence and Willpower checks one step harder this encounter.'],['56–60',D('dd'),'<b>Agonizing Wound:</b> Brawn and Agility checks one step harder this encounter.'],
      ['61–65',D('dd'),'<b>Slightly Dazed:</b> disoriented this encounter.'],['66–70',D('dd'),'<b>Scattered Senses:</b> gains no ' + D('b') + ' this encounter.'],['71–75',D('dd'),'<b>Hamstrung:</b> no free maneuver this encounter.'],
      ['76–80',D('dd'),'<b>Overpowered:</b> the attacker may attack again at once, with the same pool.'],['81–85',D('dd'),'<b>Winded:</b> cannot choose to suffer strain this encounter.'],['86–90',D('dd'),'<b>Compromised:</b> all checks one step harder this encounter.'],
      ['91–95',D('ddd'),'<b>At the Brink:</b> 1 strain every time an action is taken.'],['96–100',D('ddd'),'<b>Crippled:</b> a limb is impaired until healed; checks using it are one step harder.'],['101–105',D('ddd'),'<b>Maimed:</b> a limb is lost for good; ' + D('k') + ' on everything else.'],
      ['106–110',D('ddd'),'<b>Horrific Injury:</b> −1 to a random characteristic until healed.'],['111–115',D('ddd'),'<b>Temporarily Lame:</b> one maneuver per turn until healed.'],['116–120',D('ddd'),'<b>Blinded:</b> upgrade all checks twice; Perception and Vigilance three times.'],
      ['121–125',D('ddd'),'<b>Knocked Senseless:</b> staggered this encounter.'],['126–130',D('dddd'),'<b>Gruesome Injury:</b> −1 to a random characteristic, permanently.'],['131–140',D('dddd'),'<b>Bleeding Out:</b> 1 wound and 1 strain each turn until healed; past the wound threshold, another Critical Injury per 5 wounds.'],
      ['141–150',D('dddd'),'<b>The End is Nigh:</b> dies after the last initiative slot of the next round.'],['151+','—','<b>Dead.</b>']])}
    <p><b>Random characteristic (d10):</b> 1–3 Brawn · 4–6 Agility · 7 Intellect · 8 Cunning · 9 Presence · 10 Willpower.</p>`],

  ['quals', '7 · Weapon and item qualities', 'what each quality does', `<p>Active qualities cost ${Y.a}${Y.a} to trigger unless noted; a rated quality lasts or counts as many rounds or points as its rating.</p><div class="cols"><div>
    ${CL([`<b>Accurate:</b> ${D('b')} per rating.`,`<b>Auto-fire:</b> attack at +1 difficulty; ${Y.a}${Y.a} per extra hit, on the same or another target.`,`<b>Blast:</b> ${Y.a}${Y.a}: everyone engaged with the target takes the rating in damage. On a miss, ${Y.a}${Y.a}${Y.a} still catches the target and those engaged.`,
      `<b>Breach:</b> ignore 1 armor (10 soak) per rating.`,`<b>Burn:</b> the target takes the weapon's base damage each round for the rating.`,`<b>Concussive:</b> the target is staggered for the rating.`,
      `<b>Cortosis:</b> a weapon is immune to Sunder; armor is immune to Pierce and Breach.`,`<b>Cumbersome:</b> needs Brawn equal to the rating, or +1 difficulty per point short.`,`<b>Defensive:</b> +rating melee defense. <b>Deflection:</b> +rating ranged defense.`,
      `<b>Disorient:</b> the target is disoriented for the rating.`,`<b>Ensnare:</b> the target is immobilized for the rating; a ${D('ddd')} Athletics check breaks free.`,`<b>Guided:</b> ${Y.a}${Y.a}${Y.a} on a miss: attack again at the end of the round with ability dice equal to the rating.`,
      `<b>Inaccurate:</b> ${D('k')} per rating.`])}</div><div>
    ${CL([`<b>Inferior:</b> an automatic ${Y.t}; weapons −1 damage; armor −1 defense and +1 encumbrance.`,`<b>Ion:</b> damage is dealt as system strain (or strain to droids).`,`<b>Knockdown:</b> ${Y.a}${Y.a}, +1 ${Y.a} per silhouette above 1: the target is prone.`,
      `<b>Limited Ammo:</b> that many shots, then a maneuver to reload with fresh ammunition.`,`<b>Linked:</b> ${Y.a}${Y.a} per extra hit on the same target, up to the rating.`,`<b>Pierce:</b> ignore 1 soak per rating.`,
      `<b>Prepare:</b> that many preparation maneuvers before firing.`,`<b>Slow-Firing:</b> wait that many rounds between shots.`,`<b>Stun:</b> also inflicts the rating in strain. <b>Stun Damage:</b> deals strain only.`,
      `<b>Sunder:</b> ${Y.a}: damage the target's item one step (minor → moderate → major → destroyed).`,`<b>Superior:</b> an automatic ${Y.a}; weapons +1 damage; armor +1 soak and −1 encumbrance.`,`<b>Tractor:</b> the target cannot move; a Piloting check at the rating breaks free.`,
      `<b>Unwieldy:</b> needs Agility equal to the rating, or +1 difficulty per point short.`,`<b>Vicious:</b> +10 × rating on the Critical Injury roll.`])}</div></div>`],

  ['force', '8 · The Force', 'power checks, the dark side, Morality and Conflict', `<div class="cols"><div>
    <h4>Using a power</h4>${CL([`<b>Power check:</b> roll ${D('F')} equal to your Force rating, minus any committed dice. Each ${Y.l} is a Force point to spend on the power's effects.`,
      `<b>Using the dark side:</b> you may also spend ${Y.n} results, but only by flipping a Light Destiny point, suffering strain equal to the ${Y.n} used, and taking that much Conflict.`,
      `<b>Dark side Force users</b> (Morality below 30) work the other way round: ${Y.n} is free, ${Y.l} costs the Destiny flip and strain.`,
      `<b>Committing dice:</b> some effects need Force dice set aside while they last. Your Force rating counts as that much lower meanwhile.`,
      `<b>Combined check:</b> roll the Force dice with a skill check. The skill check must succeed <b>and</b> you must make enough Force points.`,`<b>Resisted:</b> against an unwilling important target the power becomes a combined check opposed by them, usually Discipline.`])}</div><div>
    <h4>Morality and Conflict</h4>${CL([`Conflict comes from spending ${Y.n} on a power, from dark deeds, and from some failed fear checks.`,`End of session: Morality changes by <b>1d10 − Conflict</b>.`,
      `<b>Below 30: dark side.</b> Stays so until Morality passes 70. Below 20: strain threshold −1, wound threshold +1. Below 10: −2 and +2.`,`<b>Above 70: light side paragon.</b> Above 80: strain threshold +1. Above 90: +2.`,
      `<b>Triggered Morality:</b> at session start roll d100; the character whose Morality is closest is tempted this session through their emotional strength and weakness, and their end-of-session change is doubled.`])}
    ${CT(['Conflict','For'],[['1','Knowing inaction · lying for gain · reaching for violence first'],['2','Threats of violence · deliberate cruelty with words'],['2–3','Theft (less from the corrupt, more from those who cannot afford it)'],['3–4','Needless destruction'],
      ['4–5','Unprovoked violence'],['6–7','Needless cruelty to animals or simple droids'],['10','Torture'],['10+','Murder of the helpless']])}</div></div>`],

  ['hazards', '9 · Environment and hazards', 'falling, fire, vacuum, encumbrance, terrain', `<div class="cols"><div>
    <h4>Falling</h4>${CT(['Distance','Damage','Strain'],[['Short','10','10'],['Medium','30','20'],['Long','Incapacitated, Critical Injury at +50','30'],['Extreme','Incapacitated, Critical Injury at +75','40']])}
    <p>A ${D('dd')} Athletics or Coordination check softens it: ${Y.s} −1 damage each, ${Y.a} −1 strain each, ${Y.x} treat the fall as one band shorter.</p>
    <h4>Fire, acid and corrosive air</h4><p>Deals its rating in damage every round. Putting a fire out: Athletics, ${D('d')} on soft ground, ${D('dd')} on hard.</p>
    ${CT(['Rating','Examples'],[['1–2','Campfire, mild caustic, ash-choked air'],['3–5','Flammable liquid, industrial acid, chemical leak'],['6–9','Welding torch, weaponized acid, ammonia or chlorine atmosphere'],['10+','Lava, a blast furnace, wholly toxic atmosphere']])}
    <h4>Air and space</h4>${CL([`<b>Holding breath:</b> rounds equal to Brawn. <b>Suffocating:</b> 3 strain a round; once incapacitated, a Critical Injury every round.`,`<b>Vacuum:</b> as suffocation, plus 3 wounds a round.`,
      `<b>Gravity:</b> heavy adds up to ${D('kkk')} to Brawn and Coordination checks; light adds up to ${D('bbb')}. Zero-g: all movement is difficult terrain.`,`<b>Swimming</b> is difficult terrain; a swift current needs an Athletics check.`])}</div><div>
    <h4>Terrain and movement</h4><p><b>Difficult terrain</b> doubles the maneuvers needed to move. <b>Impassable terrain</b> needs a check, a tool or another way round.</p>
    <h4>Encumbrance</h4>${CL([`Threshold: <b>5 + Brawn</b>, plus bags.`,`Over it: ${D('k')} per point over on Brawn and Agility checks.`,`Over by Brawn or more: you lose your free maneuver (2 strain still buys one).`,
      `<b>Lifting:</b> Athletics, +1 difficulty per point the object is over your threshold; not possible at 5+ over. Helpers add their Brawn to the threshold.`,`<b>Hidden items:</b> the searcher adds ${D('b')} for each point of encumbrance above 1 on the largest hidden object.`,
      `<b>The right tool:</b> if the job can be done without it, having it adds ${D('b')}.`])}
    <h4>Flying creatures</h4><p><b>Hover:</b> ignores difficult and impassable ground; stays within medium range of it. <b>Winged flight:</b> must spend a maneuver each turn to stay up; can cross long to short in one maneuver.</p></div></div>`],

  ['healing', '10 · Recovery and healing', 'rest, medicine, stimpacks, bacta', `<div class="cols"><div>
    <h4>Getting it back</h4>${CL([`<b>End of an encounter:</b> a Simple Discipline or Cool check; recover 1 strain per ${Y.s}.`,`<b>A night's rest:</b> heal 1 wound and all strain.`,`<b>A week:</b> one Resilience check against a Critical Injury's severity to shake it off.`,
      `<b>Stimpack:</b> heals 5 wounds, then 4, 3 … each further one that day is one weaker. A night's rest resets it.`,`<b>Emergency repair patch:</b> heals a droid 3 wounds, with the same diminishing return.`,
      `<b>Bacta tank:</b> 1 wound per hour (per 6 hours if incapacitated); once a day a Resilience check against a Critical Injury. <b>Oil bath:</b> the same for droids, but cannot fix Critical Injuries.`])}</div><div>
    <h4>Medicine (Mechanics for droids)</h4>${CT(['Patient','Difficulty'],[['Wounds at half the threshold or less',D('d')],['Wounds above half the threshold',D('dd')],['Wounds above the threshold',D('ddd')],['A Critical Injury','its severity; one try per week']])}
    <p>Heals 1 wound per ${Y.s} and 1 strain per ${Y.a}. ${Y.x} an extra wound or a Critical Injury. ${Y.t} the patient takes 1 strain; ${Y.y} 1 wound. Treating yourself: +2 difficulty. One Medicine check per patient per encounter.</p></div></div>`],

  ['gear', '11 · Buying, selling and repairs', 'rarity, haggling, fixing gear', `<div class="cols"><div>
    <h4>Finding an item</h4><p><b>Negotiation</b> for legal goods, <b>Streetwise</b> for the black market.</p>
    ${CT(['Rarity','Difficulty','Example'],[['0–1','Simple','Glow rod, comlink'],['2–3',D('d'),'Medpac, scanner goggles'],['4–5',D('dd'),'Blaster pistol, blaster rifle'],['6–7',D('ddd'),'Cybernetic limb, cortosis gauntlets'],['8–9',D('dddd'),'Thermal detonator, rare crystal'],['10',D('ddddd'),'Lightsaber']])}
    ${CT(['Where you are','Rarity'],[['A primary Core World','−2'],['Other Core World · on a major trade lane','−1'],['Colony, Inner Rim or other civilized world','+0'],['Mid Rim · recently settled or out of the way','+1'],['Outer Rim · frontier','+2'],['Wild Space','+3'],['Uncivilized world','+4']])}</div><div>
    <h4>Selling</h4><p>Same skills. ${Y.s} a quarter of its value · ${Y.s}${Y.s} half · ${Y.s}${Y.s}${Y.s} three quarters. ${Y.t}${Y.t}${Y.t} or ${Y.y}: the deal goes sour.</p>

  mod:     [['Applies to', it=>esc(it.c)], ['Price', it=>fmtPrice(it)+restBadge(it),'num'], ['Rare', rareCell,'num'], ['HP', it=>numCell(it,'hp'),'num'], ['Requires', it=>cell(it.req),'txt'], ['Features', it=>esc(itemText(it)),'txt']],
};
const colsFor = g => !g ? ITEM_COLS.all : g==='Armour' ? ITEM_COLS.armour : WEAPON_GROUPS.includes(g) ? ITEM_COLS.weapon : g==='Modifications' ? ITEM_COLS.mod : ITEM_COLS.gear;

function itemsSet(k, v){
  ITEMS_UI[k] = v;
  if(k==='g'){ ITEMS_UI.c=''; if(!WEAPON_GROUPS.includes(v) && v) ITEMS_UI.sk=''; }
  renderItems();   // view-only change: no state touched, so no full render / sync
}
const hbList = () => (S.homebrew||[]).map(h=>Object.assign({hb:true}, h));
const itemByKey = key => key[0]==='c' ? CATALOG[+key.slice(1)] : hbList().find(h=>h.id===key.slice(1));
const hayOf = it => (it.n+' '+it.c+' '+(it.sk||'')+' '+(it.q||'')+' '+(it.f||'')+' '+(it.req||'')+' '+(it.d||'')).toLowerCase();
function itemsFiltered(){
  const u = ITEMS_UI, words = u.q.toLowerCase().split(/\s+/).filter(Boolean);
  const all = CATALOG.map((it,i)=>[it,'c'+i]).concat(hbList().map(h=>[h,'h'+h.id]));
  const list = all.filter(([it])=>{
    if(u.g && it.g!==u.g) return false;
    if(u.c && it.c!==u.c) return false;
    if(u.sk && it.sk!==u.sk) return false;
    if(u.hideR && it.r) return false;
    if(!words.length) return true;
    const h = it.hb ? hayOf(it) : (it._h ??= hayOf(it));   // catalog records cache their haystack
    return words.every(w=>h.includes(w));
  });
  const last = v => v==null ? Infinity : v;
  if(u.sort==='price') list.sort((a,b)=>last(a[0].p)-last(b[0].p) || a[0].n.localeCompare(b[0].n));
  else if(u.sort==='rare') list.sort((a,b)=>last(a[0].ra)-last(b[0].ra) || a[0].n.localeCompare(b[0].n));
  else list.sort((a,b)=>a[0].n.localeCompare(b[0].n));
  return list;
}

function hbSet(id, k, v){

  else if(['p','ra','e','hp'].includes(k)){ const n = parseFloat(v); if(isNaN(n)) delete h[k]; else h[k] = Math.max(0, n); }

function hbDel(id){

function giveItem(key, id){
  const it = itemByKey(key), cs = id && st(id); if(!it || !cs) return;
  const row = rowFromDb(it), type = row.type;
  cs.inv.push(row);
  const d = itemDetails(it);
  logMsg(`🛒 ${cfg(id).name} picks up <b>${esc(it.n)}</b> (${type}, enc ${it.e||0}${it.p!=null?`, ${it.p.toLocaleString('en-US')} cr`:''}${it.r?', restricted':''}) from the catalog.${d?` <span style="opacity:.8">${esc(d)}</span>`:''}`, 'lg');
  render();
}

/* ================================================================
   RULES REFERENCE
   ================================================================ */
function buildRules(){

  const ladderHours = (key, mult=1) => NEEDS[key].tiers.reduce((h,t,i,ts)=> ts[i+1] ? h + (ts[i+1].min-t.min)/(t.rate*mult) : h, 0);

  <h2>How it works</h2>
  <p>The game clock starts each day at <b>00:00</b> and can advance in 15-minute steps (+15 min, +30 min, +1 hr, or a custom span). Everyone begins fully provisioned with <b>all needs at 0</b>. <b>Organics</b> track five needs — 💧 thirst, 🍞 hunger, 🧼 hygiene, 😴 sleep debt, and ⚡ fatigue (0 = satisfied → 100 = critical); <b>droids</b> (BD-1, Alpha) track 🔋 charge and 🔧 wear. Needs rise with <b>environment</b>, <b>activity</b>, <b>encumbrance</b>, and <b>conditions</b>; organics also benefit from <b>Force commitment</b> (though the Force can't keep you clean).</p>

  <b>Droids: Degradation = 55% × charge past the halfway mark (doubled) + 45% Wear</b> (a single combined meter: a pack runs clean to 50%, then every point of drain counts double) <br>+8 for <i>each</i> meter at 70+ (deprivations compound). Model traits (BD-1's thrift, Alpha's sealed chassis) slow how fast the meters fill, not the formula.</p>

  <h2>⏳ Timed statuses (eating, resting, sleeping…)</h2>
  <p>Recovery actions are <b>statuses tied to the party clock</b> — benefits arrive gradually as time advances, and any status can be <b>canceled</b> (✖ on its badge), keeping only what was already gained — a meal abandoned before the halfway point goes back in the pack; the character returns to normal. Starting a new status replaces the current one, and <b>picking a new activity from the dropdown also cancels the status</b> — you stop eating when you start running.</p>
  <table><tr><th>Status</th><th>Takes</th><th>Total effect</th><th>Cost</th></tr>

  <tr><td>🍪 Snack (instant, on the move)</td><td>—</td><td>a third of a ration</td><td>1 snack</td></tr>

  <p><b>Eating caps:</b> while <b>Dehydrated+ (thirst ≥ ${REHYDRATE.thresh})</b> the body can't process food — meals and snacks restore only <b>half</b> their points. At <b>Starving+ (hunger ≥ ${REFEED.thresh})</b> refeeding is gradual and dangerous: only <b>${Math.round(REFEED.frac*100)}%</b> of each careful meal is absorbed, spaced hours apart — gorging triggers <b>refeeding shock</b> (a 🤒 Sick stack, GM's call; the food is wasted). Climbing out of Emaciated takes days of careful eating and rest.</p>

  <p>Cold never lowers water needs — dry air, heavier breathing and cold diuresis keep losses at or above temperate while thirst is felt less — but it does raise calorie burn. Species/model adaptations (Tann's Twi'lek heat tolerance ~60% off, Merrin's Zabrak cold tolerance ~40% off, Alpha's sealed chassis) shrink every extra the climate adds — water or calories, fatigue, the Chilled/Overheated condition and its onset chance. Prolonged exposure can inflict 🥵 Overheated / 🥶 Chilled automatically (${Math.round(ENV_COND_CHANCE.scorching*100)}%/hr in extreme environments, ${Math.round(ENV_COND_CHANCE.hot*100)}%/hr in Hot/Cold) — the GM may waive or remove these with proper gear or shelter.</p>

  <h2>🎒 Inventory, auto-tracked consumables &amp; standard weights</h2>
  <p>The inventory is edited on each character's <b>sheet</b> (Sheets tab) and listed on the Tracker card. Only items ticked <b>Carry</b> on the sheet appear on the card, weigh anything, or can be eaten or used; the card's own <b>Eq</b> tick marks what is in hand or worn. Every item links to an entry in the Items database, which supplies its description and starting stats; an <b>alias</b> is the name the card shows. Items with <b>Carry</b> unticked are stowed in the character's <b>Personal Item Storage Crate</b>, which holds <b>${CRATE_CAP} encumbrance</b> for everyone (stowed armor counts at its full encumbrance, a stowed bag counts ${BAG_STOWED_ENC}); going over only raises a warning. Food comes in three inventory types — <b>Snack</b>, <b>Ration</b> and <b>Meal</b> — and each hunger button eats <b>one item</b> of its type; the stimpack button uses one Stimpack. The canteen and droid power packs are tracked on the card and appear in the inventory in italics. Current encumbrance is always the computed sum (qty × enc, rounded up); ~1 enc ≈ 2 kg carried. <b>Armor never counts toward encumbrance</b> (its weight is ignored whatever you enter); <b>weapons and Gear (worn)</b> both do count.</p>

  <p>Each carried <b>weapon</b>, <b>armor</b> or <b>tool</b> ticked <b>Eq</b> (equipped) on the card shows its own <b>🔧 Wear</b> track (0 = pristine → 100 = broken). Other gear has no wear track and cannot be equipped. Worn tools follow the same Setback table as weapons; press <b>use</b> after a hard job. Worn weapons add Setback (table below); worn <b>armor protects less</b>, and the sheet's soak and defense drop automatically — ${ATIERS.filter(t=>t.defLoss||t.soakLoss).map(t=>`<b>${t.name}</b> (${t.min}+): ${stripTags(t.fx).replace(/\.$/,'').replace(/^.*— /,'')}`).join(' · ')}. Press <b>hit</b> when armor takes a solid blow. Equipment degrades two ways: <b>ambient wear</b> from grit, damp and knocks while equipped (~+${(WEAR_PER_HOUR*24).toFixed(1)}/day in temperate — pristine → broken in about ${WEAR_DAYS} days if never cleaned — accelerated by <b>harsh environments</b>, up to ${ENVS.scorching.maint}× in Extreme Heat, so ~${Math.round(WEAR_DAYS/ENVS.scorching.maint)} days there), <b>plus</b> +${WEAR_PER_ATTACK} each time an attack is rolled with a weapon (the card's <b>⚔ attack</b> button or the sheet's), and +${WEAR_PER_USE} each time armor takes a <b>hit</b>. The attack button adds a worn weapon's Setback dice for you. <b>tune-up</b> (${fmtDur(STATUSES.tuneup.dur)} of work, then a <b>Mechanics</b> check — Easy, Average or Hard as the wear worsens) relieves −${GEAR_TUNEUP} (a quick bench touch-up); <b>overhaul</b> (${fmtDur(STATUSES.overhaul.dur)}, then Mechanics one step harder; a failure still clears half) resets wear to 0 (a full strip-down; GM approves). Click the <b>🔧 Wear</b> label to set a value directly.</p>

  <h2>✨ Force commitment (Cal, Bode, Merrin, Pike)</h2>
  <p><b>✨ Morichro:</b> Force sensitives may commit Force dice — <b>up to their Force rating</b> (set on the Sheets tab; ${FORCE_COMMIT_MAX} at most) — to sustain their bodies. Each committed point slows <b>all four needs by ${FORCE_PER_PT*100}%</b> (8 points = −64%). Committed points remain unavailable for other Force powers until released. Merrin channels this through Nightsister magick.</p>

  <h2>💧 Thirst ladder</h2>
  <p>Reaches Collapse in <b>~${thirstDays} days</b> (~${Math.round(ladderHours('water'))} h) walking in a temperate climate; about twice that resting in shade, well under two days in desert heat. Each tier carries its own accrual rate: thirst quickens as it deepens, because every percent of body water lost hurts more than the last.</p>
  ${ladderTable('water')}
  <p><b>Recovery:</b> clean water pulls thirst down, and the arithmetic is honest — a character's <b>oz water/day</b> is what a day of walking costs them, so a full ${OZ_PER_CANTEEN} oz canteen removes ~${ozToPts(cal, OZ_PER_CANTEEN).toFixed(0)} pts for Cal (a third of his day), ~${ozToPts(pike, OZ_PER_CANTEEN).toFixed(0)} for Pike's small frame, ~${ozToPts(cfg('bode'), OZ_PER_CANTEEN).toFixed(0)} for Bode. Staying level means roughly three canteens a day on the march, far more in heat. From <b>Dehydrated (${REHYDRATE.thresh}+)</b> a cramping gut keeps down only ~${REHYDRATE.capOz} oz per ${Math.round(REHYDRATE.waitHrs*60)} minutes — chugging past that is wasted and the tracker refuses a second sip until the clock moves, so climbing out of the deep tiers takes real in-game time and a safe place to rest. <b>Dirty/unfiltered water</b> forces a Resilience check; failure adds a 🤒 Sick stack — which accelerates the thirst clock rather than relieving it. Desperate, but sometimes the only option.</p>

  <h2>🍞 Hunger ladder</h2>
  <p>Reaches Collapse in <b>~${hungerDays} days</b> for a default frame walking in a temperate climate — roughly a month, the realistic low end for a lean, active adult with water. Appetite hits fast (Hungry about six hours after a meal, Gnawing after a day without food, Famished by day ${Math.round(tierAt('hunger','Famished')/24)}) to encourage daily eating, then a long slow burn as the body rations reserves: Starving around day ${Math.round(tierAt('hunger','Starving')/24)}, Emaciated around day ${Math.round(tierAt('hunger','Emaciated')/24)}. A ration is one meal: an Average build needs three a day, and eating on schedule holds the line at Hungry or below.</p>
  <p><b>Build matters:</b> a character's build (set on the sheet) is a multiplier on the whole ladder — ${Object.keys(BUILDS).filter(k=>!BUILDS[k].droid).map(k=>`<b>${k}</b> ×${BUILDS[k].hunger}`).join(', ')}. A Small frame reaches Collapse in ~${days(ladderHours('hunger', BUILDS.Small.hunger))} days without food.</p>
  ${ladderTable('hunger')}
  <p><b>Recovery:</b> food pulls the meter down, but slower than water pulls thirst — you can't undo weeks of starvation with one meal. A ration is one meal: it removes a third of an Average build's daily hunger (~${pts1(-STATUSES.ration.deltas.hunger)} pts), sized to each build so ${Object.keys(BUILDS).filter(k=>!BUILDS[k].droid).map(k=>`${k} ${BUILDS[k].rations}`).join(', ')} rations a day hold the meter level at light activity. A cooked meal is a quarter more; a snack is a third of a ration. See the eating caps above for the <b>refeeding</b> and <b>hunger–thirst</b> rules. <b>Spoiled or contaminated food</b> forces a Resilience check; failure adds a 🤒 Sick stack.</p>

  <h2>🧼 Hygiene ladder</h2>
  <p>Reaches Diseased in <b>~${hygDays} days</b>. Grime is decelerating — you feel grubby within days, but genuine disease takes a month. Hygiene never threatens life on its own: its teeth are the 🤒 Sick stacks and social penalties — with one upside: filth makes you scarier (Coercion stays Boosted at every dirty tier).</p>
  ${ladderTable('hygiene')}

  <h2>😴 Sleep ladder (sleep debt — no death)</h2>
  <p>Mental and <i>time-awake-driven</i>: +${SLEEP.awakeRate}/hr while conscious regardless of activity — one tier per full day awake. A long day leaves you <b>Drowsy</b> (~${sleepAt('Drowsy')} h awake); <b>microsleeps begin around the ${sleepAt('Sleep-Deprived')} h mark</b> (Sleep-Deprived); <b>Delirious</b> at ~${sleepAt('Delirious')} h; <b>Wrecked at ~${sleepAt('Wrecked')} h</b> — ${days(sleepAt('Wrecked'))} days without sleep. A worn-out body accelerates the slide (Exhausted fatigue: +${fatigueSleepPct}%). Only proper sleep clears it — and from <b>Delirious or worse a single night recovers at most ${SLEEP.deepDebtCap}</b>, so it takes two nights; quiet rest slows the tick to ×${SLEEP.restingMult} but never pays it off; the ${fmtDur(STATUSES.med30.dur)} Force trance counts as ${tranceMin} min of sleep.</p>
  ${ladderTable('sleep')}

  <h2>⚡ Fatigue ladder (physical — no death)</h2>
  <p>Physical and <i>activity-driven</i> — it climbs from doing, not time, and is managed all day with rest breaks. A full day's unbroken march leaves you Spent; sustained combat gets there in ~3 h.</p>
  ${ladderTable('rest')}
  <p><b>Coupling:</b> while <b>Sleep-Deprived (51+)</b>, fatigue accrues <b>×1.5</b> and rest recovers <b>25% less</b> — tired minds wear out bodies faster. At <b>Exhausted (76+) fatigue</b>, sleep debt accrues <b>+50%</b> — a worn-out body craves rest. Sleep clears both; rest chips both; meditation is how a Jedi buys alertness without a bunk.</p>

  <h2>💫 Strain vs ⚡ Fatigue — two meters, two clocks</h2>
  <p><b>Strain</b> is the core-rules pool: mental <i>and</i> physical stress at the scale of a scene — spent by the player (a second maneuver, talents, Force powers), dealt by stun weapons, fear and Threat, recovered by Cool/Discipline at the end of an encounter and by rest. At the threshold the character is <b>incapacitated</b> — narrate it as collapse, freezing or a breakdown depending on what filled it. <b>Fatigue</b> is this tracker's slow physical meter at the scale of a day: it climbs with hours of activity and falls with rest, sleep and food, and it never knocks anyone out by itself.</p>
  <p><b>The one bridge between them is the strain threshold.</b> Nothing in the tracker adds strain by the hour. Instead every need tier and condition that wears a character down <b>lowers their strain threshold</b> while it lasts, so a run-down character fights on less headroom but still chooses when to spend it. The card shows the base threshold (editable) and, when modifiers apply, the effective one — hover it for the breakdown. Modifiers stack; the effective threshold never drops below 1. Sleep debt is the exception that proves the rule: at <b>Wrecked</b> the body itself gives out, so the character must pass a Daunting Resilience check each hour awake or fall asleep — sleep, not unconsciousness.</p>
  <table><tr><th>Source</th><th>State</th><th>Strain threshold</th></tr>${stModRows}</table>
  <p>Still at the table, by choice: Parched, Famished and Winded make <b>strenuous actions cost +1 strain</b>; the GM's Threat spends below can inflict a point. Nothing else — not even a stimpack — moves the strain number itself; a stimpack widens the threshold by ${STIM.stMod} while it lasts.</p>

  <h2>🖼 Portraits, scene, location &amp; travel</h2>
  <p><b>Portraits:</b> each card shows the image file the GM has placed at <code>img/&lt;id&gt;.jpg</code> (or <code>.png</code>) in the site's repository, tinted red as damage mounts — clear at 0 wounds up to a ${HURT_MAX_OPACITY*100}%-opacity red overlay at the wound threshold. A missing file simply shows no portrait.</p>
  <p><b>Scene:</b> if the GM has placed <code>img/scene.jpg</code> in the repository, an ambience banner shows it above the cards together with the <b>current location and environment</b>.</p>
  <p><b>Location &amp; travel:</b> type the current location, a destination, and travel hours. Every advanced step counts down the ETA; on arrival the destination becomes the current location and the log announces it.</p>
  <p><b>Event log:</b> it sits under the Objectives line on every tab (click its title for a taller view) and keeps the last ${LOG_MAX} entries. ⬇ export saves it all as a text file for the lore vault's Inbox. Type in the note field and press Enter (or 📝 add note) to drop a freeform player/GM note into the log, timestamped at the current game time — handy for plot beats, rolls, or reminders. The ⟳ clear button empties the log without touching anything else. Notes are saved with everything else.</p>

  <h2>💾 Saving &amp; sessions</h2>
  <p>The tracker <b>keeps itself on this device</b>: every change is stored in the browser, so closing the tab or reloading the page brings the session back where it was. <b>💾 Save</b> downloads a JSON file (a backup, or to hand the session to another device); <b>📂 Load</b> reads one back — saves from older builds are patched on the way in, and characters the current build doesn't know are dropped with a note in the log. <b>🆕 New</b> starts over at Day 1, 00:00 after asking (in a live room, it resets the room for everyone). Browser storage is per site and per browser; clearing site data clears the session, so Save before anything drastic.</p>

  <h2>🔗 Live multiplayer</h2>
  <p>The <b>🔗 Live</b> bar at the top puts your whole table on one shared tracker in real time. One person clicks <b>✨ Create</b> to start a <b>room</b>, then <b>🔗 Copy link</b> and sends it to the group — anyone who opens that link joins automatically. (You can also paste a room code or link into the <b>Room</b> box and click <b>Join</b>.) Your room is remembered on this device, so you rejoin automatically next time; the status light reads <b style="color:var(--good)">● live</b> when you're connected.</p>
  <p><b>Everyone edits, and changes appear for everyone within about a second — no save or refresh button.</b> Edits are merged per character, so two people updating <i>different</i> characters at the same moment won't overwrite each other. If a live update arrives while you're typing in a field, it waits until you click away rather than yanking the box out from under you. Put your name in the <b>You</b> box so the group can see who's driving. The shared log is best-effort — two log lines created in the same instant can occasionally collide, though the underlying character changes still merge.</p>
  <p><b>Portraits, the scene banner &amp; the ship image are GM-set</b> — they load from the site's <code>img/</code> folder (which only the GM can change), so players always see the same art and can't alter it. The <b>Show</b> chips are a personal view filter and stay on your own screen. The <b>💾 Save</b> / <b>📂 Load</b> file buttons still export/import a private JSON snapshot for backups or solo/offline play, independent of any room.</p>

  <h2>Recovery</h2>
  <p><b>Sleep</b>: a full night (8 hrs; 10 for Kata) zeroes sleep debt and heavily restores fatigue — one 8 h sleep clears ~100 sleep debt and ~80 fatigue. <b>Strain</b> recovers with rest, as the core rules intend: quiet Resting restores <b>1 per hour</b>, sleep (or droid standby) restores <b>⌈threshold ÷ 8⌉ per hour</b> (${sleepStrainPerHr(st('cal'))}/hr for Cal), and a sleep of <b>${SLEEP.fullNightHrs} h or more clears it entirely</b> on waking. A character knocked out by strain is treated as Resting, so they come round on their own — and because needs only shrink the threshold rather than add strain, satisfying the need (a drink, a meal, a nap) can bring them round instantly. Encounter recovery (Cool/Discipline) is still the − button. <b>Wounds</b> from dehydration/starvation heal only via medicine, stimpacks, or bacta <i>after</i> the underlying need is back below 50 — and remember: Emaciated blocks natural healing entirely, and Squalid or 2+ Sick stacks halve healing. Droid wounds need Mechanics repairs. Organic effects come straight from each need's current tier — satisfy the need and its penalties lift as you cross back down each threshold; the droid degradation meter has no separate track and falls automatically as charge/wear are tended.</p>
  <h2>🚀 Mantis (Longshot) — ship card</h2>
  <p>The <b>🚀 Mantis</b> tab tracks the ship on the same party clock. Set its <b>flight status</b> and every advance of the clock burns fuel at that rate; systems also wear with sustained operation. Fuel, hull, strain, system conditions, torpedo ammo and crew assignments are all saved and loaded with everything else.</p>

/* ================================================================
   MULTIPLAYER SYNC — live shared "room" via Firebase Realtime Database.
   Everyone in a room edits the same tracker and changes propagate in <1s.
   - Anyone can edit. Writes are per-character, so two people editing
     DIFFERENT characters don't clobber each other.
   - A live update that lands while you're typing in a field is held until
     you finish (focus guard), then applied.
   - Images are GM-set repo files (img/…) and are never synced.
   - 'visible' (the Show chips) stays local to each device — a view pref.
   Known limit: the shared log is last-write-wins, so two log entries created
   within the same moment can collide; character edits still merge cleanly.
   (Dice rolls avoid this: they live in rooms/<id>/rolls, appended with push().)
   ================================================================ */

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ---- helpers -------------------------------------------------- */
// The slice of S that syncs: everything EXCEPT local view prefs (visible) and
// GM image fields. Deep-cloned so callers may diff or store it freely.
function syncSubset(state){
  const c = JSON.parse(JSON.stringify(state));
  delete c.visible; delete c.ambImg;
  if(c.ship) delete c.ship.img;
  if(Array.isArray(c.chars)) c.chars.forEach(ch=>{
    delete ch.img;
    delete ch.invOpen; delete ch.allInvOpen; delete ch.customOpen; delete ch.gearOpen; delete ch.armorOpen; delete ch.toolsOpen; delete ch.consOpen;   // per-player UI state stays local
    if(ch.invV===2){   // pre-overhaul counters from a browser that hasn't refreshed: ignore, don't echo, don't fight over them
      delete ch.rationsStock; delete ch.snacks; delete ch.stims;
      if(Array.isArray(ch.inv)) ch.inv = ch.inv.filter(it=>!(it && LEGACY_AUTO.includes(it.auto)));
    }
  });
  return prune(c);
}
// RTDB refuses to store nulls and empty arrays/objects (it deletes the key
// instead), so strip them from the wire format too — otherwise our local copy
// never matches the server echo, every diff looks dirty, and the 3-way merge
// sees phantom edits. migrate() restores the defaults on the way back in.
function prune(v){
  if(Array.isArray(v)){ v.forEach(prune); return v; }
  if(v && typeof v==='object'){
    for(const k of Object.keys(v)){
      const x = v[k];
      if(x===null || x===undefined){ delete v[k]; continue; }
      if(typeof x==='object'){
        prune(x);
        if((Array.isArray(x) ? x.length : Object.keys(x).length)===0) delete v[k];
      }
    }
  }
  return v;
}
// Firebase returns arrays as index-keyed objects; turn those back into arrays.
function arrayify(v){
  if(v && typeof v==='object' && !Array.isArray(v)){
    const keys = Object.keys(v);
    if(keys.length && keys.every(k=>/^\d+$/.test(k)))
      return keys.sort((a,b)=>a-b).map(k=>v[k]);
  }
  return v;
}
// Order-independent serialization, so RTDB key reordering isn't seen as a change.
function stable(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
}
const same = (a,b) => stable(a)===stable(b);

/* ---- focus guard: is the user mid-edit in a field? ------------ */
function isEditing(){
  const a = document.activeElement; if(!a) return false;
  const t = (a.tagName||'').toUpperCase();
  if(t==='TEXTAREA' || t==='SELECT') return true;
  if(t==='INPUT'){ const ty=(a.type||'text').toLowerCase(); return ty!=='file' && ty!=='button' && ty!=='checkbox' && ty!=='radio'; }
  return a.isContentEditable===true;
}

/* ---- outbound: push local changes (debounced, per-character) --- */
// Local persistence: every change (render/logMsg → scheduleSync) also lands in this
// device's localStorage, debounced, so a reload or a discarded tab doesn't reset the
// session to Day 1. A joined room still wins on attach (first snapshot adopts the room).
const LOCAL_STATE_KEY = 'st_state';
function scheduleLocalSave(){
  clearTimeout(CLOUD.saveTimer);
  CLOUD.saveTimer = setTimeout(()=>{ try{ lsSet(LOCAL_STATE_KEY, JSON.stringify(S)); }catch(e){} }, 400);
}
function loadLocalState(){
  const raw = lsGet(LOCAL_STATE_KEY); if(!raw) return null;
  try{ const s = JSON.parse(raw); return (s && Array.isArray(s.chars)) ? migrate(s) : null; }catch(e){ return null; }
}
function resetAll(){
  const shared = CLOUD.db && CLOUD.room;
  if(!confirm(`Start a fresh session? Clock back to Day 1, 00:00, every need at 0.${shared?' This resets the shared room for everyone in it.':''} (💾 Save first to keep this one.)`)) return;
  const homebrew = S.homebrew || [];   // homebrew items are catalog entries, not session state — they survive a new session
  S = freshState(); S.homebrew = homebrew;
  logMsg('🆕 New session — Day 1, 00:00. All needs at 0, canteens full, droid packs charged.');
  rebuildLog(); render();
}
function scheduleSync(){
  scheduleLocalSave();
  if(!CLOUD.db || !CLOUD.room || CLOUD.applying || !CLOUD.synced) return;
  clearTimeout(CLOUD.syncTimer);
  CLOUD.syncTimer = setTimeout(pushLocal, 180);
}
function pushLocal(){
  if(!CLOUD.db || !CLOUD.room || CLOUD.applying || !CLOUD.synced) return;
  const cur = syncSubset(S), prev = CLOUD.shadow, updates = {};
  for(const k in cur){
    if(k==='chars'){
      const a = cur.chars||[], b = (prev&&prev.chars)||[];
      for(let i=0;i<a.length;i++) if(!same(a[i], b[i])) updates['chars/'+i]=a[i];
    } else if(k==='ship'){   // per-subkey, so concurrent edits to different ship systems don't clobber
      const a = cur.ship||{}, b = (prev&&prev.ship)||{};
      for(const kk of new Set([...Object.keys(a), ...Object.keys(b)]))
        if(!same(a[kk], b[kk])) updates['ship/'+kk] = a[kk]===undefined ? null : a[kk];
    } else if(!same(cur[k], prev?prev[k]:undefined)){
      updates[k]=cur[k];
    }
  }
  // a top-level key we emptied (the last countdown removed, the last homebrew item deleted) is pruned from
  // `cur` altogether, so the loop above never sees it — delete it on the server or it comes straight back
  for(const k in (prev||{})) if(!(k in cur)) updates[k] = null;
  if(!Object.keys(updates).length) return;
  const prevShadow = CLOUD.shadow;
  CLOUD.shadow = cur;                              // optimistic; on failure fall back to the last acknowledged
  CLOUD.db.ref('rooms/'+CLOUD.room+'/state').update(updates)   // shadow so the 2 s safety net resends the diff
    .then(()=> CLOUD.db.ref('rooms/'+CLOUD.room+'/meta').set({ by:CLOUD.player, ts:Date.now() }))
    .catch(e=>{ CLOUD.shadow = prevShadow; syncNote('Sync error: '+e.message, 'bad'); });
}

/* ---- inbound: a room snapshot arrived -------------------------- */
function onRoomSnap(remote){
  if(remote==null){                       // empty room → seed it with our current state
    CLOUD.shadow = null; CLOUD.synced = true; pushLocal(); return;
  }
  remote.chars = arrayify(remote.chars);
  remote.log   = arrayify(remote.log);
  if(CLOUD.shadow && same(syncSubset(remote), CLOUD.shadow)) return;  // our own echo — ignore
  if(isEditing()){ CLOUD.pending = remote; syncNote('Update waiting — finishing your edit…', 'ok'); return; }
  applyRemote(remote);
}
// 3-way merge so a player's own edits are never lost to an incoming update.
// base = state we last had from the server, local = our current, remote = incoming.
// Any key/character WE changed since base wins locally; everything else takes remote.
function threeWayMerge(base, local, remote){
  const out = JSON.parse(JSON.stringify(remote));
  base = base || {};
  for(const k in local){
    if(k==='chars'){
      const byId = arr => Object.fromEntries((arr||[]).map(ch=>[ch.id, ch]));
      const L=byId(local.chars), B=byId(base.chars);
      out.chars = (out.chars||[]).map(rc => (L[rc.id] && !same(L[rc.id], B[rc.id])) ? L[rc.id] : rc);  // we edited this character
      for(const id in L) if(!out.chars.some(rc=>rc.id===id)) out.chars.push(L[id]);                      // the room lacks it: add ours
    } else if(k==='ship'){   // merge ship one level deep, mirroring the per-subkey pushes
      const L=local.ship||{}, B=base.ship||{};
      out.ship = out.ship || {};
      for(const kk in L) if(!same(L[kk], B[kk])) out.ship[kk] = L[kk];         // we edited this system
      for(const kk in B) if(!(kk in L)) delete out.ship[kk];                   // we emptied this list
    } else if(!same(local[k], base[k])){
      out[k] = local[k];                                                     // we edited this field
    }
  }
  for(const k in base) if(!(k in local) && k!=='chars' && k!=='ship') delete out[k];   // we emptied this list (pruned keys vanish from `local`)
  return out;
}
function applyRemote(remote){
  CLOUD.applying = true;
  const remoteSub = syncSubset(remote);
  // On the very first snapshot adopt the room wholesale; afterwards merge so our
  // own in-flight edits survive an incoming update.
  const merged = (CLOUD.synced && CLOUD.shadow)
    ? threeWayMerge(CLOUD.shadow, syncSubset(S), remoteSub) : remoteSub;
  const localVisible = S.visible;
  const next = migrate(JSON.parse(JSON.stringify(merged)));
  next.visible = localVisible || {};
  for(const c of CHARS) if(next.visible[c.id]===undefined) next.visible[c.id]=true;
  for(const ch of next.chars){   // keep this player's own open panels open across remote updates
    const old = S && S.chars && S.chars.find(x=>x.id===ch.id);
    if(old){ ch.invOpen=old.invOpen; ch.allInvOpen=old.allInvOpen; ch.customOpen=old.customOpen; ch.gearOpen=old.gearOpen; ch.armorOpen=old.armorOpen; ch.toolsOpen=old.toolsOpen; ch.consOpen=old.consOpen; }
  }
  S = next;
  CLOUD.shadow = remoteSub;                 // server truth is the remote; preserved local diffs re-push below
  CLOUD.synced = true;
  rebuildLog(); render();
  CLOUD.applying = false;
  scheduleSync();                           // push any edits the merge preserved over the remote
  liveLabel();
}

/* ---- room lifecycle ------------------------------------------- */
function detachRoom(){
  if(CLOUD.ref){ CLOUD.ref.off(); CLOUD.ref=null; }
  if(CLOUD.rollsRef){ CLOUD.rollsRef.off(); CLOUD.rollsRef=null; }
  if(CLOUD._conn){ CLOUD._conn.off(); CLOUD._conn=null; }
}
function attachRoom(id){
  if(!CLOUD.db){ syncNote('Live sync unavailable (offline or Firebase blocked).', 'bad'); return; }
  detachRoom();
  CLOUD.shadow = null; CLOUD.synced = false; CLOUD.pending = null;
  CLOUD._conn = CLOUD.db.ref('.info/connected');
  CLOUD._conn.on('value', s=>{ CLOUD.online=!!s.val(); liveLabel(); });
  CLOUD.ref = CLOUD.db.ref('rooms/'+id+'/state');
  CLOUD.ref.on('value', snap=> onRoomSnap(snap.val()),
    err=> syncNote('Live error: '+err.message, 'bad'));
  // dice feed: its own node, appended with push(), so simultaneous rolls never collide
  CLOUD.rollsRef = CLOUD.db.ref('rooms/'+id+'/rolls').limitToLast(FEED_MAX);
  CLOUD.rollsRef.on('value', snap=>{ const list=[]; snap.forEach(ch=>{ list.push(ch.val()); }); setRolls(list); },
    err=> syncNote('Roll feed error: '+err.message, 'bad'));
}
function randomId(){
  const a = new Uint8Array(9);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a, b=>b.toString(16).padStart(2,'0')).join('');
}
function roomCreate(){
  if(!CLOUD.db){ syncNote('Live sync unavailable — are you offline?', 'bad'); return; }
  const id = randomId();
  setRoomId(id); attachRoom(id);
  syncNote('Live room created — click 🔗 Copy link and send it to your players.', 'ok');
  logMsg('🔗 Live room created ('+id.slice(0,6)+'…). Everyone with the link edits together in real time.');
}
function roomJoin(id){
  id = (typeof id==='string' ? id : (document.getElementById('roomIn')||{}).value || '').trim();
  const m = id.match(/room=([0-9a-fA-F-]+)/); if(m) id = m[1];      // accept a pasted share link
  if(!id){ syncNote('Enter a room code (or paste the share link) first.', 'bad'); return; }
  if(!CLOUD.db){ syncNote('Live sync unavailable — are you offline?', 'bad'); return; }
  setRoomId(id); attachRoom(id);
  syncNote('Joining room '+id.slice(0,6)+'…');
}
function roomLeave(){
  detachRoom(); setRoomId(null);
  CLOUD.synced = false; CLOUD.shadow = null; CLOUD.pending = null;
  const rin=document.getElementById('roomIn'); if(rin) rin.value='';
  loadLocalRolls();   // the room's roll feed stays with the room
  syncNote('Left the room — back to solo. Your local data is untouched.');
}
async function roomCopyLink(){
  if(!CLOUD.room){ syncNote('Create or join a room first.', 'bad'); return; }
  const url = location.href.split('#')[0] + '#room=' + CLOUD.room;
  try{ await navigator.clipboard.writeText(url); syncNote('Share link copied — send it to your players.', 'ok'); }
  catch(e){ syncNote('Copy failed — the link is in your address bar to copy manually.', 'bad'); }
}

/* ================================================================
   GM TAB — tools for the Game Master. So far: the species browser.
   species.js is generated from the vault by tools/import-species.py and
   loaded the first time the tab opens (like lore.js).
   SPECIES entry: { n, k icon key (img/species/k.png), a [br,ag,int,cun,wil,pr],
                    wt, st, xp, ab [[name,text]], sub [{n, ab, a?, wt?, st?, xp?}] }
   ================================================================ */
let SPECIES_DB = null, SPECIES_WAIT = null;
const GM_UI = { q:'', attr:'', sort:'name', sel:-1 };
function speciesLoad(cb){
  if(SPECIES_DB) return cb();
  if(typeof SPECIES!=='undefined'){ SPECIES_DB = SPECIES; return cb(); }
  const box = document.getElementById('gmDetail');
  if(SPECIES_WAIT){ SPECIES_WAIT.push(cb); return; }
  SPECIES_WAIT = [cb]; if(box) box.innerHTML = '<p style="color:var(--dim)">Opening the species guide…</p>';
  const sc = document.createElement('script'); sc.src = 'species.js';
  sc.onload = () => { SPECIES_DB = typeof SPECIES!=='undefined' ? SPECIES : null; const w = SPECIES_WAIT; SPECIES_WAIT = null; if(SPECIES_DB) w.forEach(f=>f()); else if(box) box.innerHTML = '<p style="color:var(--bad)">The species guide did not load.</p>'; };
  sc.onerror = () => { SPECIES_WAIT = null; if(box) box.innerHTML = '<p style="color:var(--bad)">The species guide did not load (species.js is missing).</p>'; };
  document.head.appendChild(sc);
}
const spIcon = s => s.k ? `<img src="img/species/${s.k}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
const spHay = s => s._h || (s._h = [s.n, ...s.ab.flat(), ...(s.sub||[]).flatMap(x=>[x.n, ...x.ab.flat()])].join(' ').toLowerCase());
function gmSet(k, v){ GM_UI[k] = v; renderSpecies(); }
function speciesFiltered(){
  const u = GM_UI, words = u.q.trim().toLowerCase().split(/\s+/).filter(Boolean), ai = u.attr==='' ? -1 : +u.attr;
  const list = SPECIES_DB.map((s,i)=>[s,i]).filter(([s])=>
    (ai<0 || s.a[ai]>=3 || (s.sub||[]).some(x=>x.a && x.a[ai]>=3)) && words.every(w=>spHay(s).includes(w)));
  if(u.sort!=='name') list.sort((x,y)=> y[0][u.sort]-x[0][u.sort] || x[1]-y[1]);
  return list;
}
function renderSpecies(){
  const grid = document.getElementById('gmGrid'); if(!grid || !SPECIES_DB) return;
  const u = GM_UI, sel = document.getElementById('gmAttr');
  sel.innerHTML = `<option value="">any characteristic</option>` + ATTRS.map(([k,n],i)=>`<option value="${i}"${u.attr===String(i)?' selected':''}>${n}</option>`).join('');
  document.getElementById('gmSort').value = u.sort;
  const list = speciesFiltered();
  document.getElementById('gmCount').innerHTML = `showing <b>${list.length}</b> of ${SPECIES_DB.length} species`;
  grid.innerHTML = list.map(([s,i])=>`<button class="spcard ${u.sel===i?'on':''}" id="spc_${i}" onclick="speciesPick(${i})">${spIcon(s)}<span><b>${esc(s.n)}</b>
    <small>${s.a.map((v,j)=>v>=3 ? `<i>${ATTRS[j][1].slice(0,2)} ${v}</i>` : v).join(' ')}</small><small>W ${s.wt} · S ${s.st} · ${s.xp} XP${s.sub?` · ${s.sub.length} sub`:''}</small></span></button>`).join('')
    || `<p style="color:var(--dim)">No species matches — try fewer words or another characteristic.</p>`;
  renderSpeciesDetail();
}
function speciesPick(i){
  const old = document.getElementById('spc_'+GM_UI.sel); if(old) old.className = 'spcard';
  GM_UI.sel = i;

}
function renderSpeciesDetail(){
  const box = document.getElementById('gmDetail'); if(!box) return;
  const s = SPECIES_DB[GM_UI.sel];
  if(!s){ box.innerHTML = `<p style="color:var(--dim)">Pick a species to see its characteristics, thresholds, starting XP and abilities. The six numbers on each card are Brawn, Agility, Intellect, Cunning, Willpower and Presence; a 3 or better is marked.</p>`; return; }
  const attrs = a => `<div class="spattrs">${a.map((v,j)=>`<div class="${v>=3?'hi':v<=1?'lo':''}"><b>${v}</b><span>${ATTRS[j][1].slice(0,3)}</span></div>`).join('')}</div>`;
  const abil = ab => ab.length ? `<ul>${ab.map(([n,t])=>`<li><b>${esc(n)}${t?':':''}</b> ${esc(t)}</li>`).join('')}</ul>` : '';
  const sub = x => { const a = x.a||s.a, wt = x.wt??s.wt, st = x.st??s.st, xp = x.xp??s.xp;
    const diff = [x.wt!=null && `Wounds ${wt+a[0]}`, x.st!=null && `Strain ${st+a[4]}`, x.xp!=null && `${xp} XP`].filter(Boolean).join(' · ');
    return `<div class="spsub"><b>${esc(x.n)}</b>${diff?`<small>${diff}</small>`:''}${x.a?attrs(x.a):''}${abil(x.ab)}</div>`; };
  box.innerHTML = `<div class="sphead">${spIcon(s)}<div><h3>${esc(s.n)}</h3>
      <small>Wounds <b>${s.wt+s.a[0]}</b> (${s.wt} + Brawn) · Strain <b>${s.st+s.a[4]}</b> (${s.st} + Willpower)</small><small>${s.xp} starting XP</small></div></div>
    ${attrs(s.a)}
    ${s.ab.length ? `<h4>Abilities</h4>${abil(s.ab)}` : ''}
    ${s.sub ? `<h4>Subspecies</h4><small style="color:var(--dim)">Each replaces only what it lists; the rest stays as above.</small>${s.sub.map(sub).join('')}` : ''}`;
}

function initCloud(){
  const savedName = lsGet('st_player');
  if(savedName){ setPlayerName(savedName); const el=document.getElementById('playerIn'); if(el) el.value=savedName; }
  try{
    if(typeof firebase!=='undefined' && FIREBASE_CONFIG.apiKey){
      firebase.initializeApp(FIREBASE_CONFIG);
      CLOUD.db = firebase.database();
    }
  }catch(e){ CLOUD.db=null; syncNote('Live sync unavailable: '+e.message, 'bad'); }
  // apply a remote update that was deferred while a field had focus — but never mid-press,
  // or the re-render would swap the button out from under the click
  const flushPending = () => { if(CLOUD.pending && !isEditing() && !CLOUD.pointerDown){ const r=CLOUD.pending; CLOUD.pending=null; applyRemote(r); } };
  document.addEventListener('pointerdown', ()=>{ CLOUD.pointerDown=true; }, true);
  document.addEventListener('pointerup',   ()=>{ CLOUD.pointerDown=false; setTimeout(flushPending, 0); }, true);  // runs after the click dispatches
  document.addEventListener('focusout', ()=> setTimeout(flushPending, 60));
  // safety net: every 2s, diff local state against the room and push anything that
  // slipped through (a mutation whose handler forgot to trigger a sync). pushLocal
  // is a no-op when nothing changed, so this is cheap and writes nothing when idle.
  setInterval(()=>{ if(CLOUD.db && CLOUD.room && CLOUD.synced && !CLOUD.applying) pushLocal(); }, 2000);
  // if the page is already open and the room in the URL changes (e.g. someone
  // clicks a link to a different room), switch rooms live instead of ignoring it
  window.addEventListener('hashchange', ()=>{
    const hm = (location.hash||'').match(/room=([0-9a-fA-F-]+)/);
    const hid = hm ? hm[1] : '';
    if(hid && hid!==CLOUD.room && CLOUD.db){ setRoomId(hid); attachRoom(hid); syncNote('Switched to room '+hid.slice(0,6)+'…'); }
  });
  // auto-join from the URL hash, else the last room used on this device
  const m = (location.hash||'').match(/room=([0-9a-fA-F-]+)/);
  const id = m ? m[1] : (lsGet('st_room') || '');
  if(id && CLOUD.db){ setRoomId(id); attachRoom(id); }
  else liveLabel();
}

/* ================================================================
   INIT
   ================================================================ */
function init(){
  const restored = loadLocalState();
  S = restored || freshState();
  document.getElementById('envSel').innerHTML =
    Object.entries(ENVS).map(([k,e])=>`<option value="${k}">${e.label}</option>`).join('');
  document.getElementById('partyAct').innerHTML = `<option value="">activity…</option>` +
    Object.entries(ACTS).map(([k,a])=>`<option value="${k}">${a.label}</option>`).join('');
  document.getElementById('partyCond').innerHTML = `<option value="">condition…</option>` +
    Object.entries(CONDS).map(([k,d])=>`<option value="${k}" title="${condTitle(d)}">${d.label}${d.droid?' (droids)':''}</option>`).join('');
  buildRules();
  loadLocalRolls();
  if(restored) logMsg(`💾 Session restored on this device — ${clockStr()}. 🆕 New starts over at Day 1.`);
  else logMsg('Tracker ready — Day 1, 00:00. All needs at 0, canteens full, droid packs charged. May the Force sustain you.');
  render();
  probeScene(render);   // load img/scene.* if present, then re-render the banner
  initCloud();
}
init();
