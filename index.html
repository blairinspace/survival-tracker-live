<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival Tracker — FFG Star Wars</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --gold:#e3b341;
    --good:#3fb950; --warn:#d29922; --bad:#f85149; --crit:#ff2e2e; --force:#9d8cff; --droid:#56d4dd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;padding:14px}
  h1{font-size:20px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
  button:hover{border-color:var(--accent)}
  button.primary{background:#1f3a5f;border-color:var(--accent)}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12.5px}
  input[type=number]{width:56px}
  input[type=text]{width:150px}
  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin:12px 0}
  .group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .clock{font-size:16px;color:var(--gold);font-weight:600;min-width:150px}
  .cdchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:2px 4px 2px 10px;font-size:12px}
  .cdchip .cdt{color:var(--gold);cursor:pointer;font-variant-numeric:tabular-nums} .cdchip.done{border-color:var(--good)} .cdchip.done .cdt{color:var(--good)}
  .cdchip button{border:none;background:none;padding:0 5px}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:12px;opacity:.55}
  .chip.on{opacity:1;background:#1f3a5f;border-color:var(--accent)}
  #ambience{position:relative;display:none;margin:0 0 12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:190px}
  #ambience img{width:100%;height:190px;object-fit:cover;display:block}
  #ambience .cap{position:absolute;left:12px;bottom:8px;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000}
  #ambience .cap small{display:block;font-size:11px;font-weight:400;opacity:.85}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card.dead{border-color:var(--crit);box-shadow:0 0 12px rgba(255,46,46,.35)}
  .card.uncon{border-color:var(--warn)}
  .card.droidcard{border-color:#1d4a4e}
  .portrait{position:relative;border-radius:8px;overflow:hidden;margin-bottom:8px;max-height:150px}
  .portrait img{width:100%;height:150px;object-fit:cover;object-position:center 20%;display:block}
  .portrait .hurt{position:absolute;inset:0;background:#e00;pointer-events:none}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .cname{font-size:16px;font-weight:700}
  .needrow{display:flex;align-items:center;gap:5px;margin:5px 0}
  .needlabel{width:56px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;cursor:pointer;flex-shrink:0}
  .needlabel:hover{color:var(--accent)}
  .barwrap{flex:1;height:14px;background:#0a0e14;border:1px solid var(--border);border-radius:7px;overflow:hidden;position:relative;min-width:80px}
  .bar{height:100%;border-radius:7px;transition:width .3s}
  .barval{position:absolute;right:6px;top:0;font-size:10px;line-height:14px;color:#fff;text-shadow:0 0 3px #000}
  .mini{font-size:10.5px;padding:2px 6px}
  .mini.force{border-color:var(--force);color:var(--force)}
  .mini.droid{border-color:var(--droid);color:var(--droid)}
  .mini.atk{border-color:var(--gold);color:var(--gold)}
  .gearrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:11.5px}
  .gearrow .gi{display:flex;align-items:center;gap:4px;color:var(--dim)}
  .gearrow input[type=number]{width:48px;padding:2px 4px;font-size:11.5px}
  .gearrow b{color:var(--text)}
  .customform{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0;padding:6px;background:var(--panel2);border:1px dashed var(--border);border-radius:6px}
  .customform input[type=text]{font-size:11.5px;padding:3px 5px}
  .badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;margin:1px 2px 1px 0}
  .b-stim{background:#1f4d2e;color:#7ee2a0}
  .b-enc{background:#5c3a10;color:#ffc266}
  .b-force{background:#2d2554;color:#c3b5ff}
  .b-off{background:#3a1010;color:#ff9c9c}
  .b-status{background:#123a4a;color:#8fd9f2}
  .b-cond{background:#432a10;color:#ffc98a}
  .cdt{opacity:.8;font-size:11px;margin-left:4px}
  .badge .x{cursor:pointer;margin-left:4px;opacity:.7}
  .badge .x:hover{opacity:1}
  details.inv{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px}
  details.inv summary{cursor:pointer;font-size:11.5px;color:var(--dim);user-select:none}
  details.inv summary b{color:var(--text)}
  .invtable{width:100%;border-collapse:collapse;margin-top:6px;font-size:11.5px}
  .invtable th{color:var(--dim);font-size:10px;text-transform:uppercase;text-align:left;padding:2px 3px}
  .invtable td{padding:2px 3px}
  .invtable input{padding:2px 4px;font-size:11.5px;width:100%}
  .invtable input[type=checkbox]{width:auto}
  .invtable input[type=number]{width:52px}
  .invtable .tot{color:var(--gold);text-align:right;white-space:nowrap}
  .invtable .auto{color:var(--dim);font-style:italic}
  .gearitem{margin-top:8px;padding:6px 8px;background:var(--panel2);border-radius:6px}
  .gearitem:first-child{margin-top:6px}
  .gearline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gearname{font-weight:600;font-size:12.5px}
  .gearitem .needrow{margin:5px 0 4px}
  .gearfx{margin-top:0;background:transparent;padding:0;font-size:11.5px;color:var(--dim)}
  .encline{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px;font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  details.invall{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px} details.invall > summary{font-size:12px} details.invall > summary .encsum{float:right;font-size:11.5px;color:var(--dim)} details.invall details.inv{margin-left:10px}
  .encline b{color:var(--text)} .encline button{margin-left:auto}
  .gearname input[type=checkbox]{vertical-align:middle;margin-right:3px}
  .gearempty{color:var(--dim);font-size:11.5px;padding:5px 2px;line-height:1.45}
  .exwrap{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
  .exbar{height:20px}
  .exbar .barval{line-height:20px;font-size:12px;font-weight:700}
  .tierbadge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .needtier{padding:1px 6px;font-size:9px;letter-spacing:.5px;flex-shrink:0}
  .fx{font-size:12px;color:var(--text);margin-top:6px;line-height:1.45;background:var(--panel2);border-radius:6px;padding:6px 8px}
  .fx .condline{color:#ffc98a}
  .fx.fxstack{background:transparent;padding:0}
  .fxneed{background:var(--panel2);border-radius:6px;padding:6px 8px;margin-bottom:5px;line-height:1.45}
  .fxneed:last-child{margin-bottom:0}
  .fxtier{font-weight:700}
  .fxnone{color:var(--dim);font-style:italic}
  .fxneed.condstack{color:#ffc98a}
  .tallies{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:12px}
  .tallies b{font-size:14px}
  .strain b{color:var(--warn)} .wounds b{color:var(--bad)}
  .steff{color:var(--muted);font-size:11px;cursor:help} .steff b{color:var(--warn);font-size:13px}
  .log{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin-bottom:12px}
  .log #logEntries{max-height:4.9em;overflow-y:auto} .log.open #logEntries{max-height:17em}
  .log .loghead b{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)!important;white-space:nowrap}
  .log .loghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .log .loghead b{color:var(--text)}
  .log .noteadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .log .noteadd input[type=text]{width:240px;max-width:60vw}
  #logEntries{max-height:260px;overflow-y:auto}
  .log p{font-size:12px;padding:2px 0;border-bottom:1px dotted #21262d;color:var(--dim)}
  .log p b{color:var(--text)}
  .log .lw{color:var(--warn)} .log .lb{color:var(--bad)} .log .lg{color:#7ee2a0} .log .lf{color:var(--force)} .log .ld{color:var(--droid)}
  .log .ln{color:var(--accent);font-style:italic}
  .tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
  .tabs button.on{background:#1f3a5f;border-color:var(--accent)}
  /* Destiny pool chip (always visible) + Dice tab */
  #destinyChip{margin-left:auto;display:flex;gap:6px;align-items:center}
  .dpt{font-weight:700;border-radius:14px;padding:4px 11px}
  .dpt.light{background:#e9eef5;color:#10151c;border-color:#fff}
  .dpt.dark{background:#05070a;color:#e6edf3;border-color:#555}
  .dpt:disabled{opacity:.4;cursor:default}
  #dice{display:none}
  .dicewrap{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:12px;align-items:start}
  @media (max-width:820px){ .dicewrap{grid-template-columns:1fr} }
  .dpanel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .dpanel h3{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
  .dpanel h3:not(:first-child){margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .drow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .drow input[type=number]{width:48px}
  .diecells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
  .diecell{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--dim);text-align:center}
  .diecell .cnt{font-size:16px;font-weight:700;color:var(--text)}
  .diecell .cnt.zero{color:#3a424d}
  .die{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;font-size:11px;font-weight:700;line-height:1;letter-spacing:-1px;color:#111;user-select:none;vertical-align:middle;flex:none}
  button.die{border:none;padding:0;border-radius:0;cursor:pointer;font-size:15px}
  button.die:hover{filter:brightness(1.25)}
  .die.d6{border-radius:6px;width:30px;height:30px}
  .die.d8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:38px;height:38px;font-size:10px}
  .die.d12{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);width:38px}
  .die.t-b{background:#7fd3ee} .die.t-k{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #777}
  .die.t-a{background:#41ad4f} .die.t-d{background:#6f42b0;color:#fff}
  .die.t-p{background:#f4d93b} .die.t-c{background:#cf2a2a;color:#fff} .die.t-F{background:#f3f4f6}
  .poolprev{min-height:44px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--panel2);border:1px dashed var(--border);border-radius:8px;padding:6px;margin-bottom:8px;color:var(--dim);font-size:12px}
  button.rollbtn{font-size:14px;padding:8px 18px;font-weight:700}
  #diceFeed{max-height:70vh;overflow-y:auto}
  .roll{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
  .roll .rhead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px}
  .roll .rhead b{color:var(--text);font-size:13px}
  .roll .rdice{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .roll .rres{font-size:13px}
  .roll .rres .ok{color:var(--good);font-weight:700} .roll .rres .no{color:var(--bad);font-weight:700}
  .roll .rres span.sym{white-space:nowrap;margin-right:10px}
  .roll.dflip{text-align:center;font-weight:700}
  .roll.dflip.dark{background:#05070a;border-color:#555} .roll.dflip.light{background:#e9eef5;color:#10151c;border-color:#fff}
  .roll.dflip small{display:block;font-weight:400;opacity:.75;font-size:11px}
  .dlegend{font-size:11px;color:var(--dim);line-height:1.7}
  /* Sheets tab */
  #sheet{display:none}
  .die.sm{width:15px;height:15px;border-radius:3px}
  .die.sm.d8{width:18px;height:18px} .die.sm.d12{width:18px;height:16px}
  .shead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
  .shead h2{font-size:20px;color:var(--gold);margin-right:6px}
  .shead label, .sbox{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .shead .ro{font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;padding:3px 0;min-width:48px;max-width:320px} .shead .ro.empty{color:var(--dim)}
  .shead.bio{gap:8px 14px;margin-bottom:10px} .shead.bio input[type=text]{width:120px}
  .shead input[type=text]{width:150px} .shead input.wide{width:260px;max-width:80vw}
  .sdesc{font-size:12.5px;color:var(--dim);line-height:1.5;margin:-4px 0 12px;max-width:900px} .sdesc b{color:#b6bec8;font-weight:600}
  .sboxes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .sbox{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;align-items:center;text-align:center}
  .sbox .vals{display:flex;gap:5px;align-items:center;color:var(--dim);font-size:12px;text-transform:none;letter-spacing:0}
  .sbox input[type=number]{width:46px;font-size:15px;font-weight:700;text-align:center}
  .sbox input.big{width:92px}
  .sbox small{font-size:9.5px;text-transform:none;letter-spacing:0}
  .sbox.chr{min-width:86px} .sbox.chr input{font-size:20px;width:58px;border-radius:50%;height:58px;border-width:2px;border-color:var(--gold)}
  .skillcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
  .sktable{width:100%;border-collapse:collapse;font-size:12.5px}
  .sktable th{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:4px 4px;border-bottom:1px solid var(--border)}
  .sktable th.c, .sktable td.c{text-align:center}
  .sktable td{padding:2px 4px;border-bottom:1px dotted #21262d;vertical-align:middle}
  .sktable tr.career td.skn{color:var(--text);font-weight:600} .sktable td.skn{color:#b6bec8}
  .sktable select.chsel{border:none;background:none;color:var(--dim);padding:0 2px;font-size:11px}
  .sktable input[type=number]{width:42px;text-align:center}
  .sktable input[type=text]{width:120px}
  .sktable tr.idesc td{border-bottom:1px solid #2a313b;padding:0 4px 6px;font-size:11.5px;color:var(--dim);line-height:1.45}
  .sktable tr.idesc .nomatch{color:var(--warn)}
  .sktable tr.irow td{border-bottom:none;padding-top:5px}
  .sktable input.ialias{width:110px} .sktable input.addin{width:230px}
  .b-cu{background:#12323a;color:#8fe3ee}
  details.sfold{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel2)}
  details.sfold > summary{cursor:pointer;user-select:none;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;padding:2px 0}
  details.sfold > summary b{color:var(--text)} details.sfold > summary .sub{color:var(--dim);text-transform:none;letter-spacing:0}
  details.sfold[open] > summary{margin-bottom:6px}
  details.sfold.crate{margin-bottom:14px;background:var(--panel)} details.sfold.crate > summary{font-size:13px}
  details.sfold.crate .geartables{margin-bottom:4px}
  .geartables{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;margin-bottom:14px}
  .geartables .wide{grid-column:1/-1}
  .sktable input.wname{width:150px} .sktable input.wq{width:170px} .sktable input.n2{width:54px}
  .sktable tr.uneq td{opacity:.6} .sktable tr.uneq td.keep{opacity:1}
  button.eqbtn{font-size:13px;padding:1px 6px;opacity:.45} button.eqbtn.on{opacity:1;border-color:var(--gold);color:var(--gold)}
  .sbox input.xpn{width:58px}
  .sbox b.derived{font-size:20px;color:var(--text)}
  .wcard{border:1px solid #5a1d1d;background:#1a1012;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12.5px}
  .wcard b{color:var(--text)} .wcard .q{color:var(--dim);font-size:11.5px;display:block;margin-top:2px}
  .wcard .crit{color:var(--gold);font-weight:700}
  .wchip{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid #5a1d1d;background:#1a1012;border-radius:6px;padding:5px 8px;margin-bottom:8px;font-size:12px}
  button.skroll{display:inline-flex;gap:2px;align-items:center;min-height:26px;min-width:60px;padding:3px 6px;flex-wrap:wrap}
  #rules{display:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;line-height:1.6}
  #rules h2{color:var(--gold);font-size:16px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px}
  #rules h2:first-child{margin-top:0}
  #rules table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:12.5px}
  #rules th,#rules td{border:1px solid var(--border);padding:5px 8px;text-align:left}
  #rules th{background:var(--panel2);color:var(--accent)}
  #rules p{font-size:13px;color:var(--text);margin:6px 0}
  .dice{font-weight:700}
  .setb{color:#a5a5a5}.chal{color:#f85149}.diff{color:#b57edc}.boost{color:#4fc3f7}
  /* ---- Ship card (Mantis) ---- */
  #ship{display:none}
  .shipwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .shiphead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
  .shiphead .stitle{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .shiphead .ssub{color:var(--dim);font-size:12px;margin-top:3px;letter-spacing:.5px}
  .shiphead .sactivity{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .shipportrait{position:relative;border-radius:8px;overflow:hidden;margin-bottom:14px;max-height:220px}
  .shipportrait img{width:100%;height:220px;object-fit:cover;object-position:center;display:block}
  .shiphead .stitle .mini{font-size:11px;vertical-align:middle;margin-left:4px}
  .statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
  .stat .sv{font-size:22px;font-weight:800;color:var(--text)}
  .stat .sl{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
  .shipcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:640px){.shipcols{grid-template-columns:1fr}}
  .spanel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
  .spanel h3{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .defgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:236px;margin:4px auto 0}

<div class="topbar" id="titleBar">
  <div class="group">
    <h1 style="margin:0">Survival Tracker</h1>
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">🔗 Live</span>
    <span id="roomState" class="label" style="color:var(--dim)">solo — not shared</span>
  </div>
  <div class="group">
    <span class="label" title="Your name labels your dice rolls and Destiny flips in the feed">You</span>
    <input type="text" id="playerIn" placeholder="your name" style="width:110px" onchange="setPlayerName(this.value)">
  </div>
  <div class="group">
    <button id="sessionBtn" onclick="toggleSession()" title="Backups (save / load), starting a new session, and the live-room controls">⚙ Session</button>
  </div>
  <div class="group" id="sessionPanel" style="display:none;flex-basis:100%;border-top:1px dashed var(--border);padding-top:10px;gap:14px">
    <div class="group">
      <span class="label">Backup</span>
      <button onclick="exportState()" title="Download the whole session as a file — your backup">💾 Save</button>
      <button onclick="document.getElementById('importFile').click()" title="Restore a saved file (replaces the current session)">📂 Load</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importState(this)">
    </div>
    <div class="group">
      <span class="label">Room</span>
      <input type="text" id="roomIn" placeholder="room code or link" style="width:170px" onkeydown="if(event.key==='Enter')roomJoin()">
      <button class="mini" onclick="roomJoin()">Join</button>
      <button class="mini" onclick="roomCopyLink()" title="Copy a link that auto-joins this room — send it to a new player or open it on a new device">🔗 Copy link</button>
      <button class="mini" onclick="roomCreate()" title="Start a new shared live room for your table">✨ Create</button>
      <button class="mini" onclick="roomLeave()" title="Stop live sharing on this device (local data untouched)">Leave</button>
    </div>
    <div class="group" style="margin-left:auto">
      <button onclick="resetAll()" style="border-color:var(--bad);color:var(--bad)" title="Start over at Day 1, 00:00 — resets the shared room for everyone (asks first). Save a backup before you do.">🆕 New session</button>
    </div>
  </div>
  <div class="group">
    <span id="syncMsg" class="label" style="color:var(--dim)"></span>
  </div>
</div>

<div class="topbar">
  <div class="group">
    <span class="clock" id="clock"></span>
    <button class="primary" onclick="advance(0.25)">+15 min</button>
    <button class="primary" onclick="advance(0.5)">+30 min</button>
    <button class="primary" onclick="advance(1)">+1 hr</button>
    <input type="number" id="customHrs" min="0.25" step="0.25" max="168" value="12">
    <button onclick="advanceCustom()">Advance</button>
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">📍 Location</span>
    <input type="text" id="locIn" placeholder="current location" onchange="S.location=this.value;logMsg('📍 Location: '+esc(this.value));render()">
  </div>
  <div class="group">
    <span class="label">Environment</span>
    <select id="envSel" onchange="setEnv(this.value)"></select>
  </div>
  <div class="group" style="flex-basis:100%;justify-content:flex-end">
    <span class="label" title="Countdowns tick down as the clock advances — travel time, a deadline, a ritual, a pursuit. The log announces each one when it runs out.">⏳ Countdowns</span>
    <span class="group" id="counters"></span>
    <input type="text" id="cdLabel" placeholder="what for? e.g. Travel to Koboh" style="width:190px" onkeydown="if(event.key==='Enter')counterAdd()">
    <input type="text" id="cdTime" placeholder="6, 90m, 2d" style="width:84px" title="How long: a number of hours, or with a unit — 90m, 6h, 2d, 1d 12h" onkeydown="if(event.key==='Enter')counterAdd()">
    <button class="mini" onclick="counterAdd()" title="Start this countdown">＋ add</button>
  </div>
</div>

<div id="objectives"></div>

<div class="log" id="log">
  <div class="loghead">
    <b id="logTitle" onclick="logToggle()" title="Show more or fewer entries" style="cursor:pointer;user-select:none">▸ Event log</b>
    <div class="noteadd">
      <input type="text" id="noteIn" placeholder="add a note to the log…" onkeydown="if(event.key==='Enter')addNote()">
      <button class="mini" onclick="addNote()" title="Add this note to the event log at the current game time, signed with your name">📝 add note</button>
      <button class="mini" onclick="exportLog()" title="Save the whole log, oldest first, plus the state of every objective, as a text file — drop it in the lore vault's Inbox after the session">⬇ export</button>
      <button class="mini" onclick="clearLog()" title="Clear the event log (nothing else is affected). Export it first if you want it for the lore book.">⟳ clear</button>
    </div>
  </div>
  <div id="logEntries"></div>
</div>

<div id="ambience">
  <img id="ambImg" alt="scene">
  <span class="cap"><span id="ambCap"></span><small id="ambEnv"></small></span>
</div>

<div class="tabs">
  <button id="tabT" class="on" onclick="showTab('tracker')">Tracker</button>
  <button id="tabC" onclick="showTab('sheet')">Sheets</button>
  <button id="tabS" onclick="showTab('ship')">Mantis</button>
  <button id="tabI" onclick="showTab('items')">Items</button>
  <button id="tabTr" onclick="showTab('trees')">Talents</button>
  <button id="tabD" onclick="showTab('dice')">🎲 Dice</button>
  <button id="tabL" onclick="showTab('lore')">Lore</button>
  <button id="tabK" onclick="showTab('core')">Core Rules</button>
  <button id="tabR" onclick="showTab('rules')">Tracker Rules</button>
  <button id="tabG" onclick="showTab('gm')" title="Game Master tools: the species browser">GM</button>
  <span id="destinyChip"></span>
</div>

<div id="tracker">
<div class="topbar" id="roomBar" style="justify-content:flex-start;margin-top:0">
  <div class="group">
    <span class="label">Show</span>
    <span class="group" id="viewChips"></span>
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">👥 Party</span>
    <select id="partyAct" onchange="partySetAct(this.value);this.value=''" title="Set the activity of every visible character"></select>
    <select id="partyCond" onchange="partyAddCond(this.value);this.value=''" title="Apply a condition to every visible eligible character — hover an option for its effect"></select>
  </div>
</div>
<div class="grid" id="cards"></div>
</div>

<div id="ship"></div>

<div id="items"><div class="itemswrap">
  <div class="itembar">
    <input type="text" id="itemQ" placeholder="search name, qualities, features…" oninput="itemsSet('q',this.value)">
    <span class="group" id="itemGroups"></span>
    <select id="itemSub" onchange="itemsSet('c',this.value)" title="Sub-category (one per workbook sheet)"></select>
    <select id="itemSkill" onchange="itemsSet('sk',this.value)" title="Weapon skill"></select>
    <label title="Sort the results">sort <select id="itemSort" onchange="itemsSet('sort',this.value)"><option value="name">name</option><option value="price">price</option><option value="rare">rarity</option></select></label>
    <label title="Hide (R) restricted items"><input type="checkbox" id="itemHideR" onchange="itemsSet('hideR',this.checked)"> hide restricted</label>
    <button class="mini" onclick="hbAdd()" title="Add a homebrew item — shared with the room and saved with everything else">✨ add homebrew item</button>
  </div>
  <div id="itemsBody"></div>
</div></div>

<div id="trees"><div class="itemswrap">
  <div class="itembar">
    <label title="Pick a character to buy talents for. With nobody picked, the trees are read-only.">buying for <select id="treeWho" onchange="treesSet('who',this.value)"></select></label>
    <span id="treeXp" class="tinfo" style="margin:0"></span>
    <input type="text" id="treeQ" placeholder="search trees and talents…" oninput="treesSet('q',this.value)">
    <span class="group" id="treeKinds"></span>
    <select id="treeBook" onchange="treesSet('book',this.value)" title="Game line"></select>
    <select id="treeCareer" onchange="treesSet('career',this.value)" title="Career"></select>
  </div>
  <div class="treecols"><div class="treelist" id="treeList"></div><div class="treeview" id="treeView"></div></div>
</div></div>

<datalist id="dbNames"></datalist>
<div id="sheet">
  <div class="drow" id="sheetChips"></div>
  <div class="dpanel" id="sheetBody"></div>
</div>

<div id="dice"><div class="dicewrap">
  <div class="dpanel">
    <h3>Dice pool</h3>
    <div class="drow">
      <span class="label">Rolling as</span>
      <select id="diceWho" onchange="DICE_UI.who=this.value;renderDice()" title="Whose roll this is — pick a character to get their characteristics as one-click buttons"></select>
      <input type="text" id="diceLabel" placeholder="what for? e.g. Coordination" oninput="DICE_UI.label=this.value" onkeydown="if(event.key==='Enter')rollPool()">
    </div>
    <div id="dicePool"></div>
    <h3>Destiny pool</h3>
    <div id="destinyBox"></div>
    <h3>Reading the dice</h3>
    <div class="dlegend" id="diceLegend"></div>
  </div>
  <div class="dpanel">
    <div class="drow" style="justify-content:space-between">
      <h3 style="margin:0">Roll feed <span id="feedMode" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h3>
      <button class="mini" onclick="clearFeed()" title="Clear the roll feed for everyone in the room">⟳ clear</button>
    </div>
    <div id="diceFeed"></div>
  </div>
</div></div>

<div id="lore"><div class="itembar">
    <button class="mini" id="loreBackBtn" onclick="loreBack()" title="Back to the page you were on">← back</button>
    <button class="mini" onclick="loreHome()" title="The campaign's front page: where things stand now">⌂ home</button>
    <input type="text" id="loreQ" placeholder="search the campaign… (a name, a place, a word)" oninput="loreSet('q',this.value)">
    <span class="tinfo" id="loreInfo" style="margin:0"></span>
  </div>
  <div class="treecols"><div class="treelist" id="loreNav" style="flex-basis:250px"></div><div class="treeview" id="lorePage"></div></div>
</div>

<div id="core"><div class="itembar">
    <input type="text" id="coreQ" placeholder="search the rules… (e.g. prone, stimpack, fear)" oninput="coreFilter(this.value)">
    <button class="mini" onclick="coreOpenAll(true)">open all</button><button class="mini" onclick="coreOpenAll(false)">close all</button>
    <span class="tinfo" style="margin:0">Ordered the way a session runs. Quick reference, not the full rules — the book wins any argument.</span>
  </div><div id="coreBody"></div></div>

<div id="rules"></div>

<div id="gm"><div class="itemswrap">
  <div class="itembar">
    <input type="text" id="gmQ" placeholder="search species and abilities… (e.g. aquatic, claws)" oninput="gmSet('q',this.value)">
    <label title="Only species (or a subspecies) with 3 or more in this characteristic">strong in <select id="gmAttr" onchange="gmSet('attr',this.value)"></select></label>
    <label title="Sort the results">sort <select id="gmSort" onchange="gmSet('sort',this.value)"><option value="name">name</option><option value="xp">starting XP</option><option value="wt">wounds</option><option value="st">strain</option></select></label>
    <span class="itemcount" id="gmCount" style="margin:0"></span>
  </div>
  <div class="spcols"><div class="spgrid" id="gmGrid"></div><div class="spdetail" id="gmDetail"></div></div>
</div></div>

<!-- Firebase browser SDK (loaded from CDN; the app still runs solo if these fail) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<!-- Item catalog, generated from the GM's workbook by tools/import-items.py (the Items tab is empty if this fails) -->
<script src="items.js"></script>
<!-- Hand-maintained extra entries (kit items the workbook lacks, food types) -->
<script src="items-custom.js"></script>
<!-- Talent trees, Force powers and talent effects, generated from the rules vault by tools/import-rules.py (the Talents tab is empty if this fails) -->
<script src="rules.js"></script>

<script>
'use strict';
/* ================================================================
   CONFIGURATION — every tunable number lives here
   ================================================================ */
const OZ_PER_CANTEEN = 20;

// Organic baseline accrual. Thirst / hunger / hygiene accrue from their
// per-tier `rate` in NEEDS (pts/hr, see below). Fatigue is activity-driven
// (ACTS[..].rest, pts/hr). Sleep debt is flat while awake — one tier per day:
// tier.min ÷ awakeRate → Drowsy ≈18 h, Sleep-Deprived ≈49 h, Delirious ≈73 h, Wrecked ≈96 h (the Rules tab derives these).
// Quiet rest (lying down, eyes closed) slows the debt a little but never pays it off.
const SLEEP = { awakeRate:1.04, restingMult:0.75, hoursDefault:8, fullNightHrs:6, deepDebtFrom:76, deepDebtCap:75 };
// fullNightHrs: sleep this long and all strain clears on waking. deepDebtFrom/Cap: a sleep begun at
// Delirious or worse recovers at most deepDebtCap points — one night brings you back to Drowsy, a second clears it.
const MAINT_BASE = 0.14;         // droid wear pts/hr: unmaintained light temperate duty ≈ 30 days to critical

// Encumbrance: per point OVER threshold (threshold = Brawn + 5)
const ENC_DRAIN_PER_PT = 0.10;   // +10% thirst/hunger/fatigue (droids: charge/wear) accrual
const ENC_SLEEP_PER_PT = 0.05;   // +5% sleep-debt accrual

// Force commitment: per committed point (Force sensitives, 0–8)
const FORCE_PER_PT = 0.08;       // −8% accrual per point (8 pts = −64%)

// Stimpacks (organics only, instant injection)
const STIM = { hours:4, fatigue:25, stMod:2, odWounds:2, maxHeals:5, fatigueMult:0.5, windowHrs:24,
               crashFatigue:15, crashHrs:2, crashMaxLvl:3 };
// fatigueMult: fatigue accrual while the stimulant lasts; windowHrs: the dose counter's rolling window.
// Crash: when the stimulant ends, a 💥 Crash condition starts at level = doses in the window (max
// crashMaxLvl), hands back crashFatigue × level fatigue at once, and eases one level every crashHrs.

// Drinking. A character's `waterOz` is the water a full day of light activity in a
// temperate climate costs them, so drinking that much cancels exactly one day of
// baseline thirst (see ozToPts). For an Average build (60 oz) that is 0.4 pts/oz: a 20 oz
// canteen ≈ 8 pts, a third of the day. At Dehydrated+ (thirst ≥ thresh) a cramping gut keeps down only
// ~capOz per drink — the rest stays in the canteen. Sip, rest, repeat.
const REHYDRATE = { thresh:51, capOz:10, waitHrs:0.25 };   // waitHrs: no second sip until the clock has moved this far

// Refeeding: at Starving+ (hunger ≥ thresh) the body safely absorbs only
// part (frac) of each meal — gorging risks refeeding shock (a Sick stack).
// Hunger–thirst link: while Dehydrated+ (thirst ≥ REHYDRATE.thresh), meals
// restore only half their points until rehydrated.
const REFEED = { thresh:51, frac:0.5 };   // a starving body takes in only this share of each meal
const STARVE_WOUND_HRS = 12;     // Emaciated+: one wound of organ damage per this many hours
const DEHYD_WOUND_HRS  = 2;      // Desiccated: one wound per this many hours (1 per hour once Collapsed), so the death roll at 100 gets its window

// Sleep ↔ Fatigue coupling
const SLEEP_FATIGUE = { thresh:51, accrual:1.5, recovery:0.75 }; // sleep-deprived: fatigue ×1.5, rest recovery ×0.75
const FATIGUE_SLEEP = { thresh:76, accrual:1.5 };                // exhausted body craves rest: sleep debt ×1.5

// Hygiene actions (points removed; wipe-down draws canteen water)
const HYG = { wash:50, wipe:12, wipeOz:5, clothes:8 };   // wipe ≈ two days of Grubby-tier grime; a wash is the real reset
// Environmental condition onset chance per hour of exposure
// Rolled every hour of exposure, asleep or awake (shelter and gear are the GM's waiver),
// and scaled by the character's heat/cold adaptation (Tann ×0.4 in heat, Merrin ×0.6 in cold).
const ENV_COND_CHANCE = { scorching:0.12, hot:0.05, humid:0.05, frozen:0.12, cold:0.05 };

// Wound-tint portrait: red overlay opacity at max wounds
const HURT_MAX_OPACITY = 0.75;

// Timed statuses: dur (hrs), forced activity, payload delivered evenly across duration
const STATUSES = {
  ration: {label:'🍽 Eating (ration)', dur:0.25, act:'resting', deltas:{hunger:-5},           costMult:1},   // hunger here is the Average-build figure; foodPts() sizes it to the eater
  meal:   {label:'🍲 Eating (meal)',   dur:0.5,  act:'resting', deltas:{hunger:-6.25, rest:-5}, costMult:1.25},
  rest15: {label:'🪑 Resting (15 min)', dur:0.25, act:'resting', deltas:{rest:-3}},
  rest30: {label:'🪑 Resting (30 min)', dur:0.5,  act:'resting', deltas:{rest:-6}},
  med15:  {label:'🧘 Meditating (15 min)', dur:0.25, act:'resting', deltas:{rest:-8},  fs:true},
  med30:  {label:'🧘 Meditating (30 min)', dur:0.5,  act:'resting', deltas:{rest:-14}, fs:true, sleepCredit:0.25},
  wash:   {label:'🛁 Washing (full wash)', dur:0.5, act:'resting', deltas:{hygiene:-HYG.wash}},
  sleep:  {label:'😴 Sleeping', dur:8, act:'sleeping', deltas:{}},
  // repairs on a weapon, armor or tool: the wear comes off when the work is finished (nothing if abandoned)
  tuneup:  {label:'🔧 Tune-up',  dur:0.25, act:'light', deltas:{}, repair:true},
  overhaul:{label:'🔧 Overhaul', dur:1,    act:'light', deltas:{}, repair:true}
};
const START_FOOD_DAYS = 3;                 // a new session's kit carries this many days of rations, by build
const SNACK_FRAC = 1/3;                   // snack: an instant bite on the move, a third of a ration
const MEAL_MULT = 1.25;                   // a cooked meal fills a quarter more than a ration (and eases fatigue)
const TUNEUP = 20;                        // droid tune-up wear relief (30 min with tools — DROID_REPAIR_HRS)

/* Conditions. mult: need-accrual multipliers (value or fn(lvl));
   stMod: strain-threshold modifier (value or fn(lvl)) — conditions never tick strain by the hour;
   hourly(cs,lvl,ev,cap): discrete per-hour extras; fx: penalties text; lvls: max severity */
const CONDS = {
  /* Sick — the single stacking illness behind dirty water (Thirst), spoiled food
     & refeeding shock (Hunger), and infection (Hygiene). Each bad exposure adds
     1 stack (the + on the badge). Each stack is cleared separately: one daily
     Resilience (or a carer's Medicine) check removes 1; a medpac or bacta
     removes 1 outright. */
  sick:      {label:'🤒 Sick', lvls:5, stMod:l=>-l,
              mult:{water:l=>1+0.1*l, hunger:l=>1+0.1*l, rest:l=>1+0.15*l, sleep:l=>1+0.1*l},
              hourly:(cs,l,ev,cap)=>{
                cs.sickHrs=(cs.sickHrs||0)+1;
                if(l>=3 && cs.sickHrs%4===0 && cs.wounds<cap){ cs.wounds++; ev.push(['lb',`${cfg(cs.id).name} suffers 1 wound — gravely ill.`]); }
                if(cs.sickHrs%24===0) ev.push(['lw',`🤒 ${cfg(cs.id).name}: daily recovery check — Resilience (or a carer's Medicine) removes 1 Sick stack; a failure or Despair at 3+ stacks ADDS one. +1 Setback ■ while Squalid+, Dehydrated or Starving.`]);
              },
              fx:l=> l>=3 ? `🤒 Gravely Ill (${l} stacks): fever & delirium — <b>−1 Brawn, −1 Intellect</b>; <b class="lb">1 wound every 4 hrs</b>; strain threshold −${l}${l>3?`; upgrade ${l-3} more check(s)`:''}. Untreated, this is where it can kill. Clear each stack separately (daily Resilience/Medicine, medpac or bacta).`
                   : l>=2 ? `🤒 Sick (2 stacks): <span class="dice chal">upgrade the difficulty</span> of physical checks once; strain threshold −2; <b>−1 Brawn</b>; wounds heal at half rate.`
                   :        `🤒 Ill (1 stack): 1 Setback ■ to physical checks; strain threshold −1. Per stack: thirst & hunger +10%, fatigue +15%, sleep debt +10%.`},
  fear:      {label:'😨 Fear', lvls:3, mult:{sleep:l=>1+0.15*l},
              fx:l=>`😨 Fear (${l}/3): ${l} Setback ■ to all checks; restless — sleep debt grows ${15*l}% faster${l>=3?'; must pass a Fear check (Discipline) to act against the source':''}.`},
  chilled:   {label:'🥶 Chilled', mult:{hunger:1.3, rest:1.2},
              fx:()=> '🥶 Chilled: 1 Setback ■ to Agility-based checks; burns 30% more calories (in a Cold environment that is already counted), tires 20% faster; cold-adapted species feel proportionally less. Remove with shelter/warm gear.'},
  overheated:{label:'🥵 Overheated', mult:{water:1.4, rest:1.2},
              fx:()=> '🥵 Overheated: 1 Setback ■ to all checks; sweats 40% more water, tires 20% faster; heat-adapted species feel proportionally less. Remove with shade/cooling.'},
  soaked:    {label:'💧 Soaked', mult:{rest:1.1},
              fx:()=> '💧 Soaked: 1 Setback ■ to Agility-based checks; in Cold environments also counts as Chilled.'},
  poisoned:  {label:'☠️ Poisoned', stMod:-2, mult:{water:1.2},
              fx:()=> '☠️ Poisoned: strain threshold −2 until treated (Medicine or antidote); 1 Setback ■ to all checks; vomiting and sweats: +20% water.'},
  limping:   {label:'🦵 Limping', mult:{rest:1.3},
              fx:()=> '🦵 Limping: speed ×½; traveling tires 30% faster; 1 Setback ■ to Coordination/Athletics.'},
  crash:     {label:'💥 Crash', lvls:3, decayHrs:2, mult:{rest:l=>1+0.25*l, sleep:l=>1+0.25*l},   // decayHrs is overwritten from STIM.crashHrs below
              fx:l=> l>=3 ? `💥 Crash (3/3): the stim loan comes due — shaking, foggy, hollow. <span class="dice setb">2 Setback ■■</span> to ALL checks and <span class="dice chal">upgrade the difficulty once</span>; fatigue & sleep debt accrue ×1.75. Eases one level every ${STIM.crashHrs} hrs. A fresh stim clears it — and the next crash is a level worse.`
                   : l>=2 ? `💥 Crash (2/3): drained and irritable. <span class="dice setb">2 Setback ■■</span> to all checks; fatigue & sleep debt accrue ×1.5. Eases one level every ${STIM.crashHrs} hrs.`
                   :        `💥 Crash (1/3): the stim wears off and the tiredness it hid returns. <span class="dice setb">1 Setback ■</span> to all checks; fatigue & sleep debt accrue ×1.25. Eases in ${STIM.crashHrs} hrs.`},
  inspired:  {label:'🌟 Inspired', mult:{rest:0.9},
              fx:()=> '🌟 Inspired: 1 Boost ▲ to all checks; fatigue accrues 10% slower.'},
  drunk:     {label:'🍺 Drunk', lvls:3, decayHrs:2, stMod:l=>l>=2 ? -2*(l-1) : 0, mult:{water:l=>1+0.15*l, rest:l=>1+0.1*l},   // decayHrs: one level wears off per this many hours
              fx:l=> l>=3 ? `🍺 Hammered (3/3): slurring, unsteady, blurred vision. <span class="dice setb">2 Setback ■■</span> to ALL checks and <span class="dice chal">upgrade the difficulty twice</span> of Coordination, Athletics & Vigilance. <b class="lw">Strain threshold −4.</b> May black out — GM can force a Daunting (◆◆◆◆) Resilience check or an involuntary collapse into sleep. Dehydrates hard (+45% water). Sobers one level every ${CONDS.drunk.decayHrs} hrs.`
                   : l>=2 ? `🍺 Drunk (2/3): <span class="dice chal">upgrade the difficulty once</span> of physical & mental checks; <span class="dice setb">1 Setback ■</span> to Coordination, Vigilance & Perception — but <span class="dice boost">1 Boost ▲</span> to Charm, Coercion & Cool (liquid courage). <b class="lw">Strain threshold −2.</b> +30% water use.`

/* Standard inventory type categories (used by cargo + character inventory dropdowns) */
const INV_TYPES = ['Weapon','Armor','Tool','Gear','Bag','Snack','Ration','Meal','Medical','Other'];

// carry: on the character's person (ticked on the sheet; unticked = stowed on the ship or at camp). Only carried
// items show on the Tracker card, count toward encumbrance, and can be eaten, used or equipped.
// eq: equipped (ticked in the card's Weapons / Armor / Tools lists) — in hand or worn. Weapons, armor and tools only. Equipped
// items get a wear track and feed soak and defense; worn-down armor protects less (ATIERS). (This replaced the 'Gear (worn)' type.)
const isCarried  = it => !!it && (it.auto || it.carry!==0);
const isTool = it => (it.type||'').toLowerCase()==='tool';
const isCons = it => ['snack','ration','meal'].includes((it.type||'').toLowerCase());   // consumables: what the hunger buttons eat
const isEquipped = it => !!it && !it.auto && !!it.eq && it.carry!==0 && (isWeapon(it) || isArmor(it) || isTool(it));   // weapons, armor and tools can be equipped
/* Build a <select> of inventory types; preserves any custom saved value as its own option. */
function typeSelect(val, onchangeExpr, width){
  const v = val||'';
  const known = INV_TYPES.some(t=>t.toLowerCase()===v.toLowerCase());
  const opts = INV_TYPES.map(t=>`<option value="${t}"${t.toLowerCase()===v.toLowerCase()?' selected':''}>${t}</option>`).join('');
  const custom = (v && !known) ? `<option value="${esc(v)}" selected>${esc(v)}</option>` : '';
  const blank = `<option value=""${v?'':' selected'}>—</option>`;
  return `<select style="width:${width||82}px" onchange="${onchangeExpr}">${blank}${opts}${custom}</select>`;
}

/* A ration is ONE MEAL. The build says how many a day of light activity takes (c.rationsDay); what a
   ration takes off this character's hunger meter is that day's hunger divided by that number, so
   eating on schedule holds the meter level for every build. A cooked meal is a bit more, a snack a third. */
function foodPts(c, kind){
  const perDay = 24 * NEEDS.hunger.tiers[0].rate * (c.mods.hungerRate||1) * (ACTS.light.hunger||1), ration = perDay / (c.rationsDay||3);
  return kind==='meal' ? ration*MEAL_MULT : kind==='snack' ? ration*SNACK_FRAC : ration;
}

  const b = BUILDS[name]; if(!b || !!b.droid!==!!c.droid) return false;

  if(b.droid) c.packHrs = b.packHrs;
  else { c.waterOz = b.waterOz; c.rationsDay = b.rations; if(b.hunger!==1) c.mods.hungerRate = b.hunger; else delete c.mods.hungerRate; }
  return true;
}

    : { water:0, hunger:0, hygiene:0, sleep:0, rest:0, wt:12, st:12,

function migrate(s){ // patch older saves (and room snapshots)
  s.chars = arrayify(s.chars); if(!Array.isArray(s.chars)) s.chars = [];
  // a save or room written by a build with a different roster: drop ids this build doesn't know
  const unknown = s.chars.filter(cs=>!cs || !cfg(cs.id)).map(cs=>cs ? cs.id : '?');
  if(unknown.length) s.chars = s.chars.filter(cs=>cs && cfg(cs.id));
  if(!s.visible){
    s.visible = Object.fromEntries(CHARS.map(c=>[c.id, !s.view || s.view==='all' || s.view===c.id]));
    delete s.view;
  }
  for(const c of CHARS){
    if(!s.chars.find(x=>x.id===c.id)) s.chars.push(newCharState(c));
    if(s.visible[c.id]===undefined) s.visible[c.id]=true;
  }
  for(const cs of s.chars){
    for(const k of ['inv','conds']) cs[k] = arrayify(cs[k]);   // RTDB may hand lists back as index-keyed objects
    const invV0 = cs.invV;   // read before the defaults below stamp the current version on an old save
    const def = newCharState(cfg(cs.id));
    for(const k in def) if(cs[k]===undefined) cs[k]=def[k];
    normSheet(cs, cfg(cs.id));
    upgradeInv(cs, cfg(cs.id), invV0);
    if(cs.lastTiers) for(const k of NEED_KEYS) cs.lastTiers[k] ??= 0;
    if(cs.conds){  // old 'infected' condition folds into the stacking Sick condition
      let sickLvl = 0;
      for(const cd of cs.conds) if(cd.id==='sick'||cd.id==='infected') sickLvl=Math.max(sickLvl, cd.lvl||1);
      cs.conds = cs.conds.filter(cd=> (cd.custom && cd.label) || (CONDS[cd.id] && cd.id!=='sick' && cd.id!=='infected'));
      for(const cd of cs.conds) if(cd.custom && cd.fx===undefined) cd.fx='';
      if(sickLvl) cs.conds.push({id:'sick', lvl:Math.min(5,sickLvl)});
    }
    delete cs.encCur; delete cs.infHrs; delete cs.stimDay; delete cs.strainFrac;
    syncInv(cs);
  }
  for(const k of ['ambImg','location']) if(s[k]===undefined) s[k]='';
  // countdowns (RTDB drops the key when the list is empty). The old single travel timer becomes one of them.
  s.obj = normObjectives(s.obj);
  s.counters = arrayify(s.counters); if(!Array.isArray(s.counters)) s.counters = [];
  s.counters = s.counters.filter(c=>c && typeof c==='object' && c.id).map(c=>({ id:String(c.id), label:String(c.label||'Countdown').slice(0,60), hrs:Math.max(0, +c.hrs||0), total:Math.max(0, +c.total||+c.hrs||0) }));
  if(s.travelDest && s.travelEta>0 && !s.counters.some(c=>c.label==='Travel to '+s.travelDest))
    s.counters.push({ id:randomId().slice(0,8), label:('Travel to '+s.travelDest).slice(0,60), hrs:+s.travelEta, total:+s.travelEta });
  delete s.travelDest; delete s.travelEta;
  // RTDB deletes keys set to empty arrays, so a cleared log comes back undefined
  s.log = arrayify(s.log); if(!Array.isArray(s.log)) s.log=[];
  if(unknown.length) s.log.unshift({t:'load', m:`⚠ Dropped unknown character(s) from the save: ${esc(unknown.join(', '))}.`, c:'lw'});
  // homebrew items (Items tab) — same RTDB caveat as the log; make every record well-formed
  s.homebrew = arrayify(s.homebrew); if(!Array.isArray(s.homebrew)) s.homebrew=[];
  s.homebrew = s.homebrew.filter(h=>h && typeof h==='object');
  for(const h of s.homebrew){ if(!h.id) h.id=randomId(); for(const k of ['n','c','d']) if(typeof h[k]!=='string') h[k]=''; if(!h.g) h.g=HB_GROUPS[0]; }
  // destiny pool — zeros survive RTDB, but older saves and rooms don't have the key at all
  if(!s.destiny || typeof s.destiny!=='object') s.destiny = {};
  for(const k of ['light','dark']) s.destiny[k] = clamp(Math.round(+s.destiny[k])||0, 0, 20);
  if(!s.ship) s.ship = freshShip();
  else {  // patch older ship saves
    for(const k of ['cargo','smuggle','fuelLog']) s.ship[k] = arrayify(s.ship[k]);
    const d = freshShip();
    for(const k in d) if(s.ship[k]===undefined) s.ship[k]=d[k];
    for(const sy of SHIP_SYSTEMS){
      if(s.ship.systems[sy.id]===undefined) s.ship.systems[sy.id]=5;
      if(s.ship.sysHrs[sy.id]===undefined)  s.ship.sysHrs[sy.id]=0;
      if(s.ship.energy[sy.id]===undefined)  s.ship.energy[sy.id]=SHIP_ENERGY_DEFAULT;
    }
  }
  return s;
}

const cfg = id => CHARS.find(c=>c.id===id);
// Force sensitive: the sheet's bio answer when there is one, else the roster default
const isFS = cs => { const f = cs.sheet && cs.sheet.fs; return f===0 || f===1 ? !!f : !!(cfg(cs.id)||{}).fs; };
const st  = id => S.chars.find(x=>x.id===id);
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const stripTags = s => String(s).replace(/<[^>]*>/g,'');
const fxText = (def,lvl) => typeof def.fx==='function' ? def.fx(lvl||1) : def.fx;
const condTitle = (def,lvl) => esc(stripTags(fxText(def,lvl)).replace(/&amp;/g,'&'));  // plain-text hover tooltip
const dayNow = () => Math.floor(S.hour/24);           // days begin at 00:00
function clockStr(){
  const tot = Math.round(S.hour*60), h = Math.floor(tot/60)%24, m = tot%60;
  return `Day ${dayNow()+1} — ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
const fmtDur = h => h>=1 ? `${(+h.toFixed(2))} hr` : `${Math.round(h*60)} min`;
const plainLabel = s => s.replace(/^\S+ /,'');          // '🍲 Eating (meal)' → 'Eating (meal)'
// Thirst points a drink restores: a character's waterOz cancels one day of baseline accrual.
const ozToPts = (c, oz) => oz * 24*NEEDS.water.tiers[0].rate / c.waterOz;
const sleepRecovery = c => 100/(c.mods.sleepNeed||SLEEP.hoursDefault);   // sleep-debt pts restored per hour asleep
// Bag: counts 0 toward carried weight; while carried, its Enc value is added to the encumbrance threshold instead.
const isPack    = it => ['bag','gear (pack)'].includes((it.type||'').toLowerCase());
// Only carried items weigh anything. Armor never counts toward encumbrance (worn or not).
const isArmor   = it => (it.type||'').toLowerCase()==='armor';
const invWeight = cs => cs.inv.reduce((a,it)=>a + ((!isCarried(it)||isPack(it)||isArmor(it))?0:(it.qty||0)*(it.wt||0)), 0);
const packBonus = cs => cs.inv.reduce((a,it)=>a + (isCarried(it)&&isPack(it)?(it.qty||0)*(it.wt||0):0), 0);
// Personal Item Storage Crate: what a character has stowed (Carry unticked) is limited by bulk, the same for
// everyone. A warning, not a block — the GM decides where the overflow goes. Stowed armor counts at its full
// encumbrance (it is only free while worn); a stowed bag is an empty container, not its capacity.
const CRATE_CAP = 30, BAG_STOWED_ENC = 1;
const stowedEnc = it => isPack(it) ? BAG_STOWED_ENC : (isArmor(it) && !(+it.wt>0) ? numOr((dbOf(it)||{}).e) : (+it.wt||0));
const crateWeight = cs => cs.inv.reduce((a,it)=>a + (it && !it.auto && !isCarried(it) ? (+it.qty||0)*stowedEnc(it) : 0), 0);
const effThresh = cs => (cs.encThresh||0) + packBonus(cs);   // body threshold + pack capacity
const overload  = cs => { const t=effThresh(cs); return t>0 ? Math.max(0, Math.ceil(invWeight(cs)) - t) : 0; };
const FORCE_COMMIT_MAX = 8;
const forceCap  = cs => clamp((cs.sheet && cs.sheet.fr)||0, 0, FORCE_COMMIT_MAX);   // can't commit more dice than your Force rating (Sheets tab)
const forceMult = cs => cfg(cs.id).fs ? 1 - FORCE_PER_PT*clamp(cs.force||0, 0, 8) : 1;
const envMult = (m, adapt) => m<=1 ? m : 1+(m-1)*(adapt??1);
const climateAdapt = (c, heat) => heat ? (c.mods.heatAdapt??1) : (c.mods.coldAdapt??1);   // 1 = feels all of it
function tierOf(x, tiers){ let t=tiers[0]; for(const ti of tiers){ if(x>=ti.min) t=ti; } return t; }
const recoverStrain = (cs, n) => { cs.strain = Math.max(0, cs.strain - n); };
const sleepStrainPerHr = cs => Math.max(1, Math.ceil((cs.st||8)/8));   // a night's sleep (8 h) pays off a full threshold
/* Strain is the encounter-scale pool of the core rules (mental AND physical, spent by the player,
   recovered by Cool/Discipline and sleep). The slow needs and conditions never add to it by the
   hour; they shrink the THRESHOLD instead, so a run-down character fights on less headroom but
   still chooses when to spend it. strainMods lists every active modifier; effStrainThresh sums them. */
function strainMods(cs, c){
  const mods = [];
  if(c.droid){ const t = tierOf(exhaustion(cs), DTIERS); if(t.stMod) mods.push([t.name, t.stMod]); }
  else for(const key of NEED_KEYS){ const t = tierOf(cs[key], NEEDS[key].tiers); if(t.stMod) mods.push([t.name, t.stMod]); }
  for(const cd of cs.conds){
    const def = CONDS[cd.id]; if(!def?.stMod) continue;
    const m = typeof def.stMod==='function' ? def.stMod(cd.lvl||1) : def.stMod;
    if(m) mods.push([plainLabel(def.label), m]);
  }
  if(!c.droid && cs.stimHrs>0) mods.push(['Stimulant', STIM.stMod]);   // the stim masks the body's limits until it wears off
  return mods;
}
const effStrainThresh = (cs, c) => cs.st>0 ? Math.max(1, cs.st + strainMods(cs, c).reduce((a,[,m])=>a+m, 0)) : 0;
const strainOut = (cs, c) => cs.st>0 && cs.strain >= effStrainThresh(cs, c);   // unconscious / disabled
// Down = unconscious (strain), dying (wounds) or collapsed from thirst/starvation: the body lies where it fell.
const isDown = (cs, c) => strainOut(cs, c) || (cs.wounds>cs.wt && cs.wt>0) || (!c.droid && (cs.water>=100 || cs.hunger>=100));
function condMult(cs, key){
  const c = cfg(cs.id), env = ENVS[S.env];
  // Chilled/Overheated: a Cold environment already charges the extra calories, so Chilled
  // adds no more hunger there (it still tires you and costs the Setback); adapted species
  // feel only their share of the excess.
  const climateMult = (id, mm) => {
    if(id==='chilled' && key==='hunger' && env.cold) return 1;
    return 1 + (mm-1)*climateAdapt(c, id==='overheated');
  };
  let m = 1;
  for(const cd of cs.conds){
    let mm = CONDS[cd.id]?.mult?.[key];   // custom conditions carry no multipliers
    if(!mm) continue;
    mm = typeof mm==='function' ? mm(cd.lvl||1) : mm;
    if(cd.id==='chilled' || cd.id==='overheated') mm = climateMult(cd.id, mm);
    m *= mm;
  }
  // soaked in a cold environment also counts as chilled
  if(cs.conds.some(x=>x.id==='soaked') && env.cold && !cs.conds.some(x=>x.id==='chilled')){
    const mm = CONDS.chilled.mult[key]; if(mm) m *= climateMult('chilled', mm);
  }
  return m;
}
const activeAct = cs => cs.status ? (cs.status.act || STATUSES[cs.status.kind].act) : cs.activity;   // a droid on the bench overrides the repair's default
// Stim doses: a rolling window that opens with the first stim and clears STIM.windowHrs later.
function rolloverStimWindow(cs){
  if(cs.stimsToday>0 && S.hour - (cs.stimWindowStart??-99) >= STIM.windowHrs){ cs.stimsToday=0; return true; }
  return false;
}
const stimResetIn = cs => cs.stimsToday>0 ? Math.max(0, STIM.windowHrs - (S.hour - (cs.stimWindowStart??0))) : 0;

function exhaustion(cs){  // droid degradation meter (organics use per-need tiers instead)
  // a pack runs clean to the halfway mark, then every point of drain counts double; wear degrades smoothly
  let x = 0.55*Math.max(0, (cs.charge-50)*2) + 0.45*cs.maint;
  x += [cs.charge,cs.maint].filter(v=>v>=70).length * 8;
  return Math.min(100, x);
}

/* ================================================================
   CORE SIMULATION — dt hours (≤1) for one character
   ================================================================ */
function tick(cs, dt){
  const c = cfg(cs.id), env = ENVS[S.env];
  const events = [];
  if(cs.status && cs.status.remain < 0.01) endStatus(cs, c, events);   // drift left a sliver — don't run a whole chunk on it
  let actKey = activeAct(cs);
  if(actKey!=='sleeping' && isDown(cs, c)) actKey = 'resting';          // an unconscious body isn't marching
  const act = ACTS[actKey];
  const isStandby = actKey==='sleeping';
  const over = overload(cs);
  const encM = 1 + ENC_DRAIN_PER_PT*over;
  const woundCap = cs.wt>0 ? cs.wt+10 : 999;

  if(c.droid){ /* ---- droid ---- */
    const prevCharge = cs.charge;
    if(prevCharge < 100){  // a shut-down droid draws no power and grinds no gears
      cs.charge = clamp(cs.charge + (100/c.packHrs)*act.power*env.power*encM*condMult(cs,'charge')*dt, 0, 100);
      cs.maint  = clamp(cs.maint + MAINT_BASE*act.maint*envMult(env.maint, c.mods.maintAdapt)*(c.mods.maintRate||1)*encM*condMult(cs,'maint')*dt, 0, 100);
    }
    if(prevCharge<100 && cs.charge>=100) events.push(['lb',`🔋 ${c.name}'s power pack is drained — FULL SHUTDOWN until a fresh pack or recharge.`]);
  } else {   /* ---- organic ---- */
    if(rolloverStimWindow(cs)) events.push(['lg',`💉 ${c.name}'s stim tolerance clears — ${STIM.maxHeals} safe doses again.`]);
    const fM = forceMult(cs);

    const wEnv = envMult(env.water, env.heat ? (c.mods.heatAdapt??1) : 1);
    const wRate = tierOf(cs.water, NEEDS.water.tiers).rate;  // accrual speeds up as thirst deepens
    cs.water = clamp(cs.water + wRate*act.water*wEnv*(c.mods.waterRate||1)*encM*fM*condMult(cs,'water')*dt, 0, 100);

    const hEnv = envMult(env.hunger, env.cold ? (c.mods.coldAdapt??1) : 1);
    const hRate = tierOf(cs.hunger, NEEDS.hunger.tiers).rate;  // fast appetite, then a slow burn on reserves
    cs.hunger = clamp(cs.hunger + hRate*(c.mods.hungerRate||1)*act.hunger*hEnv*encM*fM*condMult(cs,'hunger')*dt, 0, 100);

    // hygiene: grime decelerates as it accumulates; the Force can't keep you clean
    const gRate = tierOf(cs.hygiene, NEEDS.hygiene.tiers).rate;
    cs.hygiene = clamp(cs.hygiene + gRate*act.hyg*env.hyg*condMult(cs,'hygiene')*dt, 0, 100);

    // fatigue: activity-driven; sleep deprivation slows recovery and speeds accrual
    const sleepDep = cs.sleep >= SLEEP_FATIGUE.thresh;
    if(act.rest < 0) cs.rest = clamp(cs.rest + act.rest*(sleepDep?SLEEP_FATIGUE.recovery:1)*dt, 0, 100);
    else {
      const rEnv = envMult(env.rest, (env.heat||env.cold) ? climateAdapt(c, !!env.heat) : 1);   // adapted species feel less of the climate's extra fatigue
      cs.rest = clamp(cs.rest + act.rest*rEnv*(c.mods.restRate||1)*encM*fM*(cs.stimHrs>0?STIM.fatigueMult:1)*(sleepDep?SLEEP_FATIGUE.accrual:1)*condMult(cs,'rest')*dt, 0, 100);
    }

    const prevSleep = cs.sleep;
    if(isStandby){
      let d = sleepRecovery(c)*dt;
      if(cs.status?.sleepCap!=null){ d = Math.min(d, Math.max(0, cs.status.sleepCap - cs.status.recovered)); cs.status.recovered = +(cs.status.recovered + d).toFixed(3); }
      cs.sleep = clamp(cs.sleep - d, 0, 100);
    } else {
      let sRate = SLEEP.awakeRate*(c.mods.sleepRate||1);
      if(actKey==='resting') sRate *= SLEEP.restingMult;                 // quiet rest eases the debt a little
      if(cs.rest >= FATIGUE_SLEEP.thresh) sRate *= FATIGUE_SLEEP.accrual; // a worn-out body craves rest
      cs.sleep = clamp(cs.sleep + sRate*(1+ENC_SLEEP_PER_PT*over)*fM*condMult(cs,'sleep')*dt, 0, 100);
      if(prevSleep<100 && cs.sleep>=100) events.push(['lw',`${c.name} is Wrecked — the GM may force an involuntary collapse into sleep at any dramatic moment.`]);
    }
  }

  // ambient equipment wear: weapons & worn gear age with time (0→100 in ~1 month temperate,
  // faster in harsh environments), on top of per-use wear
  const wearEnv = env.maint || 1;
  for(const it of cs.inv){
    if(!isEquipped(it)) continue;   // only weapons, armor and tools wear, and only while equipped
    const before = it.wear||0;
    if(before>=100) continue;
    it.wear = clamp(before + WEAR_PER_HOUR*wearEnv*dt, 0, 100);
    if(before<100 && it.wear>=100) events.push(['lw',`🗡 ${c.name}'s ${esc(it.alias||it.name||'equipment')} is worn out (Broken) — repair before relying on it.`]);
  }

  // timed status payload & countdown
  if(cs.status){
    const def = STATUSES[cs.status.kind];
    const deltas = cs.status.deltas || def.deltas;   // meals store caps computed when eating began
    const step = Math.min(dt, cs.status.remain);
    const frac = step / cs.status.total;
    for(const k in deltas){
      let dv = deltas[k]*frac;
      if(k==='rest' && dv<0 && cs.sleep>=SLEEP_FATIGUE.thresh) dv *= SLEEP_FATIGUE.recovery;
      cs[k] = clamp(cs[k] + dv, 0, 100);
    }
    if(def.sleepCredit) cs.sleep = clamp(cs.sleep - def.sleepCredit*sleepRecovery(c)*frac, 0, 100);
    cs.status.remain = +(cs.status.remain - dt).toFixed(3);
    if(cs.status.remain <= 0) endStatus(cs, c, events);
  }

  // discrete hourly effects
  cs.hourAcc = +(cs.hourAcc + dt).toFixed(3);
  while(cs.hourAcc >= 1){
    cs.hourAcc = +(cs.hourAcc - 1).toFixed(3);
    applyHourly(cs, c, events, woundCap, isStandby, actKey);
  }
  // stimulant countdown runs after the hourly step so a crash born at an hour mark keeps its full first hour
  if(!c.droid && cs.stimHrs>0){
    cs.stimHrs = Math.max(0, +(cs.stimHrs - dt).toFixed(3));
    if(cs.stimHrs===0){   // the loan comes due: crash level = doses in the window
      const lvl = clamp(cs.stimsToday, 1, STIM.crashMaxLvl), back = STIM.crashFatigue*lvl;
      cs.rest = clamp(cs.rest + back, 0, 100);
      cs.conds = cs.conds.filter(x=>x.id!=='crash');
      cs.conds.push({id:'crash', lvl, hrs:0});
      events.push(['lw',`💥 ${c.name}'s stimulant wears off — Crash ${lvl}/${STIM.crashMaxLvl}: +${back} fatigue back, strain threshold loses its +${STIM.stMod}, ${lvl>=3?'2 Setback + upgrade':lvl===2?'2 Setback':'1 Setback'} to all checks for ${lvl*STIM.crashHrs} hrs.`]);
    }
  }

  // tier-change notices
  if(c.droid){  // droids keep the combined degradation meter
    const ex = exhaustion(cs), t = tierOf(ex, DTIERS), ti = DTIERS.indexOf(t);
    if(ti !== cs.lastTier){
      events.push([ti>cs.lastTier?'lw':'ld', `${c.name} is now ${t.name} (degradation ${Math.round(ex)}).`]);
      cs.lastTier = ti;
    }
  } else {  // organics: one notice per need as it crosses a tier
    for(const key of NEED_KEYS){
      const tiers = NEEDS[key].tiers, t = tierOf(cs[key], tiers), ti = tiers.indexOf(t);
      const prev = cs.lastTiers[key]||0;
      if(ti !== prev){
        if(ti>0 || prev>0) events.push([ti>prev?'lw':'', `${c.name} is now ${t.name} (${plainLabel(NEEDS[key].label).toLowerCase()} ${Math.round(cs[key])}).`]);
        cs.lastTiers[key] = ti;
      }
    }
  }
  // threshold notices fire once, on the crossing (the card keeps showing the state)
  const uncon = strainOut(cs, c), dead = cs.wounds>cs.wt && cs.wt>0;
  if(uncon && !cs.wasUncon) events.push(['lw',`${c.name} has exceeded strain threshold (${cs.strain}/${effStrainThresh(cs,c)}${effStrainThresh(cs,c)!==cs.st?`, base ${cs.st}`:''}) — ${c.droid?'DISABLED':'UNCONSCIOUS'}; needs now accrue as resting.`]);
  if(dead && !cs.wasDead)   events.push(['lb',`☠ ${c.name} has exceeded wound threshold (${cs.wounds}/${cs.wt}) — ${c.droid?'CRITICAL DAMAGE, needs major repairs':'CRITICAL INJURY / DYING'}.`]);
  cs.wasUncon = uncon; cs.wasDead = dead;
  return events;
}
function endStatus(cs, c, events){
  const def = STATUSES[cs.status.kind];
  if(def.repair){   // the work is done — how well it went is a Mechanics check (rollRepair), so nothing changes yet
    const j = cs.status.self ? { kind:cs.status.kind, self:1 } : { kind:cs.status.kind, ...cs.status.item };
    cs.repair = j;
    events.push(['ld', `🔧 ${c.name} ${j.self ? `comes off the bench` : `finishes work on ${esc(repairTargetLabel(cs, j))}`} — roll <b>Mechanics</b> on the card to see how the ${plainLabel(def.label).toLowerCase()} went.`]);
  } else
  events.push(['lg',`${c.name} finishes ${plainLabel(def.label).toLowerCase()} — status back to normal.`]);
  if(cs.status.kind==='sleep' && cs.status.total>=SLEEP.fullNightHrs && cs.strain>0){   // a full night's rest clears all strain (RAW)
    cs.strain = 0;
    events.push(['lg',`${c.name} wakes with strain cleared — a full night's rest.`]);
  }
  cs.status = null; cs.activity = cs.prevAct;
}

function applyHourly(cs, c, events, woundCap, isStandby, actKey){
  // condition hourly effects (organics & droids; custom conditions have none)
  for(const cd of cs.conds) CONDS[cd.id]?.hourly?.(cs, cd.lvl||1, events, woundCap);
  // timed conditions wear off on their own: one level per decayHrs if leveled, else cleared
  for(const cd of [...cs.conds]){
    const def = CONDS[cd.id]; if(!def?.decayHrs) continue;
    cd.hrs = (cd.hrs||0) + 1;
    if(cd.hrs < def.decayHrs) continue;
    cd.hrs = 0;
    if(def.lvls && (cd.lvl||1) > 1){ cd.lvl--; events.push(['lg',`${def.label} eases to ${cd.lvl}/${def.lvls} — ${c.name}.`]); }
    else { cs.conds = cs.conds.filter(x=>x!==cd); events.push(['lg',`${def.label} wears off — ${c.name}.`]); }
  }

  // strain recovery (core rules: rest heals strain): sleep/standby pays off a threshold
  // per night, quiet rest 1 per hour — so an unconscious body resting comes round
  if(isStandby) recoverStrain(cs, sleepStrainPerHr(cs));
  else if(actKey==='resting') recoverStrain(cs, 1);

  if(c.droid){  // droids: wear ⇒ wounds at 100 (degradation shrinks the strain threshold, see strainMods)
    if(cs.maint>=100 && !isStandby && cs.charge<100 && cs.wounds<woundCap){
      cs.wounds++; events.push(['lb',`🔧 ${c.name} suffers 1 wound — mechanisms grinding themselves apart.`]);
    }
    return;
  }

  // organics: each need's current tier applies its own wounds / special effect (strain-threshold
  // modifiers are read live by strainMods, never ticked)
  for(const key of NEED_KEYS){
    const t = tierOf(cs[key], NEEDS[key].tiers);
    if(t.wounds>0 && cs.wounds<woundCap){
      cs.wounds += t.wounds;
      events.push(['lb',`${c.name} suffers ${t.wounds} wound — ${plainLabel(NEEDS[key].label).toLowerCase()} (${t.name}).`]);
    }
    t.hourly?.(cs, c, events, woundCap);
  }
  if(cs.hunger < 76)  cs.starveHrs = 0;   // starvation wound clock runs only while Emaciated+
  if(cs.water < 76)   cs.dehydHrs = 0;    // dehydration wound clock runs only while Desiccated+
  if(cs.hygiene < 76) cs.hygHrs = 0;      // daily hygiene checks run only while Squalid+
  if(!cs.conds.some(x=>x.id==='sick')) cs.sickHrs = 0;

  // environmental conditions from prolonged exposure
  const base = ENV_COND_CHANCE[S.env];
  if(base){
    const heat = !!ENVS[S.env].heat, condId = heat ? 'overheated' : 'chilled';
    const chance = base * climateAdapt(c, heat);
    if(!cs.conds.some(x=>x.id===condId) && Math.random()<chance){
      cs.conds.push({id:condId});
      events.push(['lw',`${c.name} is ${condId} by the ${ENVS[S.env].label.toLowerCase()} (GM may waive with proper gear).`]);
    }
  }
}

function advanceCustom(){   // the typed span: clamp to the input's range, confirm anything over two days
  const el = document.getElementById('customHrs');
  const h = clamp(parseFloat(el.value)||1, 0.25, 168);
  el.value = h;
  if(h>48 && !confirm(`Advance ${fmtDur(h)} (${(h/24).toFixed(1)} days) in one step?`)) return;
  advance(h);
}
function advance(hrs){
  if(!hrs || hrs<=0) return;
  let left = hrs;
  while(left > 0){
    let dt = Math.min(1, left);
    // stop the chunk at the next timed-status boundary, so the activity a status
    // imposes (eating, sleeping, medical) never bleeds past its actual duration
    for(const cs of S.chars)
      if(cs.status && cs.status.remain >= 0.01 && cs.status.remain < dt) dt = cs.status.remain;
    left = +(left-dt).toFixed(3);
    S.hour = +(S.hour+dt).toFixed(3);
    for(const cs of S.chars) for(const ev of tick(cs, dt)) logMsg(ev[1], ev[0]);
    for(const ev of tickShip(dt)) logMsg(ev[1], ev[0]);
    for(const c of S.counters){
      if(!(c.hrs>0)) continue;
      c.hrs = Math.max(0, +(c.hrs-dt).toFixed(3));
      if(c.hrs===0) logMsg(`⏳ <b>${esc(c.label)}</b> — countdown complete (${clockStr()}).`, 'lg');
    }
  }
  logMsg(`⏱ Advanced ${fmtDur(hrs)} → ${clockStr()}.`);
  render();
}

/* ================================================================
   TIMED STATUSES
   ================================================================ */
/* ---- consumable stock: the inventory IS the stock. Snack / Ration / Meal are inventory types;
   a stimpack is any row linked to the database's Stimpack (or simply named so). The hunger and
   stim buttons take one whole item from the first matching row that has one. ---- */
const STOCK = {
  Snack: { label:'snack',    row:{name:'Snack', ref:'Snack', type:'Snack', wt:0.05} },
  Ration:{ label:'ration',   row:{name:'Field Ration Pack', ref:'Field Ration Pack', alias:'Field rations', type:'Ration', wt:0.2} },
  Meal:  { label:'meal',     row:{name:'Meal', ref:'Meal', type:'Meal', wt:0.3} },
  Stim:  { label:'stimpack', row:{name:'Stimpack', ref:'Stimpack', type:'Medical', wt:0.05} },
};
const LEGACY_AUTO = ['rations','snacks','stims'];   // pre-overhaul counter rows (an un-refreshed browser may still send them)
const isStim = it => it.ref==='Stimpack' || /^stim ?packs?$/i.test(it.name||'');
const stockRows = (cs, kind) => cs.inv.filter(it=>it && !it.auto && isCarried(it) && (kind==='Stim' ? isStim(it) : it.type===kind));   // you can only eat what you carry
const stockOf   = (cs, kind) => Math.floor(stockRows(cs, kind).reduce((a,it)=>a+(+it.qty||0), 0));
const stockRow  = (kind, qty) => ({...STOCK[kind].row, qty});
function takeStock(cs, kind){
  const row = stockRows(cs, kind).find(it=>(+it.qty||0) >= 1); if(!row) return false;
  row.qty = +((+row.qty) - 1).toFixed(2); return true;
}
function giveStock(cs, kind){
  const row = stockRows(cs, kind)[0];
  if(row) row.qty = +((+row.qty||0) + 1).toFixed(2); else cs.inv.push(stockRow(kind, 1));
}
// One-time conversion of the old counters (cs.rationsStock / snacks / stims and their italic "auto"
// inventory rows) into ordinary inventory rows, then link every row to the Items database.
function upgradeInv(cs, c, invV0){
  cs.inv = (cs.inv||[]).filter(it=>it && typeof it==='object');
  if(invV0!==2 && !c.droid){
    for(const [kind,key] of [['Ration','rationsStock'],['Snack','snacks'],['Stim','stims']])
      if(cs[key]!==undefined) cs.inv.push(stockRow(kind, Math.max(0, Math.round(+cs[key])||0)));
  }
  cs.inv = cs.inv.filter(it=>!LEGACY_AUTO.includes(it.auto));
  delete cs.rationsStock; delete cs.snacks; delete cs.stims; cs.invV = 2;
  for(const it of cs.inv){
    if((it.type||'').toLowerCase()==='gear (worn)') it.type = 'Gear';   // the old worn-gear type is gone
    if((it.type||'').toLowerCase()==='gear (pack)') it.type = 'Bag';    // renamed
    if((it.type||'').toLowerCase()==='food') it.type = /snack/i.test(it.name) ? 'Snack' : /meal/i.test(it.name) ? 'Meal' : 'Ration';
    linkRow(it);
  }
}

function startStatus(id, kind, dur){
  const cs = st(id), c = cfg(id), def = STATUSES[kind];
  if(def.fs && !isFS(cs)) return;   // meditation is for Force sensitives only
  if(cs.status) cancelStatus(id, true);
  const deltas = {...def.deltas};
  let cost = 0;
  if(kind==='ration' || kind==='meal'){
    const food = kind==='meal' ? 'Meal' : 'Ration';
    if(!takeStock(cs, food)){ logMsg(`${c.name} has no ${STOCK[food].label}s to eat — add some to the inventory on the Sheets tab.`,'lw'); render(); return; }
    cost = 1;
    let pts = foodPts(c, kind); const notes = [];
    if(cs.water >= REHYDRATE.thresh){ pts = pts/2; notes.push('dehydrated — the body absorbs only half the nourishment'); }
    if(cs.hunger >= REFEED.thresh){
      pts = pts*REFEED.frac;
      notes.push(`starving — only ${Math.round(REFEED.frac*100)}% of a careful meal is absorbed; gorging risks refeeding shock (a 🤒 Sick stack, GM's call)`);
    }
    deltas.hunger = -pts;
    if(notes.length) logMsg(`⚠ ${c.name}: ${notes.join('; ')}.`,'lw');
  }
  const total = dur || def.dur;
  cs.prevAct = cs.activity;
  cs.status = { kind, remain:total, total, deltas, cost };   // cost: one food item paid up front; it goes back in the pack if the meal is abandoned before halfway
  if(cost) cs.status.food = kind==='meal' ? 'Meal' : 'Ration';
  if(kind==='sleep' && cs.sleep >= SLEEP.deepDebtFrom){        // days of debt: one night recovers most of it, not all
    cs.status.sleepCap = SLEEP.deepDebtCap; cs.status.recovered = 0;
    logMsg(`😴 ${c.name} is ${tierOf(cs.sleep, NEEDS.sleep.tiers).name} — this sleep recovers at most ${SLEEP.deepDebtCap} sleep debt; a second night finishes the job.`,'lw');
  }
  logMsg(`${def.label} — ${c.name} (${fmtDur(total)}). Advance the clock to progress.`, kind.startsWith('med')?'lf':'');
  render();
}
function cancelStatus(id, silent){
  const cs = st(id);
  if(!cs.status) return;
  const def = STATUSES[cs.status.kind];
  const food = cs.status.food || 'Ration';
  const refund = cs.status.cost && cs.status.remain/cs.status.total > 0.5;
  cs.status = null; cs.activity = cs.prevAct;
  if(refund){ giveStock(cs, food); logMsg(`🍽 ${cfg(id).name} packs the barely-touched ${STOCK[food].label} away again.`); }
  if(!silent){ logMsg(`✖ ${cfg(id).name} stops ${plainLabel(def.label).toLowerCase()} — status back to normal.`); render(); }
}
function setSleepHrs(id, v){ st(id).sleepHrs = clamp(parseFloat(v)||SLEEP.hoursDefault, 0.5, 16); render(); }
function startSleep(id){
  startStatus(id, 'sleep', clamp(st(id).sleepHrs||SLEEP.hoursDefault, 0.5, 16));
}

/* ================================================================
   PLAYER ACTIONS — organics
   ================================================================ */
function drink(id, oz){
  const cs = st(id), c = cfg(id);
  let ozUsed = Math.min(oz, cs.canteen);
  if(ozUsed<=0){ logMsg(`${c.name}'s canteen is empty!`, 'lw'); render(); return; }
  const dehydrated = cs.water >= REHYDRATE.thresh;
  if(dehydrated && S.hour - (cs.lastDrinkAt??-99) < REHYDRATE.waitHrs){   // the cap is per quarter hour, not per click
    logMsg(`${c.name} is still cramping from the last sip — advance the clock ${Math.round(REHYDRATE.waitHrs*60)} min before drinking again.`,'lw'); render(); return;
  }
  const capped = dehydrated && ozUsed > REHYDRATE.capOz;  // a dehydrated gut keeps down only so much
  if(capped) ozUsed = REHYDRATE.capOz;
  const pts = ozToPts(c, ozUsed);
  cs.lastDrinkAt = S.hour;
  cs.canteen = +(cs.canteen - ozUsed).toFixed(1);
  cs.water = clamp(cs.water - pts, 0, 100);
  logMsg(`${c.name} drinks ${ozUsed} oz (−${pts.toFixed(1)} thirst)${capped?` — severely dehydrated, the body keeps down only ~${REHYDRATE.capOz} oz per ${Math.round(REHYDRATE.waitHrs*60)} min; sip and rest`:''}. Canteen: ${cs.canteen}/${OZ_PER_CANTEEN} oz.`);
  render();
}

/* ================================================================
   SHIP — Mantis. Simulation on the party clock + player actions
   ================================================================ */
function tickShip(dt){
  const sh = S.ship, ev = [], act = SHIP_ACTS[sh.activity];
  // fuel burn at the current flight status
  if(act.tph>0 && sh.fuel>0){
    const before = sh.fuel;
    sh.fuel = clamp(+(sh.fuel - act.tph*dt).toFixed(3), 0, SHIP.fuelCap);
    const pb = before/SHIP.fuelCap*100, pa = sh.fuel/SHIP.fuelCap*100;
    if(pb>25 && pa<=25) ev.push(['lw',`⛽ Mantis fuel low — below 25% (${(SHIP.fuelCap*0.25)}t).`]);
    if(pb>10 && pa<=10) ev.push(['lw',`⛽ Mantis fuel critical — below 10% (${(SHIP.fuelCap*0.1)}t).`]);
    if(pb>0  && pa<=0)  ev.push(['lb','🪫 Mantis is OUT OF FUEL — dead in space until refueled.']);
  }
  // system wear: ~one condition pip per week of cruising without maintenance, scaled by the
  // flight status (idling a quarter, combat double) and by each system's energy draw
  // (over-default speeds wear, under-default slows it)
  if(act.wear>0){
    for(const s of SHIP_SYSTEMS){
      if(sh.systems[s.id]<=0){ sh.sysHrs[s.id]=0; continue; }
      sh.sysHrs[s.id] = +((sh.sysHrs[s.id]||0) + dt*act.wear*energyWearMult(sh.energy[s.id])).toFixed(3);
      while(sh.sysHrs[s.id]>=SHIP_MAINT_WEEK && sh.systems[s.id]>0){
        sh.sysHrs[s.id] = +(sh.sysHrs[s.id]-SHIP_MAINT_WEEK).toFixed(3);
        sh.systems[s.id]--;
        ev.push(['lw',`🔧 Mantis ${s.name} slips to ${shipCond(sh.systems[s.id]).name} (${sh.systems[s.id]}/5) — sustained operation without maintenance.`]);
      }
    }
  }
  return ev;
}
function setShipAct(v){ S.ship.activity=v; logMsg(`🚀 Mantis flight status: ${SHIP_ACTS[v].label} (${SHIP_ACTS[v].tph} t/hr fuel burn).`); render(); }

  const a = SHIP_ACTS[actKey], used = +(a.tph*hrs).toFixed(2);

/* ---- energy distribution (total conserved: Σ system energy + reserve) ---- */
function energyAdj(id, d){
  const sh = S.ship;
  if(d>0){                                   // draw a point from the reserve into this system
    if(sh.reserve<=0){ logMsg('⚡ No reserve energy — pull a point from another system first.','lw'); return; }
    if(sh.energy[id]>=SHIP_ENERGY_MAX){ logMsg(`⚡ ${sysName(id)} is already at maximum energy (${SHIP_ENERGY_MAX}).`,'lw'); return; }
    sh.energy[id]++; sh.reserve--;
  } else {                                   // return a point from this system to the reserve
    if(sh.energy[id]<=0) return;
    sh.energy[id]--; sh.reserve++;
  }
  if(id==='shields' && sh.energy.shields!==SHIP_ENERGY_MAX) sh.shieldBoost=noBoost();
  const m = energyWearMult(sh.energy[id]), bonus = overcharged(id) ? ` · ⚡overcharged: ${SHIP_ENERGY_BONUS[id].label}` : '';
  logMsg(`⚡ ${sysName(id)} energy ${sh.energy[id]} (wear ×${m.toFixed(2)})${id==='sensors'?` · sensor range ${sensorRangeFor(sh.energy.sensors)}`:''}${bonus} · reserve ${sh.reserve}.`);
  render();
}

function useItem(id,i){

  logMsg(`🔧 ${isArmor(it) ? `${cfg(id).name}'s ${esc(it.alias||it.name||'armor')} takes a hit` : `${cfg(id).name} uses ${esc(it.alias||it.name||'an item')}`} (+${WEAR_PER_USE} wear → ${Math.round(it.wear)}${it.wear>=100?', now BROKEN':''}).`, it.wear>=100?'lw':'');
