   MULTIPLAYER SYNC — live shared "room" via Firebase Realtime Database.
   Everyone in a room edits the same tracker and changes propagate in <1s.
   - Anyone can edit. Writes are per-character, so two people editing
     DIFFERENT characters don't clobber each other.
   - A live update that lands while you're typing in a field is held until
     you finish (focus guard), then applied.
   - Images are GM-set repo files (img/…) and are never synced.
   - 'visible' (the Show chips) stays local to each device — a view pref.
   Known limit: the shared log is last-write-wins, so two log entries created
   within the same moment can collide; character edits still merge cleanly.
   (Dice rolls avoid this: they live in rooms/<id>/rolls, appended with push().)
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAyrGynBaL0MTqru_DeBktBF036Efa7dAg",
  authDomain: "survival-tracker-46047.firebaseapp.com",
  databaseURL: "https://survival-tracker-46047-default-rtdb.firebaseio.com",
  projectId: "survival-tracker-46047",
  storageBucket: "survival-tracker-46047.firebasestorage.app",
  messagingSenderId: "128759739941",
  appId: "1:128759739941:web:60fa302ef28ac2e593b1cc"
};

const CLOUD = {
  db: null,          // firebase database handle (null → offline/solo)
  room: null,        // room id
  ref: null,         // rooms/<id>/state ref we're subscribed to
  rollsRef: null,    // rooms/<id>/rolls query (the append-only dice feed)
  _conn: null,       // .info/connected ref
  player: 'Player',
  online: false,     // firebase connection state
  synced: false,     // false until we've received the room's first snapshot (blocks join-clobber)
  applying: false,   // true while writing a remote update into S (suppresses echo)
  shadow: null,      // sync-subset of the state we believe is on the server (for diffing)
  pending: null,     // a remote update deferred because the user is mid-edit
  pointerDown: false,// a mouse/touch press is in progress (defer re-renders until the click lands)
  syncTimer: null,   // debounce handle for outbound writes
  saveTimer: null,   // debounce handle for the localStorage copy
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function setPlayerName(n){
  CLOUD.player = (n||'').trim() || 'Player';
  lsSet('st_player', CLOUD.player);
  const el = document.getElementById('playerIn');
  if(el && CLOUD.player!=='Player' && el.value!==CLOUD.player) el.value = CLOUD.player;
}

/* ---- helpers -------------------------------------------------- */
// The slice of S that syncs: everything EXCEPT local view prefs (visible) and
// GM image fields. Deep-cloned so callers may diff or store it freely.
function syncSubset(state){
  const c = JSON.parse(JSON.stringify(state));
  delete c.visible; delete c.ambImg;
  if(c.ship) delete c.ship.img;
  if(Array.isArray(c.chars)) c.chars.forEach(ch=>{
    delete ch.img;
    delete ch.invOpen; delete ch.customOpen; delete ch.gearOpen; delete ch.armorOpen;   // per-player UI state stays local
    if(ch.invV===2){   // pre-overhaul counters from a browser that hasn't refreshed: ignore, don't echo, don't fight over them
      delete ch.rationsStock; delete ch.snacks; delete ch.stims;
      if(Array.isArray(ch.inv)) ch.inv = ch.inv.filter(it=>!(it && LEGACY_AUTO.includes(it.auto)));
    }
  });
  return prune(c);
}
// RTDB refuses to store nulls and empty arrays/objects (it deletes the key
// instead), so strip them from the wire format too — otherwise our local copy
// never matches the server echo, every diff looks dirty, and the 3-way merge
// sees phantom edits. migrate() restores the defaults on the way back in.
function prune(v){
  if(Array.isArray(v)){ v.forEach(prune); return v; }
  if(v && typeof v==='object'){
    for(const k of Object.keys(v)){
      const x = v[k];
      if(x===null || x===undefined){ delete v[k]; continue; }
      if(typeof x==='object'){
        prune(x);
        if((Array.isArray(x) ? x.length : Object.keys(x).length)===0) delete v[k];
      }
    }
  }
  return v;
}
// Firebase returns arrays as index-keyed objects; turn those back into arrays.
function arrayify(v){
  if(v && typeof v==='object' && !Array.isArray(v)){
    const keys = Object.keys(v);
    if(keys.length && keys.every(k=>/^\d+$/.test(k)))
      return keys.sort((a,b)=>a-b).map(k=>v[k]);
  }
  return v;
}
// Order-independent serialization, so RTDB key reordering isn't seen as a change.
function stable(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
}
const same = (a,b) => stable(a)===stable(b);

function syncNote(msg, cls){
  const el = document.getElementById('syncMsg'); if(!el) return;
  el.textContent = msg;
  el.style.color = cls==='bad' ? 'var(--bad)' : cls==='ok' ? 'var(--gold)' : 'var(--dim)';
}
function liveLabel(){
  const el = document.getElementById('roomState'); if(!el) return;
  if(!CLOUD.room){ el.textContent='solo — not shared'; el.style.color='var(--dim)'; }
  else if(!CLOUD.db){ el.textContent='offline — sync unavailable'; el.style.color='var(--bad)'; }
  else if(CLOUD.online){ el.textContent='● live · room '+CLOUD.room.slice(0,6); el.style.color='var(--good)'; }
  else { el.textContent='○ connecting · room '+CLOUD.room.slice(0,6); el.style.color='var(--warn)'; }
  const rin=document.getElementById('roomIn'); if(rin && CLOUD.room && rin.value!==CLOUD.room) rin.value=CLOUD.room;
}
function setRoomId(id){
  CLOUD.room = id || null;
  if(id){ lsSet('st_room', id); try{ if(location.hash!=='#room='+id) history.replaceState(null,'','#room='+id); }catch(e){} }
  else { lsSet('st_room',''); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  liveLabel();
}

/* ---- focus guard: is the user mid-edit in a field? ------------ */
function isEditing(){
  const a = document.activeElement; if(!a) return false;
  const t = (a.tagName||'').toUpperCase();
  if(t==='TEXTAREA' || t==='SELECT') return true;
  if(t==='INPUT'){ const ty=(a.type||'text').toLowerCase(); return ty!=='file' && ty!=='button' && ty!=='checkbox' && ty!=='radio'; }
  return a.isContentEditable===true;
}

/* ---- outbound: push local changes (debounced, per-character) --- */
// Local persistence: every change (render/logMsg → scheduleSync) also lands in this
// device's localStorage, debounced, so a reload or a discarded tab doesn't reset the
// session to Day 1. A joined room still wins on attach (first snapshot adopts the room).
const LOCAL_STATE_KEY = 'st_state';
function scheduleLocalSave(){
  clearTimeout(CLOUD.saveTimer);
  CLOUD.saveTimer = setTimeout(()=>{ try{ lsSet(LOCAL_STATE_KEY, JSON.stringify(S)); }catch(e){} }, 400);
}
function loadLocalState(){
  const raw = lsGet(LOCAL_STATE_KEY); if(!raw) return null;
  try{ const s = JSON.parse(raw); return (s && Array.isArray(s.chars)) ? migrate(s) : null; }catch(e){ return null; }
}
function resetAll(){
  const shared = CLOUD.db && CLOUD.room;
  if(!confirm(`Start a fresh session? Clock back to Day 1, 00:00, every need at 0.${shared?' This resets the shared room for everyone in it.':''} (💾 Save first to keep this one.)`)) return;
  const homebrew = S.homebrew || [];   // homebrew items are catalog entries, not session state — they survive a new session
  S = freshState(); S.homebrew = homebrew;
  logMsg('🆕 New session — Day 1, 00:00. All needs at 0, canteens full, droid packs charged.');
  rebuildLog(); render();
}
function scheduleSync(){
  scheduleLocalSave();
  if(!CLOUD.db || !CLOUD.room || CLOUD.applying || !CLOUD.synced) return;
  clearTimeout(CLOUD.syncTimer);
  CLOUD.syncTimer = setTimeout(pushLocal, 180);
}
function pushLocal(){
  if(!CLOUD.db || !CLOUD.room || CLOUD.applying || !CLOUD.synced) return;
  const cur = syncSubset(S), prev = CLOUD.shadow, updates = {};
  for(const k in cur){
    if(k==='chars'){
      const a = cur.chars||[], b = (prev&&prev.chars)||[];
      for(let i=0;i<a.length;i++) if(!same(a[i], b[i])) updates['chars/'+i]=a[i];
    } else if(k==='ship'){   // per-subkey, so concurrent edits to different ship systems don't clobber
      const a = cur.ship||{}, b = (prev&&prev.ship)||{};
      for(const kk of new Set([...Object.keys(a), ...Object.keys(b)]))
        if(!same(a[kk], b[kk])) updates['ship/'+kk] = a[kk]===undefined ? null : a[kk];
    } else if(!same(cur[k], prev?prev[k]:undefined)){
      updates[k]=cur[k];
    }
  }
  // a top-level key we emptied (the last countdown removed, the last homebrew item deleted) is pruned from
  // `cur` altogether, so the loop above never sees it — delete it on the server or it comes straight back
  for(const k in (prev||{})) if(!(k in cur)) updates[k] = null;
  if(!Object.keys(updates).length) return;
  const prevShadow = CLOUD.shadow;
  CLOUD.shadow = cur;                              // optimistic; on failure fall back to the last acknowledged
  CLOUD.db.ref('rooms/'+CLOUD.room+'/state').update(updates)   // shadow so the 2 s safety net resends the diff
    .then(()=> CLOUD.db.ref('rooms/'+CLOUD.room+'/meta').set({ by:CLOUD.player, ts:Date.now() }))
    .catch(e=>{ CLOUD.shadow = prevShadow; syncNote('Sync error: '+e.message, 'bad'); });
}

/* ---- inbound: a room snapshot arrived -------------------------- */
function onRoomSnap(remote){
  if(remote==null){                       // empty room → seed it with our current state
    CLOUD.shadow = null; CLOUD.synced = true; pushLocal(); return;
  }
  remote.chars = arrayify(remote.chars);
  remote.log   = arrayify(remote.log);
  if(CLOUD.shadow && same(syncSubset(remote), CLOUD.shadow)) return;  // our own echo — ignore
  if(isEditing()){ CLOUD.pending = remote; syncNote('Update waiting — finishing your edit…', 'ok'); return; }
  applyRemote(remote);
}
// 3-way merge so a player's own edits are never lost to an incoming update.
// base = state we last had from the server, local = our current, remote = incoming.
// Any key/character WE changed since base wins locally; everything else takes remote.
function threeWayMerge(base, local, remote){
  const out = JSON.parse(JSON.stringify(remote));
  base = base || {};
  for(const k in local){
    if(k==='chars'){
      const byId = arr => Object.fromEntries((arr||[]).map(ch=>[ch.id, ch]));
      const L=byId(local.chars), B=byId(base.chars);
      out.chars = (out.chars||[]).map(rc => (L[rc.id] && !same(L[rc.id], B[rc.id])) ? L[rc.id] : rc);  // we edited this character
      for(const id in L) if(!out.chars.some(rc=>rc.id===id)) out.chars.push(L[id]);                      // the room lacks it: add ours
    } else if(k==='ship'){   // merge ship one level deep, mirroring the per-subkey pushes
      const L=local.ship||{}, B=base.ship||{};
      out.ship = out.ship || {};
      for(const kk in L) if(!same(L[kk], B[kk])) out.ship[kk] = L[kk];         // we edited this system
      for(const kk in B) if(!(kk in L)) delete out.ship[kk];                   // we emptied this list
    } else if(!same(local[k], base[k])){
      out[k] = local[k];                                                     // we edited this field
    }
  }
  for(const k in base) if(!(k in local) && k!=='chars' && k!=='ship') delete out[k];   // we emptied this list (pruned keys vanish from `local`)
  return out;
}
function applyRemote(remote){
  CLOUD.applying = true;
  const remoteSub = syncSubset(remote);
  // On the very first snapshot adopt the room wholesale; afterwards merge so our
  // own in-flight edits survive an incoming update.
  const merged = (CLOUD.synced && CLOUD.shadow)
    ? threeWayMerge(CLOUD.shadow, syncSubset(S), remoteSub) : remoteSub;
  const localVisible = S.visible;
  const next = migrate(JSON.parse(JSON.stringify(merged)));
  next.visible = localVisible || {};
  for(const c of CHARS) if(next.visible[c.id]===undefined) next.visible[c.id]=true;
  for(const ch of next.chars){   // keep this player's own open panels open across remote updates
    const old = S && S.chars && S.chars.find(x=>x.id===ch.id);
    if(old){ ch.invOpen=old.invOpen; ch.customOpen=old.customOpen; ch.gearOpen=old.gearOpen; ch.armorOpen=old.armorOpen; }
  }
  S = next;
  CLOUD.shadow = remoteSub;                 // server truth is the remote; preserved local diffs re-push below
  CLOUD.synced = true;
  rebuildLog(); render();
  CLOUD.applying = false;
  scheduleSync();                           // push any edits the merge preserved over the remote
  liveLabel();
}

/* ---- room lifecycle ------------------------------------------- */
function detachRoom(){
  if(CLOUD.ref){ CLOUD.ref.off(); CLOUD.ref=null; }
  if(CLOUD.rollsRef){ CLOUD.rollsRef.off(); CLOUD.rollsRef=null; }
  if(CLOUD._conn){ CLOUD._conn.off(); CLOUD._conn=null; }
}
function attachRoom(id){
  if(!CLOUD.db){ syncNote('Live sync unavailable (offline or Firebase blocked).', 'bad'); return; }
  detachRoom();
  CLOUD.shadow = null; CLOUD.synced = false; CLOUD.pending = null;
  CLOUD._conn = CLOUD.db.ref('.info/connected');
  CLOUD._conn.on('value', s=>{ CLOUD.online=!!s.val(); liveLabel(); });
  CLOUD.ref = CLOUD.db.ref('rooms/'+id+'/state');
  CLOUD.ref.on('value', snap=> onRoomSnap(snap.val()),
    err=> syncNote('Live error: '+err.message, 'bad'));
  // dice feed: its own node, appended with push(), so simultaneous rolls never collide
  CLOUD.rollsRef = CLOUD.db.ref('rooms/'+id+'/rolls').limitToLast(FEED_MAX);
  CLOUD.rollsRef.on('value', snap=>{ const list=[]; snap.forEach(ch=>{ list.push(ch.val()); }); setRolls(list); },
    err=> syncNote('Roll feed error: '+err.message, 'bad'));
}
function randomId(){
  const a = new Uint8Array(9);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*256);
  return Array.from(a, b=>b.toString(16).padStart(2,'0')).join('');
}
function roomCreate(){
  if(!CLOUD.db){ syncNote('Live sync unavailable — are you offline?', 'bad'); return; }
  const id = randomId();
  setRoomId(id); attachRoom(id);
  syncNote('Live room created — click 🔗 Copy link and send it to your players.', 'ok');
  logMsg('🔗 Live room created ('+id.slice(0,6)+'…). Everyone with the link edits together in real time.');
}
function roomJoin(id){
  id = (typeof id==='string' ? id : (document.getElementById('roomIn')||{}).value || '').trim();
  const m = id.match(/room=([0-9a-fA-F-]+)/); if(m) id = m[1];      // accept a pasted share link
  if(!id){ syncNote('Enter a room code (or paste the share link) first.', 'bad'); return; }
  if(!CLOUD.db){ syncNote('Live sync unavailable — are you offline?', 'bad'); return; }
  setRoomId(id); attachRoom(id);
  syncNote('Joining room '+id.slice(0,6)+'…');
}
function roomLeave(){
  detachRoom(); setRoomId(null);
  CLOUD.synced = false; CLOUD.shadow = null; CLOUD.pending = null;
  const rin=document.getElementById('roomIn'); if(rin) rin.value='';
  loadLocalRolls();   // the room's roll feed stays with the room
  syncNote('Left the room — back to solo. Your local data is untouched.');
}
async function roomCopyLink(){
  if(!CLOUD.room){ syncNote('Create or join a room first.', 'bad'); return; }
  const url = location.href.split('#')[0] + '#room=' + CLOUD.room;
  try{ await navigator.clipboard.writeText(url); syncNote('Share link copied — send it to your players.', 'ok'); }
  catch(e){ syncNote('Copy failed — the link is in your address bar to copy manually.', 'bad'); }
}

function initCloud(){
  const savedName = lsGet('st_player');
  if(savedName){ setPlayerName(savedName); const el=document.getElementById('playerIn'); if(el) el.value=savedName; }
  try{
    if(typeof firebase!=='undefined' && FIREBASE_CONFIG.apiKey){
      firebase.initializeApp(FIREBASE_CONFIG);
      CLOUD.db = firebase.database();
    }
  }catch(e){ CLOUD.db=null; syncNote('Live sync unavailable: '+e.message, 'bad'); }
  // apply a remote update that was deferred while a field had focus — but never mid-press,
  // or the re-render would swap the button out from under the click
  const flushPending = () => { if(CLOUD.pending && !isEditing() && !CLOUD.pointerDown){ const r=CLOUD.pending; CLOUD.pending=null; applyRemote(r); } };
  document.addEventListener('pointerdown', ()=>{ CLOUD.pointerDown=true; }, true);
  document.addEventListener('pointerup',   ()=>{ CLOUD.pointerDown=false; setTimeout(flushPending, 0); }, true);  // runs after the click dispatches
  document.addEventListener('focusout', ()=> setTimeout(flushPending, 60));
  // safety net: every 2s, diff local state against the room and push anything that
  // slipped through (a mutation whose handler forgot to trigger a sync). pushLocal
  // is a no-op when nothing changed, so this is cheap and writes nothing when idle.
  setInterval(()=>{ if(CLOUD.db && CLOUD.room && CLOUD.synced && !CLOUD.applying) pushLocal(); }, 2000);
  // if the page is already open and the room in the URL changes (e.g. someone
  // clicks a link to a different room), switch rooms live instead of ignoring it
  window.addEventListener('hashchange', ()=>{
    const hm = (location.hash||'').match(/room=([0-9a-fA-F-]+)/);
    const hid = hm ? hm[1] : '';
    if(hid && hid!==CLOUD.room && CLOUD.db){ setRoomId(hid); attachRoom(hid); syncNote('Switched to room '+hid.slice(0,6)+'…'); }
  });
  // auto-join from the URL hash, else the last room used on this device
  const m = (location.hash||'').match(/room=([0-9a-fA-F-]+)/);
  const id = m ? m[1] : (lsGet('st_room') || '');
  if(id && CLOUD.db){ setRoomId(id); attachRoom(id); }
  else liveLabel();
}

/* ================================================================
   INIT
   ================================================================ */
function init(){
  const restored = loadLocalState();
  S = restored || freshState();
  document.getElementById('envSel').innerHTML =
    Object.entries(ENVS).map(([k,e])=>`<option value="${k}">${e.label}</option>`).join('');
  document.getElementById('partyAct').innerHTML = `<option value="">activity…</option>` +
    Object.entries(ACTS).map(([k,a])=>`<option value="${k}">${a.label}</option>`).join('');
  document.getElementById('partyCond').innerHTML = `<option value="">condition…</option>` +
    Object.entries(CONDS).map(([k,d])=>`<option value="${k}" title="${condTitle(d)}">${d.label}${d.droid?' (droids)':''}</option>`).join('');
  buildRules();
  loadLocalRolls();
  if(restored) logMsg(`💾 Session restored on this device — ${clockStr()}. 🆕 New starts over at Day 1.`);
  else logMsg('Tracker ready — Day 1, 00:00. All needs at 0, canteens full, droid packs charged. May the Force sustain you.');
  render();
  probeScene(render);   // load img/scene.* if present, then re-render the banner
  initCloud();
}
init();
</script>
