function moralityHtml(cs){
  const sh = cs.sheet, id = cs.id, band = moralBand(sh), sum = k => sh[k].reduce((a,x)=>a+x.v, 0);
  return `<details class="sfold crate" ${SHEET_UI.open.mor?'open':''} ontoggle="sheetOpen('mor',this.open)">
    <summary>⚖ <b>Morality, Obligation &amp; Duty</b> <span class="sub">· Morality ${sh.mor} · Conflict ${sh.conf} · Obligation ${sum('obl')} · Duty ${sum('duty')}</span></summary>
    <div class="sboxes">
      <div class="sbox" title="Morality runs 0–100 and starts at 50. Below 30 you become a dark side Force user and stay one until you climb above 70. Above 70 you are a light side paragon.">Morality<div class="vals"><input type="number" min="0" max="100" value="${sh.mor}" onchange="sheetSet('${id}','mor',this.value)"></div><small style="color:${band.color}">${band.name}</small></div>
      <div class="sbox" title="Conflict earned this session: using dark side results, and acts of cruelty, fear, anger or selfishness (the GM awards 1–10+). At the end of the session roll 1d10 and subtract Conflict; the result is added to Morality.">Conflict<div class="vals"><button class="mini" onclick="sheetAdj('${id}','conf',-1)">−</button> <input type="number" min="0" max="99" value="${sh.conf}" onchange="sheetSet('${id}','conf',this.value)"> <button class="mini" onclick="sheetAdj('${id}','conf',1)">＋</button></div><small>this session</small></div>
      <div class="sbox" title="End of session: roll 1d10, subtract this session's Conflict, add the result to Morality, and reset Conflict to 0. Use ×2 if the GM triggered this character's Morality and they engaged with it.">End of session<div class="vals"><button class="mini atk" onclick="conflictResolve('${id}')">🎲 resolve Conflict</button> <button class="mini" onclick="conflictResolve('${id}',true)">×2</button></div><small>1d10 − Conflict</small></div>
    </div>
    <div class="tinfo" style="color:${band.color}">${band.fx}. <span style="color:var(--dim)">Threshold changes are not applied automatically.</span></div>
    ${moralPickHtml(cs)}
    <div class="geartables" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      ${tallyHtml(cs,'obl')}

}

/* ================================================================
   CHARACTER CREATOR — a walkthrough on the sheet that fills it in
   step by step (Force and Destiny core rules; species and careers come from
   rules.js). Progress lives in cs.sheet.cc so it syncs and survives a reload:
     cc = { step, bonus, sp species, wtB / stB threshold bases, car career,
            spec treeId, fp / fc / fs free-rank picks (species / career / spec) }
   Every step writes straight to the normal sheet fields, so the player can
   also edit anything by hand at any point.
   ================================================================ */
const CC_STEPS = ['Concept','Morality','Obligation & Duty','Species','Career','Specialization','Spend XP','Finish'];
const CC_BONUS = {   // Step 2: one starting Morality option
  '':      { label:'none yet',               xp:0,  cr:0,    mor:50 },
  xp:      { label:'+10 starting XP',        xp:10, cr:0,    mor:50 },
  cr:      { label:'+2,500 credits',         xp:0,  cr:2500, mor:50 },
  both:    { label:'+5 XP and +1,000 credits', xp:5, cr:1000, mor:50 },
  mor29:   { label:'start at Morality 29 (dark side)',  xp:0, cr:0, mor:29 },
  mor71:   { label:'start at Morality 71 (light side paragon)', xp:0, cr:0, mor:71 },
};
const CC_START_CREDITS = 500, CC_ATTR_MAX = 5, CC_SKILL_MAX = 2;
const ccSpecies = cs => RULES_DB.species.find(x=>x.n===(cs.sheet.cc||{}).sp) || null;
const ccCareer  = cs => RULES_DB.careers.find(x=>x.n===(cs.sheet.cc||{}).car) || null;
const skName = k => (SKILLS.find(x=>x.k===k)||{n:k}).n;
function skBump(sh, key, d){ const o = sh.sk[key] || (sh.sk[key] = {}); const r = clamp((+o.r||0)+d, 0, SKILL_RANK_MAX); if(r) o.r = r; else delete o.r; if(!Object.keys(o).length) delete sh.sk[key]; }
function skCareer(sh, key, on){ const o = sh.sk[key] || (sh.sk[key] = {}); if(on) o.c = 1; else delete o.c; if(!Object.keys(o).length) delete sh.sk[key]; }
function ccStart(id){ const sh = st(id).sheet; sh.cc = { step:1, bonus:'', fp:{}, fc:{}, fs:{} }; render(); }
function ccEnd(id){ delete st(id).sheet.cc; render(); }
function ccStep(id, n){ const cc = st(id).sheet.cc; if(cc){ cc.step = clamp(n, 1, CC_STEPS.length); render(); } }
function ccBlank(id){   // wipe what creation fills in, keeping the walkthrough open
  const cs = st(id), sh = cs.sheet, step = (sh.cc||{}).step || 1;
  Object.assign(sh, { species:'', career:'', specs:'', morS:'', morW:'', mor:50, conf:0, dark:0, xp:0, xpTotal:0, fr:0, sk:{}, tr:{} });
  if(cs.force!==undefined) cs.force = 0;
  sh.cc = { step, bonus:'', fp:{}, fc:{}, fs:{} }; render();
}
function ccBonus(id, v){
  const sh = st(id).sheet, cc = sh.cc; if(!cc || !CC_BONUS[v]) return;
  const was = CC_BONUS[cc.bonus||''], now = CC_BONUS[v];
  sh.xp = Math.max(0, sh.xp + now.xp - was.xp); sh.xpTotal = Math.max(0, sh.xpTotal + now.xp - was.xp);
  sh.mor = now.mor; sh.dark = 0; moralSync(sh); cc.bonus = v; render();
}
function ccUnpick(sh, group){ const cc = sh.cc; for(const k in cc[group]) skBump(sh, k, -1); cc[group] = {}; }
function ccPickLimit(cs, group){
  const sp = ccSpecies(cs), car = ccCareer(cs);
  if(group==='fp') return sp && sp.free ? sp.free.n : 0;
  if(group==='fc') return car ? Math.min(car.skills.length, (sp && sp.careerFree) || car.free) : 0;   // droids pick six career ranks
  return (sp && sp.specFree) || 2;                                                                // and three specialization ranks
}
function ccPick(id, group, key){   // toggle one free skill rank
  const cs = st(id), sh = cs.sheet, cc = sh.cc; if(!cc || !SKILLS.some(x=>x.k===key)) return false;
  if(cc[group][key]){ delete cc[group][key]; skBump(sh, key, -1); render(); return true; }
  if(Object.keys(cc[group]).length >= ccPickLimit(cs, group) || (+(sh.sk[key]||{}).r||0) >= CC_SKILL_MAX) return false;
  cc[group][key] = 1; skBump(sh, key, 1); render(); return true;
}
function ccSetSpecies(id, name){
  const cs = st(id), sh = cs.sheet, cc = sh.cc, sp = RULES_DB.species.find(x=>x.n===name); if(!cc || !sp) return;
  ccUnpick(sh, 'fp');
  cs.attr = Object.assign({}, sp.attr); cs.encThresh = cs.attr.br + 5;
  cs.wt = sp.wt + sp.attr.br; cs.st = sp.st + sp.attr.wil;
  sh.species = sp.n; sh.xp = sh.xpTotal = sp.xp + CC_BONUS[cc.bonus||''].xp;
  sh.soakMod -= (+cc.spSoak||0); cc.spSoak = sp.soak||0; sh.soakMod += cc.spSoak;   // a species' built-in Enduring (droids)
  Object.assign(cc, { sp:sp.n, wtB:sp.wt, stB:sp.st });
  sh.sil = sp.sil===undefined ? 1 : sp.sil;
  const f = sp.free;
  if(f && Array.isArray(f.of) && f.of.length===f.n) for(const n of f.of){ const k = skillKeyByName(n); if(k){ cc.fp[k] = 1; skBump(sh, k, 1); } }

}
function ccSetCareer(id, name){
  const cs = st(id), sh = cs.sheet, cc = sh.cc, car = RULES_DB.careers.find(x=>x.n===name); if(!cc || !car) return;
  const old = ccCareer(cs), keep = new Set(ownedSpecs(cs).flatMap(t=>TREE_BY[t].skills.map(skillKeyByName)));
  ccUnpick(sh, 'fc');
  if(old) for(const n of old.skills){ const k = skillKeyByName(n); if(k && !keep.has(k)) skCareer(sh, k, false); }
  for(const n of car.skills){ const k = skillKeyByName(n); if(k) skCareer(sh, k, true); }
  if(old && old.fr && !car.fr && sh.fr <= old.fr){ sh.fr = 0; if(cs.force) cs.force = 0; }   // leaving a Force career for one without the Force
  sh.career = car.n; cc.car = car.n; if(car.fr && sh.fr < car.fr) sh.fr = car.fr;

}
function ccSetSpec(id, tid){

  ccUnpick(sh, 'fs');
  if(cc.spec && treeOwned(cs, cc.spec)){
    const car = ccCareer(cs), keep = new Set(car ? car.skills.map(skillKeyByName) : []), was = TREE_BY[cc.spec];
    specRemove(id, cc.spec);

}
function ccOther(id, k, v){   // a species or career that is not in the vault: just the name; the numbers are set by hand

  if(k==='species'){ ccUnpick(sh, 'fp'); sh.soakMod -= (+cc.spSoak||0); delete cc.spSoak; delete cc.sp; delete cc.wtB; delete cc.stB; sh.species = v; }

/* ---- builds: one character's sheet as a file. A build is everything the Character Creator and the
   Talents tab set — name, bio, species, career, characteristics, thresholds, skills, trees, Morality,
   Obligation, Duty, XP — and NOT the inventory, credits, needs, wounds or strain. Importing one
   replaces that character's sheet and leaves their items exactly as they are. */
function buildExport(id){
  const cs = st(id), sheet = JSON.parse(JSON.stringify(cs.sheet));
  delete sheet.credits; delete sheet.cc; delete sheet.cmd;   // orders and authorized users are live state, not part of a build
  return { kind:'st-build', v:1, name:cfg(id).name, droid:!!cfg(id).droid, attr:{...cs.attr}, wt:cs.wt, st:cs.st, sheet };
}
function buildApply(id, b){
  const cs = st(id), c = cfg(id);
  if(!cs || !b || b.kind!=='st-build' || !b.sheet || typeof b.sheet!=='object' || !b.attr) return 'That file is not a character build.';
  if(!!b.droid !== !!c.droid) return `That build is for ${b.droid?'a droid':'an organic character'} and ${c.name} is not.`;
  const credits = cs.sheet.credits, cmd = cs.sheet.cmd, sheet = JSON.parse(JSON.stringify(b.sheet));
  delete sheet.cc; delete sheet.cmd; sheet.credits = credits; if(cmd) sheet.cmd = cmd;
  for(const [k] of ATTRS) cs.attr[k] = clamp(Math.round(+b.attr[k])||1, 1, 7);
  cs.encThresh = cs.attr.br + 5;
  if(Number.isFinite(+b.wt)) cs.wt = clamp(Math.round(+b.wt), 0, 99);
  if(Number.isFinite(+b.st)) cs.st = clamp(Math.round(+b.st), 0, 99);
  cs.sheet = sheet; normSheet(cs, c);
  if(cs.force!==undefined && cs.force > forceCap(cs)) cs.force = forceCap(cs);
  logMsg(`👤 ${c.name}'s sheet was replaced by an imported build${b.name && b.name!==c.name ? ` (“${cleanName(b.name)}”)` : ''}. Inventory and credits unchanged.`);
  render(); return '';
}
function buildDownload(id){
  const blob = new Blob([JSON.stringify(buildExport(id), null, 1)], {type:'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `build_${cfg(id).name.replace(/[^A-Za-z0-9]+/g,'_')}.json`; a.click();
}
function buildUpload(id, inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => { let err; try{ const b = JSON.parse(e.target.result);
      if(!confirm(`Replace ${cfg(id).name}'s sheet with this build${b && b.name ? ` (“${b.name}”)` : ''}? Skills, talents, XP, bio and Morality are overwritten. Inventory and credits are kept.`)) return;
      err = buildApply(id, b); }catch(x){ err = 'That file could not be read.'; }
    if(err) alert(err); };
  r.readAsText(f); inp.value = '';
}
function ccAttr(id, k, d){   // creation is the only time XP buys a characteristic: 10 × the new rating, 5 at most
  const cs = st(id), sh = cs.sheet, sp = ccSpecies(cs), cur = cs.attr[k], floor = sp ? sp.attr[k] : 1;

}

/* ================================================================
   DICE — FFG narrative dice, the shared roll feed and the Destiny pool.
   Rolls are NOT part of S: each one is appended to rooms/<id>/rolls with
   push(), so two players rolling in the same instant can never overwrite
   each other (the event log's last-write-wins limit doesn't apply here).
   Solo, the feed lives in this device's localStorage instead.
   The Destiny pool IS part of S (S.destiny) and syncs like everything else.
   Face codes: s success · f failure · a advantage · t threat ·
               x triumph (also a success) · y despair (also a failure) ·
               l light side point · n dark side point
   ================================================================ */
const DICE = {
  b:{ name:'Boost',       cls:'d6',  faces:['','','s','sa','aa','a'],
      tip:'Boost (blue d6) — add for a helpful edge: good position, aid from an ally, the right tool, time to aim.' },
  k:{ name:'Setback',     cls:'d6',  faces:['','','f','f','t','t'],
      tip:'Setback (black d6) — add for a minor hindrance: poor light, cover, noise, bad footing, a defense rating.' },
  a:{ name:'Ability',     cls:'d8',  faces:['','s','s','ss','a','a','sa','aa'],
      tip:'Ability (green d8) — your raw aptitude. You roll as many as the HIGHER of your characteristic and skill rank, then upgrade some to Proficiency.' },
  d:{ name:'Difficulty',  cls:'d8',  faces:['','f','ff','t','t','t','tt','ft'],
      tip:'Difficulty (purple d8) — how hard the task is: Easy 1, Average 2, Hard 3, Daunting 4, Formidable 5.' },
  p:{ name:'Proficiency', cls:'d12', faces:['','s','s','ss','ss','a','sa','sa','sa','aa','aa','x'],
      tip:'Proficiency (yellow d12) — trained skill. Upgrade as many Ability dice as the LOWER of your characteristic and skill rank. The only die with a Triumph.' },
  c:{ name:'Challenge',   cls:'d12', faces:['','f','f','ff','ff','t','t','ft','ft','tt','tt','y'],
      tip:'Challenge (red d12) — an upgraded Difficulty die: a skilled opponent, an adversary talent, or a Destiny point spent against you. The only die with a Despair.' },
  F:{ name:'Force',       cls:'d12', faces:['n','n','n','n','n','n','nn','l','l','ll','ll','ll'],
      tip:'Force (white d12) — roll one per Force rating you are not committing. Light points fuel the power; using dark points costs strain and Conflict, and flips a Destiny point.' },
};
const DICE_ORDER = ['p','a','b','c','d','k','F'];
const SYM = {
  s:['✸','Success'],   f:['✖','Failure'],
  a:['▲','Advantage'], t:['▼','Threat'],
  x:['✪','Triumph'],   y:['⊗','Despair'],
  l:['○','Light side'],n:['●','Dark side'],
};
const SYM_TIPS = {
  s:'Success — cancels one Failure. At least one left over and the check succeeds; extra successes add damage or shave time.',
  f:'Failure — cancels one Success.',
  a:'Advantage — cancels one Threat. A side benefit whether or not you succeed: recover strain, pass a Boost to an ally, trigger a weapon quality or a critical hit.',
  t:'Threat — cancels one Advantage. A side complication whether or not you succeed: suffer strain, hand the enemy a Boost, lose your footing.',
  x:'Triumph — counts as a Success AND a powerful boon that is never cancelled. Triggers a critical hit or any weapon quality.',
  y:'Despair — counts as a Failure AND a serious complication that is never cancelled. Weapons jam, ammo runs dry.',
  l:'Light side point — spend to fuel a Force power.',
  n:'Dark side point — a light-side user may spend it only by flipping a Destiny point, suffering strain and taking Conflict equal to the points used.',
};
const DIFFS = [['Simple',0],['Easy',1],['Average',2],['Hard',3],['Daunting',4],['Formidable',5]];
const FEED_MAX = 50, POOL_MAX = 12;
const DICE_UI = { pool:{b:0,k:0,a:0,d:0,p:0,c:0,F:0}, label:'', who:'', ch:2, rk:0, weapon:null, repair:null };
let ROLLS = [];   // feed entries, oldest first

const rollInt = n => (typeof crypto!=='undefined' && crypto.getRandomValues)
  ? crypto.getRandomValues(new Uint32Array(1))[0] % n : Math.floor(Math.random()*n);
function rollDice(pool){          // → "p:sa a: d:ft" — one token per die, in display order
  const out = [];
  for(const t of DICE_ORDER) for(let i=0;i<(pool[t]||0);i++) out.push(t+':'+DICE[t].faces[rollInt(DICE[t].faces.length)]);
  return out.join(' ');
}
function parseRoll(str){          // tolerant: anything that isn't a real die face is dropped (remote data)
  return String(str||'').split(' ').map(tok=>tok.split(':'))
    .filter(([t,f])=> DICE[t] && DICE[t].faces.includes(f||'')).map(([t,f])=>[t, f||'']);
}
function tally(dice){
  const n = {s:0,f:0,a:0,t:0,x:0,y:0,l:0,n:0};
  for(const [,face] of dice) for(const ch of face) n[ch]++;
  return { ...n, netS:(n.s+n.x)-(n.f+n.y), netA:n.a-n.t,
           check: dice.some(([t])=>t!=='F'), force: dice.some(([t])=>t==='F') };
}
const faceText = f => f ? [...f].map(ch=>SYM[ch][0]).join('') : '';
const faceTip  = (t,f) => DICE[t].name+': '+(f ? [...f].map(ch=>SYM[ch][1]).join(' + ') : 'blank');
const dieHtml  = (t,f) => `<span class="die ${DICE[t].cls} t-${t}" title="${faceTip(t,f)}">${faceText(f)}</span>`;

/* ---- pool builder ---- */
function poolAdj(t, d){ DICE_UI.pool[t] = clamp(DICE_UI.pool[t]+d, 0, POOL_MAX); renderDice(); }
function poolClear(){ for(const t in DICE_UI.pool) DICE_UI.pool[t]=0; DICE_UI.weapon=null; DICE_UI.repair=null; DICE_UI.tal=null; renderDice(); }
function poolNoWeapon(){ DICE_UI.weapon=null; DICE_UI.repair=null; renderDice(); }
function poolUpgrade(from, to){   // upgrade: turn one base die into its d12; with none left to turn, add a base die
  const p = DICE_UI.pool;
  if(p[from]>0){ p[from]--; p[to] = Math.min(POOL_MAX, p[to]+1); } else p[from] = 1;
  renderDice();
}
function poolDiff(n){ DICE_UI.pool.d = n; DICE_UI.pool.c = 0; renderDice(); }
function poolSkill(){             // characteristic + skill rank → Ability/Proficiency
  const ch = clamp(Math.round(DICE_UI.ch)||0, 0, POOL_MAX), rk = clamp(Math.round(DICE_UI.rk)||0, 0, POOL_MAX);
  DICE_UI.pool.p = Math.min(ch, rk); DICE_UI.pool.a = Math.max(ch, rk) - Math.min(ch, rk);
  renderDice();
}
function poolChar(v){ DICE_UI.ch = v; poolSkill(); }
function diceWhoName(){
  const cs = S.chars.find(x=>x.id===DICE_UI.who);
  return cs ? cfg(cs.id).name : (DICE_UI.who==='gm' ? 'GM' : CLOUD.player);
}
function rollPool(){
  const p = DICE_UI.pool;
  if(!DICE_ORDER.some(t=>p[t]>0)) return;
  const ignored = DICE_UI.tal ? Math.min(p.k, DICE_UI.tal.ign) : 0;   // talents that remove Setback
  const e = { k:'r', who:diceWhoName(), l:(DICE_UI.label||'').trim().slice(0,80), r:rollDice(ignored ? {...p, k:p.k-ignored} : p) };
  const talNote = tdSummary(ignored); if(talNote) e.tal = talNote;
  if(DICE_UI.weapon){
    const {src, note, ...card} = DICE_UI.weapon; e.w = card;
    const it = src && st(src.id) && st(src.id).inv[src.i];   // the attack wears the weapon a little
    if(it && it.name===src.name && isWeapon(it)){ it.wear = clamp((it.wear||0)+WEAR_PER_ATTACK, 0, 100); render(); }
  }
  if(DICE_UI.repair){   // a repair roll: the dice decide how much wear comes off
    const text = applyRepair(DICE_UI.repair.holder, tally(parseRoll(e.r)));
    DICE_UI.repair = null;
    if(text){ e.rep = text.slice(0,300); logMsg('🔧 '+esc(text), 'ld'); render(); }
  }
  postFeed(e);
  renderDice();
}

/* ---- feed (append-only) ---- */
function postFeed(e){
  e.by = CLOUD.player; e.t = clockStr(); e.ts = Date.now();
  if(CLOUD.db && CLOUD.room)      // the room's listener (attachRoom) renders it — fires locally at once, even offline
    CLOUD.db.ref('rooms/'+CLOUD.room+'/rolls').push(e).catch(err=>syncNote('Roll not sent: '+err.message, 'bad'));
  else { ROLLS.push(e); ROLLS = ROLLS.slice(-FEED_MAX); lsSet('st_rolls', JSON.stringify(ROLLS)); renderFeed(); }
}
function setRolls(list){ ROLLS = (list||[]).filter(e=>e && typeof e==='object').slice(-FEED_MAX); renderFeed(); }
function loadLocalRolls(){ try{ setRolls(JSON.parse(lsGet('st_rolls')||'[]')); }catch(e){ setRolls([]); } }
function clearFeed(){
  if(CLOUD.db && CLOUD.room){
    if(!confirm('Clear the roll feed for everyone in the room?')) return;
    CLOUD.db.ref('rooms/'+CLOUD.room+'/rolls').remove().catch(err=>syncNote('Clear failed: '+err.message, 'bad'));
  } else { ROLLS = []; lsSet('st_rolls','[]'); renderFeed(); }
}
function resultHtml(dice){
  const r = tally(dice), parts = [];
  const sym = (k, n, word) => `<span class="sym" title="${esc(SYM_TIPS[k])}">${SYM[k][0]} ${n} ${word}${n===1?'':(word==='Success'?'es':'s')}</span>`;
  let head = '';
  if(r.check){
    head = r.netS>0 ? `<span class="ok">Check succeeded</span> — ` : `<span class="no">Check failed</span> — `;
    parts.push(r.netS>0 ? sym('s', r.netS, 'Success') : r.netS<0 ? sym('f', -r.netS, 'Failure') : `<span class="sym">no net successes</span>`);
    if(r.netA>0) parts.push(sym('a', r.netA, 'Advantage'));
    if(r.netA<0) parts.push(sym('t', -r.netA, 'Threat'));
    if(r.x) parts.push(sym('x', r.x, 'Triumph'));
    if(r.y) parts.push(sym('y', r.y, 'Despair'));
  }
  if(r.force){
    parts.push(`<span class="sym" title="${esc(SYM_TIPS.l)}">${SYM.l[0]} ${r.l} Light</span>`);
    parts.push(`<span class="sym" title="${esc(SYM_TIPS.n)}">${SYM.n[0]} ${r.n} Dark</span>`);
  }
  return head + parts.join('');
}
function weaponCardHtml(w, dice){   // w comes off the wire: coerce and escape everything
  if(!w || typeof w!=='object') return '';
  const r = tally(dice), dam = numOr(w.dam), crit = numOr(w.crit), hit = r.netS>0;
  const critOn = hit && crit>0 && (r.netA>=crit || r.x>0);
  return `<div class="wcard"><b>${esc(String(w.n||'Weapon').slice(0,60))}</b> · ` +
    (hit ? `Damage ${dam} + ${r.netS} = <b>${dam+r.netS}</b> <span style="color:var(--dim)">before soak</span>` : `Damage ${dam} — <span style="color:var(--dim)">missed</span>`) +
    ` · Crit ${crit||'—'}` + (critOn ? ` <span class="crit" title="Enough Advantage (or a Triumph) to inflict a critical injury">critical available</span>` : '') +
    (w.q ? `<span class="q">${esc(String(w.q).slice(0,160))}</span>` : '') + `</div>`;
}
function feedEntryHtml(e){
  const by = esc(String(e.by||'Player').slice(0,40)), t = esc(String(e.t||'').slice(0,40));
  if(e.k==='d'){
    const side = e.side==='light' ? 'light' : 'dark', to = side==='light' ? 'Dark' : 'Light';
    return `<div class="roll dflip ${side==='light'?'dark':'light'}">${side==='light'?'Light':'Dark'} side Destiny point used → flipped to ${to}
      <small>${SYM.l[0]} ${+e.light||0} Light · ${SYM.n[0]} ${+e.dark||0} Dark remaining · ${by} · ${t}</small></div>`;
  }
  if(e.k==='p'){
    return `<div class="roll"><div class="rhead"><b>${esc(String(e.h||'Destiny pool').slice(0,40))}</b><span>${by} · ${t}</span></div>
      <div class="rres">${esc(String(e.m||'').slice(0,160))}</div></div>`;
  }
  const dice = parseRoll(e.r); if(!dice.length) return '';
  const who = esc(String(e.who||e.by||'Player').slice(0,40)), label = esc(String(e.l||'').slice(0,80));
  return `<div class="roll"><div class="rhead"><span><b>${who}</b>${label?` — ${label}`:''}</span><span>${who===by?'':by+' · '}${t}</span></div>
    ${weaponCardHtml(e.w, dice)}${e.rep ? `<div class="wcard" style="border-color:#1d4a4e;background:#0f1a1c">🔧 ${esc(String(e.rep).slice(0,300))}</div>` : ''}${e.tal ? `<div class="rtal">✦ ${esc(String(e.tal).slice(0,240))}</div>` : ''}<div class="rdice">${dice.map(([d,f])=>dieHtml(d,f)).join('')}</div>
    <div class="rres">${resultHtml(dice)}</div></div>`;
}
function renderFeed(){
  const el = document.getElementById('diceFeed'); if(!el) return;
  el.innerHTML = ROLLS.length ? ROLLS.slice().reverse().map(feedEntryHtml).join('')
    : `<p style="color:var(--dim);font-size:12px">No rolls yet. Build a pool on the left and roll.</p>`;
  const m = document.getElementById('feedMode');
  if(m) m.textContent = CLOUD.room ? '· shared with the room' : '· this device only (join a live room to share)';
}

/* ---- destiny pool ---- */
function destinyUse(side){        // players spend Light (→ Dark); the GM spends Dark (→ Light)
  const d = S.destiny, other = side==='light' ? 'dark' : 'light';
  if(d[side] < 1) return;
  d[side]--; d[other]++;
  postFeed({ k:'d', side, light:d.light, dark:d.dark });
  render();
}
function destinyAdj(side, n){ S.destiny[side] = clamp(S.destiny[side]+n, 0, 20); render(); }
function destinyRoll(){           // session start: every player rolls one Force die into the pool
  const face = DICE.F.faces[rollInt(12)], l = (face.match(/l/g)||[]).length, n = face.length - l;
  S.destiny.light = clamp(S.destiny.light+l, 0, 20); S.destiny.dark = clamp(S.destiny.dark+n, 0, 20);
  postFeed({ k:'p', m:`${diceWhoName()} rolled ${faceText(face)} — adds ${l?l+' Light':n+' Dark'}. Pool: ${S.destiny.light} Light, ${S.destiny.dark} Dark.` });
  render();
}
function destinyReset(){ S.destiny = {light:0, dark:0}; postFeed({ k:'p', m:'Destiny pool emptied.' }); render(); }
function renderDestiny(){
  const d = S.destiny;
  const chip = document.getElementById('destinyChip');
  if(chip) chip.innerHTML = `<span class="label" title="The Destiny pool. Players spend a Light point to upgrade an Ability die (or an enemy's Difficulty), trigger certain talents, or nudge the story — it flips to Dark. The GM spends Dark the same way and it flips to Light. One point per side per check.">Destiny</span>
    <button class="dpt light" ${d.light?'':'disabled'} onclick="destinyUse('light')" title="Players: spend a Light side point (it flips to Dark)">${SYM.l[0]} ${d.light} Light</button>
    <button class="dpt dark" ${d.dark?'':'disabled'} onclick="destinyUse('dark')" title="GM: spend a Dark side point (it flips to Light)">${SYM.n[0]} ${d.dark} Dark</button>`;
  const box = document.getElementById('destinyBox');
  if(box) box.innerHTML = `<div class="drow">
      <span class="label">Light</span><button class="mini" onclick="destinyAdj('light',-1)">−</button><b>${d.light}</b><button class="mini" onclick="destinyAdj('light',1)">+</button>
      <span class="label" style="margin-left:10px">Dark</span><button class="mini" onclick="destinyAdj('dark',-1)">−</button><b>${d.dark}</b><button class="mini" onclick="destinyAdj('dark',1)">+</button>
    </div>
    <div class="drow">
      <button onclick="destinyRoll()" title="At the start of a session each player rolls one Force die; every light or dark point rolled is added to the pool">🎲 Roll a Force die into the pool</button>
      <button class="mini" onclick="if(confirm('Empty the Destiny pool?'))destinyReset()" title="Empty the pool — do this before the start-of-session rolls">empty</button>
    </div>
    <div class="dlegend">Spend points with the Light / Dark buttons at the top right of any tab — they stay visible all session.</div>`;
}

/* ---- dice tab ---- */
function renderDice(){
  const who = document.getElementById('diceWho'); if(!who) return;
  const me = CLOUD.player==='Player' ? 'Me' : CLOUD.player;
  who.innerHTML = `<option value="">${esc(me)}</option><option value="gm">GM</option>` +
    S.chars.map(cs=>`<option value="${cs.id}">${esc(cfg(cs.id).name)}</option>`).join('');

  const cells = DICE_ORDER.map(t=>`<div class="diecell" title="${esc(DICE[t].tip)}">
      <button class="die ${DICE[t].cls} t-${t}" onclick="poolAdj('${t}',1)" aria-label="Add a ${DICE[t].name} die">+</button>
      <span class="cnt ${p[t]?'':'zero'}">${p[t]}</span>
      <button class="mini" onclick="poolAdj('${t}',-1)" aria-label="Remove a ${DICE[t].name} die">−</button>

  const attrBtns = cs ? `<div class="drow"><span class="label">${esc(cfg(cs.id).name)}</span>` +

  document.getElementById('dicePool').innerHTML = `
    ${attrBtns}
    <div class="drow" title="Skill check: roll Ability dice equal to the HIGHER of characteristic and skill rank, then upgrade as many as the LOWER to Proficiency.">
      <span class="label">Characteristic</span><input type="number" min="0" max="${POOL_MAX}" value="${DICE_UI.ch}" onchange="DICE_UI.ch=+this.value;poolSkill()">
      <span class="label">Skill rank</span><input type="number" min="0" max="${POOL_MAX}" value="${DICE_UI.rk}" onchange="DICE_UI.rk=+this.value;poolSkill()">
      <button class="mini" onclick="poolSkill()">set dice</button>
    </div>
    <div class="drow"><span class="label">Difficulty</span>` +
      DIFFS.map(([n,v])=>`<button class="mini" onclick="poolDiff(${v})" title="${n}: ${v} Difficulty ${v===1?'die':'dice'}">${n}</button>`).join('') + `</div>
    <div class="diecells">${cells}</div>
    <div class="drow">
      <button class="mini" onclick="poolUpgrade('a','p')" title="Upgrade the roll: one Ability die becomes Proficiency (if none are left, add an Ability die). Used when you spend a Destiny point or a talent says 'upgrade'.">⬆ upgrade ability</button>
      <button class="mini" onclick="poolUpgrade('d','c')" title="Upgrade the difficulty: one Difficulty die becomes Challenge (if none are left, add a Difficulty die). Used for adversaries, Dodge, or a Destiny point spent against the roller.">⬆ upgrade difficulty</button>
      <button class="mini" onclick="poolClear()">clear</button>
    </div>
    ${DICE_UI.weapon ? `<div class="wchip"><span>⚔ Attacking with <b>${esc(DICE_UI.weapon.n)}</b> — damage ${DICE_UI.weapon.dam}, crit ${DICE_UI.weapon.crit||'—'}, ${esc(DICE_UI.weapon.rng||'')}. Ranged difficulty: Short Easy · Medium Average · Long Hard · Extreme Daunting.${DICE_UI.weapon.note ? ` <b style="color:var(--warn)">${esc(DICE_UI.weapon.note)}.</b>` : ''}</span><button class="mini" onclick="poolNoWeapon()" title="Roll without the weapon card">✕</button></div>` : ''}
    ${DICE_UI.repair ? `<div class="wchip" style="border-color:#1d4a4e;background:#0f1a1c"><span>🔧 ${esc(DICE_UI.repair.note)}</span><button class="mini" onclick="poolNoWeapon()" title="Roll without applying it to the repair">✕</button></div>` : ''}
    ${DICE_UI.tal ? (()=>{ const T = DICE_UI.tal, ig = Math.min(p.k, T.ign);
      return `<div class="talbox"><b>✦ Talents</b>${T.notes.length ? ` <span>${T.notes.map(esc).join(' · ')}</span>` : ''}${T.ign ? ` <span class="${ig?'hit':''}">${ig ? `${ig} of ${p.k} Setback will be ignored` : `up to ${T.ign} Setback will be ignored when added`}</span>` : ''}
        ${T.opts.map(o=>`<label title="${esc(o.c)}"><input type="checkbox" ${T.on[o.id]?'checked':''} onchange="tdToggle('${esc(o.id).replace(/'/g,"\\'")}',this.checked)"> <b>${esc(o.n)}</b>: ${o.t==='b'?`+${o.amt} Boost`:o.t==='k'?`ignore ${o.amt} Setback`:o.t==='up'?`upgrade ${o.amt}×`:o.t==='dn'?`downgrade difficulty ${o.amt}×`:`${o.amt} fewer Difficulty`} <i>— ${esc(o.c)}</i></label>`).join('')}</div>`; })() : ''}
    <div class="poolprev">${total ? DICE_ORDER.map(t=>`<span class="die ${DICE[t].cls} t-${t}" title="${DICE[t].name}"></span>`.repeat(p[t])).join('') : 'Empty pool — click the dice above to add them.'}</div>

  const lg = document.getElementById('diceLegend');

/* ================================================================
   SAVE / LOAD
   ================================================================ */
function exportState(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `survival_day${dayNow()+1}.json`;
  a.click();
}
function importState(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => { try{ S = migrate(JSON.parse(e.target.result)); rebuildLog(); render(); }catch(err){ alert('Invalid save file.'); } };
  r.readAsText(f);
  inp.value='';
}

/* ================================================================
   OBJECTIVES — a video-game quest menu for the session, between the clock
   and the scene image. Three columns (main objectives, side quests, threats
   & mysteries); each objective has tickable sub-tasks; one objective can be
   pinned so it shows on the collapsed line. This is the LIVE list for play:
   the Lore vault's Quest Log stays the record, and "from Lore" seeds an
   objective from a quest there (title, link, and any checklist on its page).
   S.obj[] = { id, cat main|side|threat, t title, st active|done|failed, pin 1,
               lore noteId, subs[] { id, t, d 1 } }
   Every change is written to the event log with who made it.
   ================================================================ */
const OBJ_CATS = { main:['Main objectives','🎯'], side:['Side quests','🧭'], threat:['Threats & mysteries','⚠'] };
const OBJ_UI = { open:false, lorePick:'' };
try{ OBJ_UI.open = localStorage.getItem('st_obj_open')==='1'; }catch(e){}
function normObjectives(list){
  list = arrayify(list); if(!Array.isArray(list)) return [];
  return list.filter(o=>o && typeof o==='object' && o.id).map(o=>{
    let subs = arrayify(o.subs); if(!Array.isArray(subs)) subs = [];
    const out = { id:String(o.id), cat:OBJ_CATS[o.cat] ? o.cat : 'main', t:String(o.t||'Objective').slice(0,120), st:['active','done','failed'].includes(o.st) ? o.st : 'active',
      subs:subs.filter(x=>x && typeof x==='object' && x.id).map(x=>{ const y = { id:String(x.id), t:String(x.t||'').slice(0,160) }; if(x.d) y.d = 1; return y; }) };
    if(o.pin) out.pin = 1; if(o.lore) out.lore = String(o.lore);
    return out;
  });
}
const objWho = () => CLOUD.player && CLOUD.player!=='Player' ? ` <span style="color:var(--dim)">(${esc(CLOUD.player)})</span>` : '';
const objFind = id => S.obj.find(o=>o.id===id);
const objProgress = o => [o.subs.filter(x=>x.d).length, o.subs.length];
function objToggle(){ OBJ_UI.open = !OBJ_UI.open; try{ localStorage.setItem('st_obj_open', OBJ_UI.open?'1':'0'); }catch(e){} renderObjectives(); }
function objAdd(cat, title, lore, subs){
  title = String(title||'').trim().slice(0,120); if(!OBJ_CATS[cat] || !title) return null;
  const o = { id:randomId().slice(0,8), cat, t:title, st:'active', subs:(subs||[]).map(t=>({ id:randomId().slice(0,6), t:String(t).slice(0,160) })) };
  if(lore) o.lore = lore;
  if(!S.obj.some(x=>x.pin && x.st==='active') && cat==='main') o.pin = 1;   // the first main objective is tracked by default
  S.obj.push(o);
  logMsg(`${OBJ_CATS[cat][1]} New ${cat==='main'?'main objective':cat==='side'?'side quest':'threat or mystery'}: <b>${esc(title)}</b>${o.subs.length?` — ${o.subs.length} step${o.subs.length===1?'':'s'}`:''}.${objWho()}`, 'ld');
  render(); return o;
}
function objAddForm(cat){ const el = document.getElementById('objNew_'+cat); if(el && objAdd(cat, el.value)) el.value = ''; }
function objRename(id){ const o = objFind(id); if(!o) return; const t = prompt('Rename this objective:', o.t); if(t && t.trim()){ o.t = t.trim().slice(0,120); render(); } }
function objSet(id, st){
  const o = objFind(id); if(!o || o.st===st) return;
  o.st = st; if(st!=='active') delete o.pin;
  logMsg(st==='done' ? `✅ Objective complete: <b>${esc(o.t)}</b>.${objWho()}` : st==='failed' ? `❌ Objective failed: <b>${esc(o.t)}</b>.${objWho()}` : `↩ Objective reopened: <b>${esc(o.t)}</b>.${objWho()}`, st==='done'?'lg':st==='failed'?'lb':'ld');
  render();
}
function objDel(id){ const o = objFind(id); if(!o) return; S.obj = S.obj.filter(x=>x.id!==id); logMsg(`🗑 Objective removed: ${esc(o.t)}.${objWho()}`); render(); }
function objPin(id){
  const o = objFind(id); if(!o || o.st!=='active') return;
  const was = o.pin; for(const x of S.obj) delete x.pin;
  if(!was){ o.pin = 1; logMsg(`📌 Now tracking: <b>${esc(o.t)}</b>.${objWho()}`, 'ld'); }
  render();
}
function objSubAdd(id, text){
  const o = objFind(id); text = String(text||'').trim().slice(0,160); if(!o || !text) return false;
  o.subs.push({ id:randomId().slice(0,6), t:text });
  logMsg(`➕ ${esc(o.t)}: new step “${esc(text)}”.${objWho()}`, 'ld'); render(); return true;
}
function objSubForm(id){ const el = document.getElementById('objSub_'+id); if(el && objSubAdd(id, el.value)) el.value = ''; }
function objSubTick(id, sid, on){
  const o = objFind(id), x = o && o.subs.find(y=>y.id===sid); if(!x) return;
  if(on) x.d = 1; else delete x.d;
  const [d, n] = objProgress(o);
  logMsg(on ? `☑ ${esc(o.t)}: “${esc(x.t)}” done (${d} of ${n}).${objWho()}` : `☐ ${esc(o.t)}: “${esc(x.t)}” reopened.${objWho()}`, on?'lg':undefined);
  render();
}
function objSubDel(id, sid){ const o = objFind(id); if(o){ o.subs = o.subs.filter(y=>y.id!==sid); render(); } }
function objClearFinished(cat){ S.obj = S.obj.filter(o=>!(o.cat===cat && o.st!=='active')); render(); }
function objSummary(){   // one log entry to copy into the vault's Inbox after the session
  const line = o => { const [d,n] = objProgress(o); return `${esc(o.t)}${n?` (${d}/${n}${o.subs.filter(x=>!x.d).length?`; next: ${esc(o.subs.find(x=>!x.d).t)}`:''})`:''}`; };
  const part = (label, list) => list.length ? `<br><b>${label}:</b> ${list.map(line).join(' · ')}` : '';
  logMsg(`📋 <b>Objectives summary</b>` + Object.keys(OBJ_CATS).map(c=>part(OBJ_CATS[c][0]+' — active', S.obj.filter(o=>o.cat===c && o.st==='active'))).join('') +
    part('Completed', S.obj.filter(o=>o.st==='done')) + part('Failed', S.obj.filter(o=>o.st==='failed')), 'ld');
}
/* seeding from the Lore vault's Quest Log */
const objLoreKind = n => String(n.fm.kind||'').replace(/<[^>]*>/g,'').toLowerCase();
const objLoreCat = n => { const k = objLoreKind(n); return k==='main' ? 'main' : k==='side' ? 'side' : (k==='threat' || k==='mystery') ? 'threat' : ''; };
function objLoreList(cat){   // quests in the vault that are still open and not on the board yet
  if(!LORE_DB) return [];
  return Object.keys(LORE_DB.notes).filter(id=>{ const n = LORE_DB.notes[id], st = String(n.fm.status||'').replace(/<[^>]*>/g,'').toLowerCase();
    return n.type==='quest' && objLoreCat(n)===cat && !['completed','failed','dropped'].includes(st) && !S.obj.some(o=>o.lore===id); })
    .sort((a,b)=>LORE_DB.notes[a].t.localeCompare(LORE_DB.notes[b].t));
}
function objLorePick(cat){ loreLoad(()=>{ OBJ_UI.lorePick = OBJ_UI.lorePick===cat ? '' : cat; renderObjectives(); }); }
function objAddFromLore(cat, noteId){
  const n = LORE_DB && LORE_DB.notes[noteId]; if(!n) return null;
  const steps = [...n.h.matchAll(/<li>☐ ([\s\S]*?)<\/li>/g)].map(m=>m[1].replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim()).filter(Boolean).slice(0,12);
  OBJ_UI.lorePick = '';
  return objAdd(cat, n.t, noteId, steps);
}
function renderObjectives(){
  const el = document.getElementById('objectives'); if(!el) return;
  const active = S.obj.filter(o=>o.st==='active'), pinned = active.find(o=>o.pin) || active.find(o=>o.cat==='main') || active[0];
  const next = pinned && pinned.subs.find(x=>!x.d), [pd, pn] = pinned ? objProgress(pinned) : [0,0];
  const track = pinned ? `📌 <b>${esc(pinned.t)}</b>${next ? ` — next: ${esc(next.t)}` : pn ? ' — all steps done' : ''}${pn ? ` <span>(${pd}/${pn})</span>` : ''}` : 'No objectives yet — open this to add one.';
  let body = '';
  if(OBJ_UI.open){
    body = `<div class="ocols">` + Object.keys(OBJ_CATS).map(cat=>{
      const mine = S.obj.filter(o=>o.cat===cat), act = mine.filter(o=>o.st==='active'), fin = mine.filter(o=>o.st!=='active');
      const items = act.map(o=>{ const [d,n] = objProgress(o);
        return `<div class="oitem ${o.pin?'pin':''}">
          <div class="otitle"><span class="n" ondblclick="objRename('${o.id}')" title="Double-click to rename">${esc(o.t)}</span>${n?`<small>${d}/${n}</small>`:''}
            ${o.lore ? `<button class="mini" onclick="showTab('lore');loreLoad(()=>loreGo('${o.lore}'))" title="This quest's page in the Lore tab">📖</button>` : ''}
            <button class="mini" onclick="objPin('${o.id}')" title="${o.pin?'Stop tracking':'Track this objective on the collapsed line'}" style="${o.pin?'border-color:var(--gold);color:var(--gold)':''}">📌</button>
            <button class="mini" onclick="objSet('${o.id}','done')" title="Objective complete">✓</button>
            <button class="mini" onclick="objSet('${o.id}','failed')" title="Objective failed">✗</button>
            <button class="mini" onclick="if(confirm('Remove this objective and its steps?'))objDel('${o.id}')" title="Remove">🗑</button></div>
          ${n ? `<div class="obar"><i style="width:${Math.round(100*d/n)}%"></i></div>` : ''}
          ${o.subs.map(x=>`<label class="osub ${x.d?'done':''}"><input type="checkbox" ${x.d?'checked':''} onchange="objSubTick('${o.id}','${x.id}',this.checked)"><span>${esc(x.t)}</span><a class="x" onclick="event.preventDefault();objSubDel('${o.id}','${x.id}')" title="Remove this step">✕</a></label>`).join('')}
          <div class="oadd"><input type="text" id="objSub_${o.id}" placeholder="add a step…" onkeydown="if(event.key==='Enter')objSubForm('${o.id}')"><button class="mini" onclick="objSubForm('${o.id}')">＋</button></div>
        </div>`; }).join('');
      const lore = OBJ_UI.lorePick===cat ? (()=>{ const ids = objLoreList(cat);
        return ids.length ? `<select style="width:100%;margin-top:4px" onchange="if(this.value)objAddFromLore('${cat}',this.value)"><option value="">choose an open quest from the Lore…</option>${ids.map(id=>`<option value="${id}">${esc(LORE_DB.notes[id].t)}</option>`).join('')}</select>`
          : `<div class="tinfo" style="margin:4px 0 0">Every open ${OBJ_CATS[cat][0].toLowerCase()} entry in the Lore is already here.</div>`; })() : '';
      return `<div class="ocol ${cat}"><h4>${OBJ_CATS[cat][1]} ${OBJ_CATS[cat][0]} <span style="color:var(--dim)">${act.length}</span></h4>
        ${items || `<div class="tinfo" style="margin:0 0 4px">Nothing active.</div>`}
        <div class="oadd" style="margin-top:8px"><input type="text" id="objNew_${cat}" placeholder="new ${cat==='main'?'objective':cat==='side'?'side quest':'threat or mystery'}…" onkeydown="if(event.key==='Enter')objAddForm('${cat}')"><button class="mini atk" onclick="objAddForm('${cat}')">add</button><button class="mini" onclick="objLorePick('${cat}')" title="Start from an open quest in the Lore vault's Quest Log">from Lore</button></div>
        ${lore}
        ${fin.length ? `<details class="ofin"><summary>${fin.length} finished</summary>${fin.map(o=>`<div><span class="${o.st}">${o.st==='done'?'✓':'✗'} ${esc(o.t)}</span> <a style="cursor:pointer" onclick="objSet('${o.id}','active')" title="Reopen">↩</a></div>`).join('')}<button class="mini" onclick="objClearFinished('${cat}')">clear finished</button></details>` : ''}
      </div>`; }).join('') + `</div>
      <div style="margin-top:8px"><button class="mini" onclick="objSummary()" title="Write the state of every objective to the event log — handy to copy into your notes after the session">📋 summary to log</button></div>`;
  }
  el.innerHTML = `<div class="ohead" onclick="objToggle()" title="${OBJ_UI.open?'Collapse':'Open the objectives menu'}"><span class="label">${OBJ_UI.open?'▾':'▸'} 🎯 Objectives</span><span class="otrack">${track}</span><span style="color:var(--dim);font-size:11px;white-space:nowrap">${active.length} active</span></div>${body}`;
}

/* ================================================================
   LORE — the campaign book (lore.js, generated from the Obsidian vault by
   tools/import-lore.py, which is also the privacy filter). Read-only here:
   the vault is where it is written. lore.js is large, so it is only fetched
   the first time the Lore tab is opened.
   ================================================================ */
let LORE_DB = typeof LORE!=='undefined' ? LORE : null, LORE_WAIT = null;
const LORE_UI = { id:'', q:'', hist:[], open:{} };
const LORE_STATUS = { alive:'var(--good)', active:'var(--good)', completed:'#6e7681', dead:'var(--bad)', failed:'var(--bad)', captive:'var(--warn)', missing:'var(--warn)', unknown:'#8b949e', dropped:'#6e7681' };
function loreLoad(cb){
  if(LORE_DB) return cb();
  if(typeof LORE!=='undefined'){ LORE_DB = LORE; return cb(); }
  const page = document.getElementById('lorePage');
  if(LORE_WAIT){ LORE_WAIT.push(cb); return; }
  LORE_WAIT = [cb]; if(page) page.innerHTML = '<p class="lempty">Opening the campaign book…</p>';
  const sc = document.createElement('script'); sc.src = 'lore.js';
  sc.onload = () => { LORE_DB = typeof LORE!=='undefined' ? LORE : null; const w = LORE_WAIT; LORE_WAIT = null; if(LORE_DB) w.forEach(f=>f()); else if(page) page.innerHTML = '<p class="lempty">The campaign book did not load.</p>'; };
  sc.onerror = () => { LORE_WAIT = null; if(page) page.innerHTML = '<p class="lempty">The campaign book did not load (lore.js is missing).</p>'; };
  document.head.appendChild(sc);
}
function loreSet(k, v){ LORE_UI[k] = v; renderLore(true); }
function loreGo(id, noHist){
  if(!LORE_DB || !LORE_DB.notes[id]) return;
  if(!noHist && LORE_UI.id && LORE_UI.id!==id){ LORE_UI.hist.push(LORE_UI.id); if(LORE_UI.hist.length>60) LORE_UI.hist.shift(); }
  LORE_UI.id = id; LORE_UI.open[LORE_DB.notes[id].sec] = true;
  renderLore();
  const page = document.getElementById('lorePage'); if(page && page.scrollIntoView && TAB==='lore') window.scrollTo && window.scrollTo(0, Math.max(0, page.getBoundingClientRect().top + window.scrollY - 70));
}
function loreBack(){ const id = LORE_UI.hist.pop(); if(id) loreGo(id, true); }
function loreHome(){ LORE_UI.q = ''; const q = document.getElementById('loreQ'); if(q) q.value = ''; loreGo(LORE_DB && LORE_DB.home); }
function loreFind(name){   // a note by its title, any case
  const q = normName(name); if(!LORE_DB || !q) return '';
  return Object.keys(LORE_DB.notes).find(id=>normName(LORE_DB.notes[id].t)===q) || '';
}
function loreOpen(charId){   // from a sheet: that character's page (by roster name, then current name)
  showTab('lore');
  loreLoad(()=>{ const c = cfg(charId), id = loreFind(c.name0) || loreFind(c.name);
    if(id) loreGo(id); else { LORE_UI.q = c.name; const q = document.getElementById('loreQ'); if(q) q.value = c.name; renderLore(); } });
}
function loreSearch(q){
  const words = normName(q).split(/\s+/).filter(Boolean), out = [];
  for(const id in LORE_DB.notes){ const n = LORE_DB.notes[id];
    if(n.x===undefined) n.x = (n.t + ' ' + Object.values(n.fm).join(' ') + ' ' + n.h).replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').toLowerCase();
    const title = n.t.toLowerCase();
    if(!words.every(w=>n.x.includes(w))) continue;
    const i = n.x.indexOf(words[0], n.t.length), inTitle = words.every(w=>title.includes(w));
    out.push({ id, score:(inTitle?0:1), snip: inTitle || i<0 ? '' : n.x.slice(Math.max(0,i-40), i+70).trim() });
  }
  return out.sort((a,b)=>a.score-b.score || LORE_DB.notes[a.id].t.localeCompare(LORE_DB.notes[b.id].t));
}
function renderLore(keepPage){
  const nav = document.getElementById('loreNav'); if(!nav || !LORE_DB) return;
  const N = LORE_DB.notes; if(!N[LORE_UI.id]) LORE_UI.id = LORE_DB.home || Object.keys(N)[0];
  const dot = n => { const st = String(n.fm.status||'').replace(/<[^>]*>/g,'').toLowerCase(), col = LORE_STATUS[st]; return col && n.type!=='chapter' && n.type!=='session' ? `<span class="ldot" style="background:${col}" title="${esc(st)}"></span>` : ''; };
  const item = (id, extra) => `<button class="${id===LORE_UI.id?'on':''}" onclick="loreGo('${id}')">${esc(N[id].t)}${dot(N[id])}</button>${extra||''}`;
  const q = LORE_UI.q.trim();
  document.getElementById('loreBackBtn').disabled = !LORE_UI.hist.length;
  if(q){
    const hits = loreSearch(q), shown = hits.slice(0, 80);
    document.getElementById('loreInfo').textContent = `${hits.length} page${hits.length===1?'':'s'} match`;
    nav.innerHTML = shown.map(h=>item(h.id, h.snip ? `<span class="lhit">…${esc(h.snip)}…</span>` : '')).join('') || '<div class="tgroup">nothing matches</div>';
  } else {
    document.getElementById('loreInfo').textContent = `${Object.keys(N).length} pages`;
    nav.innerHTML = LORE_DB.sections.map(sec=>`<details ${LORE_UI.open[sec.n]?'open':''} ontoggle="LORE_UI.open[this.dataset.s]=this.open" data-s="${esc(sec.n)}"><summary>${esc(sec.n)} <span style="color:var(--dim)">${sec.groups.reduce((a,g)=>a+g.ids.length,0)}</span></summary>` +
      sec.groups.map(g=>(g.n ? `<div class="tgroup">${esc(g.n)}</div>` : '') + g.ids.map(id=>item(id)).join('')).join('') + `</details>`).join('');
  }
  if(keepPage) return;
  const n = N[LORE_UI.id], who = S.chars.find(x=>normName(cfg(x.id).name0)===normName(n.t) || normName(cfg(x.id).name)===normName(n.t));
  const label = k => k.replace(/_/g,' ');
  document.getElementById('lorePage').innerHTML = `<div class="lcrumb">${esc([n.sec, n.grp].filter(Boolean).join(' › ') || 'Through Darkness')}</div>
    <h2>${esc(n.t)}${who ? ` <button class="mini" onclick="sheetPick('${who.id}');showTab('sheet')" title="Open this character's sheet">📄 sheet</button>` : ''}</h2>
    ${Object.keys(n.fm).length ? `<div class="lchips">${Object.entries(n.fm).map(([k,v])=>`<span class="lchip"><i>${esc(label(k))}</i>${v}</span>`).join('')}</div>` : ''}
    ${n.h}
    ${n.back && n.back.length ? `<details class="lback" ${n.back.length<=14?'open':''}><summary>Mentioned on ${n.back.length} other page${n.back.length===1?'':'s'}</summary>${n.back.map(id=>N[id] ? `<a class="ll" onclick="loreGo('${id}')">${esc(N[id].t)}</a>` : '').join(' · ')}</details>` : ''}`;
}

/* ================================================================
   CORE RULES — a quick reference for the table, ordered the way a
   session runs, with the GM's start-of-session checklist on top.
   Written for this tracker (wording is our own); the published books
   are the authority. Dice are drawn with the same shapes as the Dice tab:
   D('pa') → proficiency + ability …  codes: p a b(oost) k(setback) d c F
   ================================================================ */
const CORE_DIE = { p:'d12 t-p', a:'d8 t-a', b:'d6 t-b', k:'d6 t-k', d:'d8 t-d', c:'d12 t-c', F:'d12 t-F' };
const D = codes => [...codes].map(ch=>`<span class="die sm ${CORE_DIE[ch]}" title="${DICE[ch].name}"></span>`).join('');
const Y = Object.fromEntries(Object.keys(SYM).map(k=>[k, `<span class="sy" title="${SYM[k][1]}">${SYM[k][0]}</span>`]));
const CT = (head, rows) => `<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const CL = items => `<ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const GM_STEPS = [
  ['recap',   'Recap last session and where everyone is. Check the clock, location and environment on the Tracker tab.'],
  ['xp',      'Hand out any XP still owed from last session (type it into XP on each sheet).'],
  ['destiny', `Build the Destiny pool: empty it, then every player rolls one Force die. <button class="mini" onclick="showTab('dice')">open Dice tab →</button>`],
  ['paragon', 'Adjust the pool: add 1 Light point for each light side paragon (Morality above 70); flip 1 Light to Dark for each dark side Force user.'],
  ['mortrig', `Roll for a triggered Morality (optional). <button class="mini atk" onclick="moralTrigger()">🎲 roll Morality trigger</button>`],
  ['obl',     `Roll the Obligation check, if your table uses it. <button class="mini atk" onclick="tallyRoll('obl')">🎲 roll Obligation</button>`],
  ['duty',    `Roll the Duty check, if your table uses it. <button class="mini atk" onclick="tallyRoll('duty')">🎲 roll Duty</button>`],
  ['thresh',  'Apply session-long threshold changes from those rolls (Obligation: strain threshold down; Duty: wound threshold up) and tell the players.'],
  ['conflict','Confirm every character\'s Conflict is back at 0 from last session.'],
  ['scene',   'Set the opening scene. Decide who is aware of what before anyone rolls.'],
];
const GM_END = [
  ['e_conf', 'Each Force user resolves Conflict: 1d10 − Conflict is added to Morality (×2 if their Morality was triggered and they engaged). Use the button on each sheet.'],
  ['e_xp',   'Award XP: about 5 per hour played is a common pace, plus bonuses for goals, good roleplay and playing to Motivation.'],
  ['e_obl',  'Adjust Obligation and Duty for what happened: debts paid, favours taken, missions completed.'],
  ['e_rest', 'Note recovery owed before next session: a night of rest heals 1 wound and all strain.'],
  ['e_save', 'Save the session (⚙ Session → 💾 Save) so there is a backup.'],
];
let GM_DONE = {}; try{ GM_DONE = JSON.parse(localStorage.getItem('st_gm_check')||'{}') || {}; }catch(e){}
function gmCheck(k, on){ if(on) GM_DONE[k] = 1; else delete GM_DONE[k]; try{ localStorage.setItem('st_gm_check', JSON.stringify(GM_DONE)); }catch(e){} renderCore(true); }
function gmReset(){ GM_DONE = {}; try{ localStorage.setItem('st_gm_check','{}'); }catch(e){} renderCore(true); }
function moralTrigger(forced){   // d100: the character whose Morality is closest has it triggered this session
  const pcs = S.chars.filter(cs=>!cfg(cs.id).droid && S.visible[cs.id]!==false); if(!pcs.length) return null;
  const roll = forced || rollInt(100)+1, best = pcs.reduce((a,b)=>Math.abs(b.sheet.mor-roll) < Math.abs(a.sheet.mor-roll) ? b : a);
  postFeed({ k:'p', h:'Morality trigger', m:`Rolled ${roll}. Closest is ${cfg(best.id).name} (Morality ${best.sheet.mor}): their emotional strength${best.sheet.morS?` (${best.sheet.morS})`:''} and weakness${best.sheet.morW?` (${best.sheet.morW})`:''} are in play this session. If they engage with it, the end-of-session Morality change is doubled.` });
  return best.id;
}
function coreSections(){
  const gm = (list) => `<div class="gmlist">${list.map(([k,t],i)=>`<label class="${GM_DONE[k]?'done':''}"><input type="checkbox" ${GM_DONE[k]?'checked':''} onchange="gmCheck('${k}',this.checked)"><span><b>${i+1}.</b> ${t}</span></label>`).join('')}</div>`;
  return [
  ['start', '1 · Start of session', 'GM checklist', `${gm(GM_STEPS)}<p><button class="mini" onclick="gmReset()">⟲ clear the ticks (both checklists)</button> <span class="tinfo">Ticks are remembered on this device only.</span></p>
    <h4>Destiny points</h4>${CL([`Pool: each player rolls ${D('F')}. Each ${Y.l} adds a Light point, each ${Y.n} a Dark point.`,
      `Players spend Light, the GM spends Dark; a spent point flips to the other side. One per side per check.`,
