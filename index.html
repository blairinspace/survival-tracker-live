<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survival Tracker — FFG Star Wars</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --gold:#e3b341;
    --good:#3fb950; --warn:#d29922; --bad:#f85149; --crit:#ff2e2e; --force:#9d8cff; --droid:#56d4dd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;padding:14px}
  h1{font-size:20px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
  button:hover{border-color:var(--accent)}
  button.primary{background:#1f3a5f;border-color:var(--accent)}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12.5px}
  input[type=number]{width:56px}
  input[type=text]{width:150px}
  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin:12px 0}
  .group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .clock{font-size:16px;color:var(--gold);font-weight:600;min-width:150px}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:12px;opacity:.55}
  .chip.on{opacity:1;background:#1f3a5f;border-color:var(--accent)}
  #ambience{position:relative;display:none;margin:0 0 12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-height:190px}
  #ambience img{width:100%;height:190px;object-fit:cover;display:block}
  #ambience .cap{position:absolute;left:12px;bottom:8px;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000}
  #ambience .cap small{display:block;font-size:11px;font-weight:400;opacity:.85}
  #ambience .rm{position:absolute;top:8px;right:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .card.dead{border-color:var(--crit);box-shadow:0 0 12px rgba(255,46,46,.35)}
  .card.uncon{border-color:var(--warn)}
  .card.droidcard{border-color:#1d4a4e}
  .portrait{position:relative;border-radius:8px;overflow:hidden;margin-bottom:8px;max-height:150px}
  .portrait img{width:100%;height:150px;object-fit:cover;object-position:center 20%;display:block}
  .portrait .hurt{position:absolute;inset:0;background:#e00;pointer-events:none}
  .portrait .rm{position:absolute;top:6px;right:6px;padding:1px 6px;font-size:11px}
  .cardhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .cname{font-size:16px;font-weight:700}
  .cmeta{color:var(--dim);font-size:11px}
  .trait{color:var(--force);font-size:11px;font-style:italic;margin:2px 0 6px}
  .droidcard .trait{color:var(--droid)}
  .attrs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px;padding:6px;background:var(--panel2);border-radius:6px}
  .attrs .a{display:flex;flex-direction:column;align-items:center}
  .attrs .a span{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .attrs .a input{width:38px;text-align:center;padding:2px}
  .needrow{display:flex;align-items:center;gap:5px;margin:5px 0}
  .needlabel{width:56px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;cursor:pointer;flex-shrink:0}
  .needlabel:hover{color:var(--accent)}
  .barwrap{flex:1;height:14px;background:#0a0e14;border:1px solid var(--border);border-radius:7px;overflow:hidden;position:relative;min-width:80px}
  .bar{height:100%;border-radius:7px;transition:width .3s}
  .barval{position:absolute;right:6px;top:0;font-size:10px;line-height:14px;color:#fff;text-shadow:0 0 3px #000}
  .mini{font-size:10.5px;padding:2px 6px}
  .mini.force{border-color:var(--force);color:var(--force)}
  .mini.droid{border-color:var(--droid);color:var(--droid)}
  .gearrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:11.5px}
  .gearrow .gi{display:flex;align-items:center;gap:4px;color:var(--dim)}
  .gearrow input[type=number]{width:48px;padding:2px 4px;font-size:11.5px}
  .gearrow b{color:var(--text)}
  .customform{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0;padding:6px;background:var(--panel2);border:1px dashed var(--border);border-radius:6px}
  .customform input[type=text]{font-size:11.5px;padding:3px 5px}
  .badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;margin:1px 2px 1px 0}
  .b-stim{background:#1f4d2e;color:#7ee2a0}
  .b-enc{background:#5c3a10;color:#ffc266}
  .b-force{background:#2d2554;color:#c3b5ff}
  .b-off{background:#3a1010;color:#ff9c9c}
  .b-status{background:#123a4a;color:#8fd9f2}
  .b-cond{background:#432a10;color:#ffc98a}
  .badge .x{cursor:pointer;margin-left:4px;opacity:.7}
  .badge .x:hover{opacity:1}
  details.inv{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px}
  details.inv summary{cursor:pointer;font-size:11.5px;color:var(--dim);user-select:none}
  details.inv summary b{color:var(--text)}
  .invtable{width:100%;border-collapse:collapse;margin-top:6px;font-size:11.5px}
  .invtable th{color:var(--dim);font-size:10px;text-transform:uppercase;text-align:left;padding:2px 3px}
  .invtable td{padding:2px 3px}
  .invtable input{padding:2px 4px;font-size:11.5px;width:100%}
  .invtable input[type=number]{width:52px}
  .invtable .tot{color:var(--gold);text-align:right;white-space:nowrap}
  .invtable .auto{color:var(--dim);font-style:italic}
  .gearitem{margin-top:8px;padding:6px 8px;background:var(--panel2);border-radius:6px}
  .gearitem:first-child{margin-top:6px}
  .gearline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gearname{font-weight:600;font-size:12.5px}
  .gearitem .needrow{margin:5px 0 4px}
  .gearfx{margin-top:0;background:transparent;padding:0;font-size:11.5px;color:var(--dim)}
  .gearempty{color:var(--dim);font-size:11.5px;padding:5px 2px;line-height:1.45}
  .exwrap{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
  .exbar{height:20px}
  .exbar .barval{line-height:20px;font-size:12px;font-weight:700}
  .tierbadge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .needtier{padding:1px 6px;font-size:9px;letter-spacing:.5px;flex-shrink:0}
  .fx{font-size:12px;color:var(--text);margin-top:6px;line-height:1.45;background:var(--panel2);border-radius:6px;padding:6px 8px}
  .fx .condline{color:#ffc98a}
  .fx.fxstack{background:transparent;padding:0}
  .fxneed{background:var(--panel2);border-radius:6px;padding:6px 8px;margin-bottom:5px;line-height:1.45}
  .fxneed:last-child{margin-bottom:0}
  .fxtier{font-weight:700}
  .fxnone{color:var(--dim);font-style:italic}
  .fxneed.condstack{color:#ffc98a}
  .tallies{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap;font-size:12px}
  .tallies b{font-size:14px}
  .strain b{color:var(--warn)} .wounds b{color:var(--bad)}
  .log{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:14px}
  .log .loghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .log .loghead b{color:var(--text)}
  .log .noteadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .log .noteadd input[type=text]{width:240px;max-width:60vw}
  #logEntries{max-height:260px;overflow-y:auto}
  .log p{font-size:12px;padding:2px 0;border-bottom:1px dotted #21262d;color:var(--dim)}
  .log p b{color:var(--text)}
  .log .lw{color:var(--warn)} .log .lb{color:var(--bad)} .log .lg{color:#7ee2a0} .log .lf{color:var(--force)} .log .ld{color:var(--droid)}
  .log .ln{color:var(--accent);font-style:italic}
  .tabs{display:flex;gap:8px;margin:12px 0}
  .tabs button.on{background:#1f3a5f;border-color:var(--accent)}
  #rules{display:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;line-height:1.6}
  #rules h2{color:var(--gold);font-size:16px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:1px}
  #rules h2:first-child{margin-top:0}
  #rules table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:12.5px}
  #rules th,#rules td{border:1px solid var(--border);padding:5px 8px;text-align:left}
  #rules th{background:var(--panel2);color:var(--accent)}
  #rules p{font-size:13px;color:var(--text);margin:6px 0}
  .dice{font-weight:700}
  .setb{color:#a5a5a5}.chal{color:#f85149}.diff{color:#b57edc}.boost{color:#4fc3f7}
  /* ---- Ship card (Mantis) ---- */
  #ship{display:none}
  .shipwrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .shiphead{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
  .shiphead .stitle{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .shiphead .ssub{color:var(--dim);font-size:12px;margin-top:3px;letter-spacing:.5px}
  .shiphead .sactivity{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .shipportrait{position:relative;border-radius:8px;overflow:hidden;margin-bottom:14px;max-height:220px}
  .shipportrait img{width:100%;height:220px;object-fit:cover;object-position:center;display:block}
  .shipportrait .rm{position:absolute;top:8px;right:8px;padding:1px 6px;font-size:11px}
  .shiphead .stitle .mini{font-size:11px;vertical-align:middle;margin-left:4px}
  .statbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
  .stat .sv{font-size:22px;font-weight:800;color:var(--text)}
  .stat .sl{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
  .shipcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  @media(max-width:640px){.shipcols{grid-template-columns:1fr}}
  .spanel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
  .spanel h3{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .defgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:236px;margin:4px auto 0}
  .defcell{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 2px;min-height:46px}
  .defcell.mid{background:transparent;border:none}
  .defcell .dl{font-size:8.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .defcell input{width:40px;text-align:center;padding:2px;color:var(--force);font-weight:700}
  .shipnav{font-size:26px;text-align:center}
  .fuelpanel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px}
  .fueltank{height:26px;background:#0a0e14;border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
  .fueltank .fbar{height:100%;transition:width .3s}
  .fueltank .fval{position:absolute;left:0;right:0;top:0;line-height:26px;text-align:center;font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 0 4px #000}
  .fuelform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--dim)}
  .fuellog{margin-top:10px;max-height:120px;overflow-y:auto;font-size:11.5px}
  .fuellog p{padding:2px 0;border-bottom:1px dotted #21262d;color:var(--dim)}
  .fuellog p b{color:var(--text)}
  .sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
  .syscard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
  .syscard.off{border-color:var(--crit);box-shadow:0 0 8px rgba(255,46,46,.25)}
  .syscard .sh{display:flex;justify-content:space-between;align-items:center;gap:4px}
  .syscard .sn{font-size:13px;font-weight:700}
  .syscard .saff{font-size:10px;color:var(--dim);margin:3px 0 4px}
  .pips{display:flex;gap:4px;margin:6px 0}
  .pip{flex:1;height:12px;border-radius:3px}
  .enrow{display:flex;align-items:center;gap:5px;margin:5px 0;font-size:11px}
  .enrow .enlbl{color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-size:9.5px;min-width:58px}
  .edots{display:flex;gap:3px;flex:1}
  .edot{width:10px;height:10px;border-radius:50%;background:#0a0e14;box-shadow:inset 0 0 0 1px var(--border)}
  .edot.on{background:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .wmult{font-weight:700;font-size:10.5px;min-width:40px;text-align:right}
  .rangesel{flex:1;font-size:11.5px}
  .boostline{font-size:10.5px;color:var(--gold);background:rgba(227,179,65,.1);border:1px solid rgba(227,179,65,.35);border-radius:5px;padding:3px 6px;margin-top:4px;line-height:1.3}
  .sbonus{font-size:11px;color:var(--good);font-weight:700;margin-left:2px}
  .ocbadge{font-size:9px;color:var(--gold);background:rgba(227,179,65,.12);border:1px solid rgba(227,179,65,.4);border-radius:8px;padding:1px 6px;letter-spacing:.5px}
  .defcell .dv{font-size:18px;font-weight:800;color:var(--force);line-height:1}
  .defcell .bst{display:flex;align-items:center;gap:3px;margin-top:3px;font-size:10px;color:var(--gold)}
  .defcell .bst button{padding:0 5px;font-size:11px}
  .reserve{font-size:11px;color:var(--gold);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:2px 10px;letter-spacing:.5px;vertical-align:middle}
  .smugglebox{margin-top:14px;border:1px dashed var(--force);border-radius:8px;padding:10px 12px;background:rgba(157,140,255,.06)}
  .smugglehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--force);margin-bottom:8px}
  .smugtag{font-size:10px;font-weight:400;color:var(--force);background:rgba(157,140,255,.12);border:1px solid rgba(157,140,255,.4);border-radius:8px;padding:1px 7px;letter-spacing:.5px}
  .syscard .cfx{font-size:10.5px;color:var(--dim);line-height:1.4;margin-top:4px;min-height:30px}
  .sysbtns{display:flex;gap:5px;margin-top:7px}
  .weaptable{width:100%;border-collapse:collapse;font-size:12px}
  .weaptable th{color:var(--dim);font-size:9.5px;text-transform:uppercase;text-align:left;padding:3px 6px;border-bottom:1px solid var(--border)}
  .weaptable td{padding:4px 6px;border-bottom:1px dotted #21262d}
  .weaptable .grp{color:var(--gold);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .crewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .crewrow{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  .crewrow .cr{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;min-width:92px}
  .crewrow input{flex:1;min-width:60px}
  .shipsec{margin-bottom:16px}
  .shipsec>h2{font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:5px}
  .sysline{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:12px}
  .sysline .si{color:var(--dim)}
  .sysline .si b{color:var(--text)}
  @media print{ body{background:#fff;color:#000} #tracker,#ship,.topbar,.tabs,#ambience{display:none!important} #rules{display:block!important;border:none;color:#000} #rules p,#rules td{color:#000} }
</style>
</head>
<body>

<div class="topbar" id="titleBar">
  <div class="group">
    <h1 style="margin:0">Survival Tracker</h1>
    <button onclick="exportState()">💾 Save</button>
    <button onclick="document.getElementById('importFile').click()">📂 Load</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importState(this)">
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">🔗 Live</span>
    <span id="roomState" class="label" style="color:var(--dim)">solo — not shared</span>
  </div>
  <div class="group">
    <span class="label">Room</span>
    <input type="text" id="roomIn" placeholder="room code or link" style="width:170px" onkeydown="if(event.key==='Enter')roomJoin()">
    <button class="mini" onclick="roomJoin()">Join</button>
    <button class="mini" onclick="roomCreate()" title="Start a new shared live room for your table">✨ Create</button>
    <button class="mini" onclick="roomCopyLink()" title="Copy a link that auto-joins this room">🔗 Copy link</button>
    <button class="mini" onclick="roomLeave()" title="Stop live sharing on this device (local data untouched)">Leave</button>
  </div>
  <div class="group">
    <span class="label">You</span>
    <input type="text" id="playerIn" placeholder="your name" style="width:110px" onchange="setPlayerName(this.value)">
  </div>
  <div class="group">
    <span id="syncMsg" class="label" style="color:var(--dim)"></span>
  </div>
</div>

<div class="topbar" id="roomBar" style="justify-content:flex-start">
  <div class="group">
    <span class="label">Show</span>
    <span class="group" id="viewChips"></span>
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">👥 Party</span>
    <select id="partyAct" onchange="partySetAct(this.value);this.value=''" title="Set the activity of every visible character"></select>
    <select id="partyCond" onchange="partyAddCond(this.value);this.value=''" title="Apply a condition to every visible eligible character — hover an option for its effect"></select>
  </div>
</div>

<div class="topbar">
  <div class="group">
    <span class="clock" id="clock"></span>
    <button class="primary" onclick="advance(0.25)">+15 min</button>
    <button class="primary" onclick="advance(0.5)">+30 min</button>
    <button class="primary" onclick="advance(1)">+1 hr</button>
    <input type="number" id="customHrs" min="0.25" step="0.25" max="168" value="12">
    <button onclick="advance(parseFloat(document.getElementById('customHrs').value)||1)">Advance</button>
  </div>
  <div class="group" style="margin-left:auto">
    <span class="label">📍 Location</span>
    <input type="text" id="locIn" placeholder="current location" onchange="S.location=this.value;logMsg('📍 Location: '+this.value);render()">
  </div>
  <div class="group">
    <span class="label">Environment</span>
    <select id="envSel" onchange="setEnv(this.value)"></select>
  </div>
  <div class="group">
    <span class="label">🧭 Travel to</span>
    <input type="text" id="destIn" placeholder="destination" onchange="S.travelDest=this.value;render()">
    <span class="label">in</span>
    <input type="number" id="etaIn" min="0" step="0.25" onchange="S.travelEta=Math.max(0,parseFloat(this.value)||0);render()">
    <span class="label">hrs</span>
    <span id="etaNote" style="font-size:12px;color:var(--gold)"></span>
  </div>
</div>

<div id="ambience">
  <img id="ambImg" alt="scene">
  <span class="cap"><span id="ambCap"></span><small id="ambEnv"></small></span>
</div>

<div class="tabs">
  <button id="tabT" class="on" onclick="showTab('tracker')">Tracker</button>
  <button id="tabS" onclick="showTab('ship')">🚀 Mantis</button>
  <button id="tabR" onclick="showTab('rules')">Rules Reference</button>
</div>

<div id="tracker"><div class="grid" id="cards"></div>
<div class="log" id="log">
  <div class="loghead">
    <b>— Event log —</b>
    <div class="noteadd">
      <input type="text" id="noteIn" placeholder="add a note to the log…" onkeydown="if(event.key==='Enter')addNote()">
      <button class="mini" onclick="addNote()" title="Add this note to the event log at the current game time">📝 add note</button>

const DEGRADABLE = ['Weapon','Gear (worn)'];
function isDegradable(type){ return DEGRADABLE.some(t=>t.toLowerCase()===(type||'').toLowerCase()); }
/* Build a <select> of inventory types; preserves any custom saved value as its own option. */
function typeSelect(val, onchangeExpr, width){
  const v = val||'';
  const known = INV_TYPES.some(t=>t.toLowerCase()===v.toLowerCase());
  const opts = INV_TYPES.map(t=>`<option value="${t}"${t.toLowerCase()===v.toLowerCase()?' selected':''}>${t}</option>`).join('');
  const custom = (v && !known) ? `<option value="${esc(v)}" selected>${esc(v)}</option>` : '';
  const blank = `<option value=""${v?'':' selected'}>—</option>`;
  return `<select style="width:${width||82}px" onchange="${onchangeExpr}">${blank}${opts}${custom}</select>`;
}

function newCharState(c){

        wt:c.id==='alpha'?16:8, st:c.id==='alpha'?14:8 })
    : Object.assign(base, { water:0, hunger:0, hygiene:0, sleep:0, rest:0, wt:12, st:12,

        stimsToday:0, stimDay:0, stimHrs:0, force:0 });
}
function freshState(){
  const s = { hour:0, env:'temperate', ambImg:'', location:'', travelDest:'', travelEta:0,
    visible: Object.fromEntries(CHARS.map(c=>[c.id,true])),
    chars: CHARS.map(newCharState), ship: freshShip(), log: [] };
  s.chars.forEach(syncInv);
  return s;
}
function migrate(s){ // patch older saves
  if(!s.visible){
    s.visible = Object.fromEntries(CHARS.map(c=>[c.id, !s.view || s.view==='all' || s.view===c.id]));
    delete s.view;
  }
  for(const c of CHARS){
    if(!s.chars.find(x=>x.id===c.id)) s.chars.push(newCharState(c));
    if(s.visible[c.id]===undefined) s.visible[c.id]=true;
  }
  for(const cs of s.chars){
    const def = newCharState(cfg(cs.id));
    for(const k in def) if(cs[k]===undefined) cs[k]=def[k];
    if(cs.lastTiers && cs.lastTiers.hygiene===undefined) cs.lastTiers.hygiene=0;
    if(cs.conds){  // old 'infected' condition folds into the stacking Sick condition
      let sickLvl = 0;
      for(const cd of cs.conds) if(cd.id==='sick'||cd.id==='infected') sickLvl=Math.max(sickLvl, cd.lvl||1);
      cs.conds = cs.conds.filter(cd=> (cd.custom && cd.label) || (CONDS[cd.id] && cd.id!=='sick' && cd.id!=='infected'));
      for(const cd of cs.conds) if(cd.custom && cd.fx===undefined) cd.fx='';
      if(sickLvl) cs.conds.push({id:'sick', lvl:Math.min(5,sickLvl)});
    }
    delete cs.encCur; delete cs.infHrs;
    syncInv(cs);
  }
  for(const k of ['ambImg','location','travelDest']) if(s[k]===undefined) s[k]='';
  if(s.travelEta===undefined) s.travelEta=0;
  if(!s.ship) s.ship = freshShip();
  else {  // patch older ship saves
    const d = freshShip();
    for(const k in d) if(s.ship[k]===undefined) s.ship[k]=d[k];
    if(!s.ship.defense) s.ship.defense = {...SHIP.defense};
    if(!s.ship.energy)  s.ship.energy = {};
    if(s.ship.reserve===undefined) s.ship.reserve = 0;
    if(!s.ship.shieldBoost) s.ship.shieldBoost = {fore:0, port:0, stbd:0, aft:0};
    if(!s.ship.cargo) s.ship.cargo = [];
    if(!s.ship.smuggle) s.ship.smuggle = [];
    for(const sy of SHIP_SYSTEMS){
      if(s.ship.systems[sy.id]===undefined) s.ship.systems[sy.id]=5;
      if(s.ship.sysHrs[sy.id]===undefined)  s.ship.sysHrs[sy.id]=0;
      if(s.ship.energy[sy.id]===undefined)  s.ship.energy[sy.id]=SHIP_ENERGY_DEFAULT;
    }
  }
  return s;
}

/* ================================================================

   ================================================================ */
const cfg = id => CHARS.find(c=>c.id===id);
const st  = id => S.chars.find(x=>x.id===id);
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const stripTags = s => String(s).replace(/<[^>]*>/g,'');
const fxText = (def,lvl) => typeof def.fx==='function' ? def.fx(lvl||1) : def.fx;
const condTitle = (def,lvl) => esc(stripTags(fxText(def,lvl)).replace(/&amp;/g,'&'));  // plain-text hover tooltip
const dayNow = () => Math.floor(S.hour/24);           // days begin at 00:00
function clockStr(){
  const tot = Math.round(S.hour*60), h = Math.floor(tot/60)%24, m = tot%60;
  return `Day ${dayNow()+1} — ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
const fmtDur = h => h>=1 ? `${(+h.toFixed(2))} hr` : `${Math.round(h*60)} min`;
const invWeight = cs => cs.inv.reduce((a,it)=>a + (it.qty||0)*(it.wt||0), 0);
const overload  = cs => cs.encThresh>0 ? Math.max(0, Math.ceil(invWeight(cs)) - cs.encThresh) : 0;
const forceMult = cs => cfg(cs.id).fs ? 1 - FORCE_PER_PT*clamp(cs.force||0, 0, 8) : 1;
const envMult = (m, adapt) => m<=1 ? m : 1+(m-1)*(adapt??1);
function tierOf(x, tiers){ tiers=tiers||DTIERS; let t=tiers[0]; for(const ti of tiers){ if(x>=ti.min) t=ti; } return t; }
function condMult(cs, key){
  let m = 1;
  for(const cd of cs.conds){
    const mm = CONDS[cd.id]?.mult?.[key];   // custom conditions carry no multipliers
    if(mm) m *= (typeof mm==='function' ? mm(cd.lvl||1) : mm);
  }
  // soaked in a cold environment also counts as chilled
  if(cs.conds.some(c=>c.id==='soaked') && ENVS[S.env].cold && !cs.conds.some(c=>c.id==='chilled')){
    const mm = CONDS.chilled.mult[key]; if(mm) m *= mm;
  }
  return m;
}
const activeAct = cs => cs.status ? STATUSES[cs.status.kind].act : cs.activity;
function rolloverStimDay(cs){  // "used today" counter resets at midnight
  const d = dayNow();
  if(cs.stimDay!==d){ cs.stimDay=d; cs.stimsToday=0; }
}

function exhaustion(cs){  // droid degradation meter (organics use per-need tiers instead)
  let x = 0.55*cs.charge + 0.45*cs.maint;
  x += [cs.charge,cs.maint].filter(v=>v>=70).length * 8;
  return Math.min(100, x);
}

/* ================================================================
   CORE SIMULATION — dt hours (≤1) for one character
   ================================================================ */
function tick(cs, dt){
  const c = cfg(cs.id), env = ENVS[S.env];
  const events = [];
  const actKey = activeAct(cs), act = ACTS[actKey];
  const isStandby = actKey==='sleeping';
  const over = overload(cs);
  const encM = 1 + ENC_DRAIN_PER_PT*over;
  const woundCap = cs.wt>0 ? cs.wt+10 : 999;

  if(c.droid){ /* ---- droid ---- */
    const prevCharge = cs.charge;
    if(prevCharge < 100){  // a shut-down droid draws no power and grinds no gears
      cs.charge = clamp(cs.charge + (100/c.packHrs)*act.power*env.power*encM*condMult(cs,'charge')*dt, 0, 100);
      cs.maint  = clamp(cs.maint + MAINT_BASE*act.maint*envMult(env.maint, c.mods.maintAdapt)*(c.mods.maintRate||1)*encM*condMult(cs,'maint')*dt, 0, 100);
    }
    if(prevCharge<100 && cs.charge>=100) events.push(['lb',`🔋 ${c.name}'s power pack is drained — FULL SHUTDOWN until a fresh pack or recharge.`]);
  } else {   /* ---- organic ---- */
    rolloverStimDay(cs);
    const fM = forceMult(cs);

    const wEnv = envMult(env.water, env.heat ? (c.mods.heatAdapt??1) : 1);
    const wRate = tierOf(cs.water, NEEDS.water.tiers).rate;  // accrual speeds up as thirst deepens
    cs.water = clamp(cs.water + wRate*act.water*wEnv*(c.mods.waterRate||1)*encM*fM*condMult(cs,'water')*dt, 0, 100);

    const hEnv = envMult(env.hunger, env.cold ? (c.mods.coldAdapt??1) : 1);
    const hMod = c.mods.hungerRate || 1;
    const hRate = tierOf(cs.hunger, NEEDS.hunger.tiers).rate;  // fast appetite, then a slow burn on reserves
    // flat metabolic offset: full through the early/mid tiers (daily-scale visibility),
    // fading to 0 by Emaciated so deep-starvation stays near-proportional (not runaway)
    const hFade = clamp((76 - cs.hunger)/50, 0, 1);
    const hPhysio = HUNGER_PHYSIO_FLAT*(hMod-1)*hFade;
    cs.hunger = clamp(cs.hunger + (hRate*hMod + hPhysio)*act.hunger*hEnv*encM*fM*condMult(cs,'hunger')*dt, 0, 100);

    // hygiene: grime decelerates as it accumulates; the Force can't keep you clean
    const gRate = tierOf(cs.hygiene, NEEDS.hygiene.tiers).rate;
    cs.hygiene = clamp(cs.hygiene + gRate*(act.hyg||1)*(env.hyg||1)*condMult(cs,'hygiene')*dt, 0, 100);

    // fatigue: activity-driven; sleep deprivation slows recovery and speeds accrual
    const sleepDep = cs.sleep >= SLEEP_FATIGUE.thresh;
    if(act.rest < 0) cs.rest = clamp(cs.rest + act.rest*(sleepDep?SLEEP_FATIGUE.recovery:1)*dt, 0, 100);
    else cs.rest = clamp(cs.rest + act.rest*env.rest*(c.mods.restRate||1)*encM*fM*(cs.stimHrs>0?0.5:1)*(sleepDep?SLEEP_FATIGUE.accrual:1)*condMult(cs,'rest')*dt, 0, 100);

    const prevSleep = cs.sleep;
    if(isStandby){
      cs.sleep = clamp(cs.sleep - (100/(c.mods.sleepNeed||8))*dt, 0, 100);
    } else {
      let sRate = BASE.sleepAwake*(c.mods.sleepRate||1);
      if(actKey==='resting') sRate *= 0.5;                               // resting: sleep debt ticks at half rate
      if(cs.rest >= FATIGUE_SLEEP.thresh) sRate *= FATIGUE_SLEEP.accrual; // a worn-out body craves rest
      cs.sleep = clamp(cs.sleep + sRate*(1+ENC_SLEEP_PER_PT*over)*fM*condMult(cs,'sleep')*dt, 0, 100);
      if(prevSleep<100 && cs.sleep>=100) events.push(['lw',`${c.name} is Wrecked — the GM may force an involuntary collapse into sleep at any dramatic moment.`]);
    }
    if(cs.stimHrs>0){
      cs.stimHrs = Math.max(0, +(cs.stimHrs - dt).toFixed(3));
      if(cs.stimHrs===0) events.push(['lg',`${c.name}'s stimpack stimulant wears off.`]);
    }
  }

  // ambient equipment wear: weapons & worn gear age with time (0→100 in ~1 month temperate,
  // faster in harsh environments), on top of per-use wear
  const wearEnv = env.maint || 1;
  for(const it of cs.inv){
    if(it.auto || !isDegradable(it.type)) continue;
    const before = it.wear||0;
    if(before>=100) continue;
    it.wear = clamp(before + WEAR_PER_HOUR*wearEnv*dt, 0, 100);
    if(before<100 && it.wear>=100) events.push(['lw',`🗡 ${c.name}'s ${it.name||'equipment'} is worn out (Broken) — repair before relying on it.`]);
  }

  // timed status payload & countdown
  if(cs.status){
    const def = STATUSES[cs.status.kind];
    const deltas = cs.status.deltas || def.deltas;   // meals store caps computed when eating began
    const step = Math.min(dt, cs.status.remain);
    const frac = step / cs.status.total;
    for(const k in deltas){
      let dv = deltas[k]*frac;
      if(k==='rest' && dv<0 && cs.sleep>=SLEEP_FATIGUE.thresh) dv *= SLEEP_FATIGUE.recovery;
      cs[k] = clamp(cs[k] + dv, 0, 100);
    }
    if(def.sleepCredit) cs.sleep = clamp(cs.sleep - def.sleepCredit*(100/(c.mods.sleepNeed||8))*frac, 0, 100);
    cs.status.remain = +(cs.status.remain - dt).toFixed(3);
    if(cs.status.remain <= 0){
      events.push(['lg',`${c.name} finishes ${def.label.replace(/^\S+ /,'').toLowerCase()} — status back to normal.`]);
      cs.status = null; cs.activity = cs.prevAct;
    }
  }

  // discrete hourly effects
  cs.hourAcc = +(cs.hourAcc + dt).toFixed(3);
  while(cs.hourAcc >= 1){
    cs.hourAcc = +(cs.hourAcc - 1).toFixed(3);
    applyHourly(cs, c, events, woundCap, isStandby);
  }

  // tier-change notices
  if(c.droid){  // droids keep the combined degradation meter
    const ex = exhaustion(cs), t = tierOf(ex, DTIERS), ti = DTIERS.indexOf(t);
    if(ti !== cs.lastTier){
      events.push([ti>cs.lastTier?'lw':'ld', `${c.name} is now ${t.name} (degradation ${Math.round(ex)}).`]);
      cs.lastTier = ti;
    }
  } else {  // organics: one notice per need as it crosses a tier
    for(const key of NEED_KEYS){
      const tiers = NEEDS[key].tiers, t = tierOf(cs[key], tiers), ti = tiers.indexOf(t);
      const prev = cs.lastTiers[key]||0;
      if(ti !== prev){
        if(ti>0 || prev>0) events.push([ti>prev?'lw':'', `${c.name} is now ${t.name} (${NEEDS[key].label.replace(/^\S+ /,'').toLowerCase()} ${Math.round(cs[key])}).`]);
        cs.lastTiers[key] = ti;
      }
    }
  }
  if(cs.strain>=cs.st && cs.st>0) events.push(['lw',`${c.name} has exceeded strain threshold (${cs.strain}/${cs.st}) — ${c.droid?'DISABLED':'UNCONSCIOUS'}.`]);
  if(cs.wounds>cs.wt && cs.wt>0) events.push(['lb',`☠ ${c.name} has exceeded wound threshold (${cs.wounds}/${cs.wt}) — ${c.droid?'CRITICAL DAMAGE, needs major repairs':'CRITICAL INJURY / DYING'}.`]);
  return events;
}

function applyHourly(cs, c, events, woundCap, isStandby){
  const strainCap = cs.st>0 ? cs.st*2 : 999;

  // condition hourly effects (organics & droids; custom conditions have none)
  for(const cd of cs.conds) CONDS[cd.id]?.hourly?.(cs, cd.lvl||1, events, woundCap);

  if(c.droid){  // droids: combined degradation meter drives strain; wear ⇒ wounds at 100
    const t = tierOf(exhaustion(cs), DTIERS);
    if(t.strain>0 && !isStandby && !(cs.charge>=100))
      cs.strain = Math.min(strainCap, cs.strain + t.strain);
    if(cs.maint>=100 && !isStandby && cs.charge<100 && cs.wounds<woundCap){
      cs.wounds++; events.push(['lb',`🔧 ${c.name} suffers 1 wound — mechanisms grinding themselves apart.`]);
    }
    return;
  }

  // organics: each need's current tier applies its own strain / wounds / special effect
  for(const key of NEED_KEYS){
    const t = tierOf(cs[key], NEEDS[key].tiers);
    if(t.strain>0 && !isStandby) cs.strain = Math.min(strainCap, cs.strain + t.strain);
    if(t.wounds>0 && cs.wounds<woundCap){
      cs.wounds += t.wounds;
      events.push(['lb',`${c.name} suffers ${t.wounds} wound — ${NEEDS[key].label.replace(/^\S+ /,'').toLowerCase()} (${t.name}).`]);
    }
    t.hourly?.(cs, c, events, woundCap);
  }
  if(cs.hunger < 76)  cs.starveHrs = 0;   // starvation wound clock runs only while Emaciated+
  if(cs.hygiene < 76) cs.hygHrs = 0;      // daily hygiene checks run only while Squalid+
  if(!cs.conds.some(x=>x.id==='sick')) cs.sickHrs = 0;

  // environmental conditions from prolonged exposure
  const chance = ENV_COND_CHANCE[S.env];
  if(chance && !isStandby){
    const condId = ENVS[S.env].heat ? 'overheated' : 'chilled';
    if(!cs.conds.some(x=>x.id===condId) && Math.random()<chance){
      cs.conds.push({id:condId});
      events.push(['lw',`${c.name} is ${condId} by the ${ENVS[S.env].label.toLowerCase()} (GM may waive with proper gear).`]);
    }
  }
}

function advance(hrs){
  if(!hrs || hrs<=0) return;
  let left = hrs;
  while(left > 0){
    const dt = Math.min(1, left); left = +(left-dt).toFixed(3);
    S.hour = +(S.hour+dt).toFixed(3);
    for(const cs of S.chars) for(const ev of tick(cs, dt)) logMsg(ev[1], ev[0]);
    for(const ev of tickShip(dt)) logMsg(ev[1], ev[0]);
    if(S.travelDest && S.travelEta>0){
      S.travelEta = Math.max(0, +(S.travelEta-dt).toFixed(2));
      if(S.travelEta===0){
        logMsg(`🧭 The party arrives at ${S.travelDest}.`, 'lg');
        S.location = S.travelDest; S.travelDest = '';
      }
    }
  }
  logMsg(`⏱ Advanced ${fmtDur(hrs)} → ${clockStr()}.`);
  render();
}

/* ================================================================
   TIMED STATUSES
   ================================================================ */
function startStatus(id, kind, dur){
  const cs = st(id), c = cfg(id), def = STATUSES[kind];
  if(def.fs && !c.fs) return;   // meditation is for Force sensitives only
  if(cs.status) cancelStatus(id, true);
  const deltas = {...def.deltas};
  if(kind==='ration' || kind==='meal'){
    const cost = +(c.rations*def.costMult).toFixed(2);
    if(cs.rationsStock < cost){ logMsg(`${c.name} doesn't have enough rations (needs ${cost}, has ${cs.rationsStock}).`,'lw'); render(); return; }
    cs.rationsStock = +(cs.rationsStock - cost).toFixed(2);
    let pts = -deltas.hunger; const notes = [];
    if(cs.water >= REHYDRATE.thresh){ pts = pts/2; notes.push('dehydrated — the body absorbs only half the nourishment'); }
    if(cs.hunger >= REFEED.thresh && pts > REFEED.capPts){
      pts = REFEED.capPts;
      notes.push(`starving — only ~${REFEED.capPts} pts absorbed per careful meal; gorging risks refeeding shock (a 🤒 Sick stack, GM's call)`);
    }
    deltas.hunger = -pts;
    if(notes.length) logMsg(`⚠ ${c.name}: ${notes.join('; ')}.`,'lw');
  }
  const total = dur || def.dur;
  cs.prevAct = cs.activity;
  cs.status = { kind, remain:total, total, deltas };
  logMsg(`${def.label} — ${c.name} (${fmtDur(total)}). Advance the clock to progress.`, kind.startsWith('med')?'lf':'');
  render();
}
function cancelStatus(id, silent){
  const cs = st(id);
  if(!cs.status) return;
  const def = STATUSES[cs.status.kind];
  cs.status = null; cs.activity = cs.prevAct;
  if(!silent){ logMsg(`✖ ${cfg(id).name} stops ${def.label.replace(/^\S+ /,'').toLowerCase()} — status back to normal.`); render(); }
}
function startSleep(id){
  const hrs = clamp(parseFloat(document.getElementById('slp-'+id).value)||8, 0.5, 16);
  startStatus(id, 'sleep', hrs);
}

/* ================================================================
   PLAYER ACTIONS — organics
   ================================================================ */
function drink(id, oz){
  const cs = st(id), c = cfg(id);
  const avail = Math.min(oz, cs.canteen);
  if(avail<=0){ logMsg(`${c.name}'s canteen is empty!`, 'lw'); render(); return; }
  const ptsPerOz = DRINK_OZ_TO_PTS / c.waterOz;  // full 20oz ≈ 25 pts for a 60oz body
  let ozUsed = avail, pts = avail * ptsPerOz, capped = false;
  if(cs.water >= REHYDRATE.thresh && pts > REHYDRATE.capPts){  // severe dehydration limits absorption
    pts = REHYDRATE.capPts; ozUsed = +(pts / ptsPerOz).toFixed(1); capped = true;
  }
  cs.canteen = +(cs.canteen - ozUsed).toFixed(1);
  cs.water = clamp(cs.water - pts, 0, 100);
  logMsg(`${c.name} drinks ${ozUsed} oz (−${pts.toFixed(1)} thirst)${capped?' — severely dehydrated, the body absorbs only ~'+REHYDRATE.capPts+' per drink; sip and rest':''}. Canteen: ${cs.canteen}/${OZ_PER_CANTEEN} oz.`);
  render();
}
function refill(id){
  st(id).canteen = OZ_PER_CANTEEN;
  logMsg(`${cfg(id).name} refills their canteen (water source required — GM approves).`);
  render();
}
function eatSnack(id){
  const cs = st(id), c = cfg(id);
  if(cs.snacks < 1){ logMsg(`${c.name} is out of snacks.`, 'lw'); render(); return; }
  cs.snacks--;
  let pts = SNACK_HUNGER, note = '';
  if(cs.water >= REHYDRATE.thresh){ pts /= 2; note = ' — dehydrated, only half absorbed'; }
  cs.hunger = clamp(cs.hunger - pts, 0, 100);
  logMsg(`${c.name} eats a snack on the move (−${pts} hunger${note}).`);
  render();
}
/* ---- hygiene ---- */
function wash(id){
  const cs = st(id);
  cs.hygiene = clamp(cs.hygiene - HYG.wash, 0, 100);
  logMsg(`🛁 ${cfg(id).name} takes a full wash (−${HYG.wash} hygiene, 15–30 min). Requires ample water — GM approves.`);
  render();
}
function wipeDown(id){
  const cs = st(id), c = cfg(id);
  if(cs.canteen < HYG.wipeOz){ logMsg(`${c.name} needs ${HYG.wipeOz} oz of water for a wipe-down — canteen too low (a sonic shower works too; GM approves).`,'lw'); render(); return; }
  cs.canteen = +(cs.canteen - HYG.wipeOz).toFixed(1);
  cs.hygiene = clamp(cs.hygiene - HYG.wipe, 0, 100);
  logMsg(`🧻 ${c.name} field-cleans with ${HYG.wipeOz} oz from the canteen (−${HYG.wipe} hygiene). Canteen: ${cs.canteen}/${OZ_PER_CANTEEN} oz.`);
  render();
}
function cleanClothes(id){
  const cs = st(id);
  cs.hygiene = clamp(cs.hygiene - HYG.clothes, 0, 100);
  logMsg(`👕 ${cfg(id).name} changes into clean clothing (−${HYG.clothes} hygiene). Requires a clean change — GM approves.`);
  render();
}
function useStim(id){
  const cs = st(id), c = cfg(id);
  if(cs.stims < 1){ logMsg(`${c.name} has no stimpacks left.`, 'lw'); render(); return; }
  rolloverStimDay(cs);
  cs.stims--; cs.stimsToday++;
  cs.rest   = clamp(cs.rest - STIM.fatigue, 0, 100);
  cs.strain = Math.max(0, cs.strain - STIM.strain);
  cs.stimHrs = STIM.hours;
  if(cs.stimsToday <= STIM.maxHeals){
    const heal = STIM.maxHeals + 1 - cs.stimsToday;
    cs.wounds = Math.max(0, cs.wounds - heal);
    logMsg(`💉 ${c.name} uses stimpack #${cs.stimsToday} today: heals ${heal} wounds, −${STIM.fatigue} fatigue, −${STIM.strain} strain, stimulant ${STIM.hours} hrs.`, 'lg');
  } else {
    cs.wounds += STIM.odWounds;
    logMsg(`💉⚠ ${c.name} uses stimpack #${cs.stimsToday} today — beyond safe limits! No healing; +${STIM.odWounds} wounds from overexertion. Stimulant still applies (${STIM.hours} hrs).`, 'lb');
  }
  render();
}
function setForce(id, v){
  const cs = st(id);
  cs.force = clamp(parseInt(v)||0, 0, 8);
  logMsg(`✨ ${cfg(id).name} commits ${cs.force} Force point(s) — bodily needs slowed ${Math.round((1-forceMult(cs))*100)}%. (Committed points are unavailable for other powers.)`,'lf');
  render();
}
function setAttr(id, key, v){
  const cs = st(id);
  cs.attr[key] = clamp(parseInt(v)||1, 1, 7);
  if(key==='br'){ cs.encThresh = cs.attr.br + 5; logMsg(`⚖ ${cfg(id).name}'s encumbrance threshold set to ${cs.encThresh} (Brawn ${cs.attr.br} + 5).`); }
  render();
}

/* ---- conditions ---- */
function addCond(id, condId){
  if(!condId) return;
  if(condId==='__custom'){ addCustomCond(id); return; }
  const cs = st(id);
  if(cs.conds.some(x=>x.id===condId)){ render(); return; }
  const def = CONDS[condId];
  cs.conds.push(def.lvls ? {id:condId, lvl:1} : {id:condId});
  logMsg(`${def.label} — applied to ${cfg(id).name}.`, 'lw');
  render();
}
function addCustomCond(id){   // opens the inline form on the card (no blocking popups)
  st(id).customOpen = true;
  render();
  document.getElementById('ccn-'+id)?.focus();
}
function saveCustomCond(id){
  const name = (document.getElementById('ccn-'+id)?.value||'').trim();
  const fx   = (document.getElementById('ccf-'+id)?.value||'').trim();
  if(!name){ logMsg('🏷 A custom condition needs at least a name.','lw'); return; }
  const cs = st(id);
  cs.conds.push({id:'c'+Date.now(), custom:true, label:name, fx});
  cs.customOpen = false;
  logMsg(`🏷 ${esc(name)} — custom condition applied to ${cfg(id).name}${fx?`: ${esc(fx)}`:''}.`, 'lw');
  render();
}
function customCondForm(cs){
  if(!cs.customOpen) return '';
  const enter = `onkeydown="if(event.key==='Enter')saveCustomCond('${cs.id}')"`;
  return `<div class="customform">🏷
    <input type="text" id="ccn-${cs.id}" placeholder="condition name" style="width:120px" ${enter}>
    <input type="text" id="ccf-${cs.id}" placeholder="effect — e.g. 1 wound each encounter until bandaged" style="width:230px" ${enter}>
    <button class="mini" onclick="saveCustomCond('${cs.id}')">✓ add</button>
    <button class="mini" onclick="st('${cs.id}').customOpen=false;render()" title="Cancel">✖</button>
  </div>`;
}
function rmCond(id, condId){
  const cs = st(id), cd = cs.conds.find(x=>x.id===condId);
  cs.conds = cs.conds.filter(x=>x.id!==condId);
  if(cd) logMsg(`${cd.custom ? '🏷 '+esc(cd.label) : CONDS[condId].label} removed from ${cfg(id).name}.`);
  render();
}
function condLvl(id, condId, d){
  const cs = st(id), cd = cs.conds.find(x=>x.id===condId);
  if(!cd || cd.custom) return;
  cd.lvl = clamp((cd.lvl||1)+d, 1, CONDS[condId].lvls||1);
  render();
}

/* ================================================================
   SHIP — Mantis. Simulation on the party clock + player actions
   ================================================================ */
function tickShip(dt){
  const sh = S.ship, ev = [], act = SHIP_ACTS[sh.activity];
  // fuel burn at the current flight status
  if(act.tph>0 && sh.fuel>0){
    const before = sh.fuel;
    sh.fuel = clamp(+(sh.fuel - act.tph*dt).toFixed(3), 0, SHIP.fuelCap);
    const pb = before/SHIP.fuelCap*100, pa = sh.fuel/SHIP.fuelCap*100;
    if(pb>25 && pa<=25) ev.push(['lw',`⛽ Mantis fuel low — below 25% (${(SHIP.fuelCap*0.25)}t).`]);
    if(pb>10 && pa<=10) ev.push(['lw',`⛽ Mantis fuel critical — below 10% (${(SHIP.fuelCap*0.1)}t).`]);
    if(pb>0  && pa<=0)  ev.push(['lb','🪫 Mantis is OUT OF FUEL — dead in space until refueled.']);
  }
  // system wear: ~one condition pip per week of powered operation without maintenance,
  // scaled by each system's energy draw (over-default speeds wear, under-default slows it)
  if(sh.activity!=='docked'){
    for(const s of SHIP_SYSTEMS){
      if(sh.systems[s.id]<=0){ sh.sysHrs[s.id]=0; continue; }
      sh.sysHrs[s.id] = +((sh.sysHrs[s.id]||0) + dt*energyWearMult(sh.energy[s.id])).toFixed(3);
      while(sh.sysHrs[s.id]>=SHIP_MAINT_WEEK && sh.systems[s.id]>0){
        sh.sysHrs[s.id] = +(sh.sysHrs[s.id]-SHIP_MAINT_WEEK).toFixed(3);
        sh.systems[s.id]--;
        ev.push(['lw',`🔧 Mantis ${s.name} slips to ${shipCond(sh.systems[s.id]).name} (${sh.systems[s.id]}/5) — sustained operation without maintenance.`]);
      }
    }
  }
  return ev;
}
function setShipAct(v){ S.ship.activity=v; logMsg(`🚀 Mantis flight status: ${SHIP_ACTS[v].label} (${SHIP_ACTS[v].tph} t/hr fuel burn).`); render(); }
function shipFuelLog(m){ S.ship.fuelLog.unshift({t:clockStr(), m}); S.ship.fuelLog = S.ship.fuelLog.slice(0,40); }
function shipBurn(){
  const sh = S.ship, actKey = document.getElementById('burnAct').value;
  const hrs = Math.max(0, parseFloat(document.getElementById('burnHrs').value)||0);
  if(!actKey || hrs<=0){ logMsg('⛽ Pick an activity and a duration to log a fuel burn.','lw'); return; }
  const a = SHIP_ACTS[actKey], used = +(a.tph*hrs).toFixed(2);
  sh.fuel = clamp(+(sh.fuel - used).toFixed(2), 0, SHIP.fuelCap);
  const name = a.label.replace(/^\S+ /,'');
  shipFuelLog(`−${used}t · ${name} · ${fmtDur(hrs)}`);
  logMsg(`⛽ Mantis burns ${used}t — ${fmtDur(hrs)} of ${name.toLowerCase()}. Fuel: ${sh.fuel}/${SHIP.fuelCap}t.`);
  render();
}
function shipRefuel(){
  const sh = S.ship, added = +(SHIP.fuelCap - sh.fuel).toFixed(2);
  if(added<=0){ logMsg('⛽ Mantis tank is already full.'); return; }
  sh.fuel = SHIP.fuelCap; shipFuelLog(`＋${added}t · refueled to full`);
  logMsg(`⛽ Mantis refueled at port (＋${added}t → ${SHIP.fuelCap}t full).`,'lg');
  render();
}
function setShipFuel(v){ S.ship.fuel = clamp(+(parseFloat(v)||0), 0, SHIP.fuelCap); render(); }
function repairSys(id, d){
  const sh = S.ship, before = sh.systems[id];
  sh.systems[id] = clamp(before + d, 0, 5);
  if(sh.systems[id]===before){ render(); return; }
  if(d>0){ sh.sysHrs[id]=0; logMsg(`🔧 Mantis ${sysName(id)} repaired to ${shipCond(sh.systems[id]).name} (${sh.systems[id]}/5).`,'lg'); }
  else logMsg(`💥 Mantis ${sysName(id)} damaged to ${shipCond(sh.systems[id]).name} (${sh.systems[id]}/5).`,'lb');
  render();
}
function shipAdj(k, d){ const sh=S.ship; sh[k]=Math.max(0, sh[k]+d); render(); }
function setShipThr(k, v){ S.ship[k]=Math.max(0, parseInt(v)||0); render(); }
function setDef(arc, v){ S.ship.defense[arc]=Math.max(0, parseInt(v)||0); render(); }
function fireTorp(){
  const sh = S.ship;
  if(sh.ammo<1){ logMsg('🚀 Mantis has no proton torpedoes loaded.','lw'); render(); return; }
  sh.ammo--; logMsg(`🚀 Proton torpedo away — ${sh.ammo} remaining. Resupply at port.`,'lw');
  render();
}
function setAmmo(v){ S.ship.ammo=Math.max(0, parseInt(v)||0); render(); }
function reloadTorp(){ S.ship.ammo=SHIP.torpedoes; logMsg(`🚀 Mantis torpedo magazine reloaded to ${SHIP.torpedoes} at port.`,'lg'); render(); }
function setCrew(role, v){ S.ship.crew[role]=v; render(); }
/* ---- cargo holds (free-form inventory): main hold (100 enc) + hidden smuggling compartment (10 enc) ---- */
const holdWeight = key => S.ship[key].reduce((a,it)=>a + (it.qty||0)*(it.wt||0), 0);
function addCargo(hold){ S.ship[hold].push({name:'', type:'', qty:1, wt:0}); render(); }
function delCargo(hold, i){ S.ship[hold].splice(i,1); render(); }
function setCargo(hold, i, k, v){
  const it = S.ship[hold][i]; if(!it) return;
  it[k] = (k==='qty'||k==='wt') ? Math.max(0, parseFloat(v)||0) : v;
  render();
}
/* ---- energy distribution (total conserved: Σ system energy + reserve) ---- */
function energyAdj(id, d){
  const sh = S.ship;
  if(d>0){                                   // draw a point from the reserve into this system
    if(sh.reserve<=0){ logMsg('⚡ No reserve energy — pull a point from another system first.','lw'); return; }
    if(sh.energy[id]>=SHIP_ENERGY_MAX){ logMsg(`⚡ ${sysName(id)} is already at maximum energy (${SHIP_ENERGY_MAX}).`,'lw'); return; }
    sh.energy[id]++; sh.reserve--;
  } else {                                   // return a point from this system to the reserve
    if(sh.energy[id]<=0) return;
    sh.energy[id]--; sh.reserve++;
  }
  if(id==='shields' && sh.energy.shields!==SHIP_ENERGY_MAX) sh.shieldBoost={fore:0,port:0,stbd:0,aft:0};
  const m = energyWearMult(sh.energy[id]), bonus = overcharged(id) ? ` · ⚡overcharged: ${SHIP_ENERGY_BONUS[id].label}` : '';
  logMsg(`⚡ ${sysName(id)} energy ${sh.energy[id]} (wear ×${m.toFixed(2)})${id==='sensors'?` · sensor range ${sensorRangeFor(sh.energy.sensors)}`:''}${bonus} · reserve ${sh.reserve}.`);
  render();
}
function shieldBoostAdj(arc, d){
  const sh = S.ship;
  if(sh.energy.shields!==SHIP_ENERGY_MAX){ logMsg('🛡 Route Shields to full energy first to gain distributable defense.','lw'); return; }
  const cap = SHIP_ENERGY_BONUS.shields.defense;
  const used = sh.shieldBoost.fore+sh.shieldBoost.port+sh.shieldBoost.stbd+sh.shieldBoost.aft;
  if(d>0){ if(used>=cap){ logMsg(`🛡 All ${cap} shield-boost dice are already assigned.`,'lw'); return; } sh.shieldBoost[arc]++; }
  else { if(sh.shieldBoost[arc]<=0) return; sh.shieldBoost[arc]--; }
  render();
}
function setSensorRange(name){
  const sh = S.ship, r = SENSOR_RANGES.find(x=>x.name===name);
  if(!r) return;
  const delta = r.energy - sh.energy.sensors;
  if(delta>0 && sh.reserve<delta){
    logMsg(`📡 Not enough reserve energy for ${name} range (needs +${delta}, reserve ${sh.reserve}). Free up energy elsewhere first.`,'lw');
    render(); return;
  }
  sh.energy.sensors = r.energy; sh.reserve -= delta;
  logMsg(`📡 Sensor range set to ${name} — Sensors & Comms energy ${r.energy} (wear ×${energyWearMult(r.energy).toFixed(2)}) · reserve ${sh.reserve}.`);
  render();
}
function resetEnergy(){
  const sh = S.ship;
  for(const s of SHIP_SYSTEMS) sh.energy[s.id]=SHIP_ENERGY_DEFAULT;
  sh.reserve=0; sh.shieldBoost={fore:0,port:0,stbd:0,aft:0};
  logMsg('⚡ Energy distribution reset to default — every system balanced, reserve empty.');
  render();
}

/* ================================================================
   INVENTORY (auto-synced consumables + free rows)
   ================================================================ */
function syncInv(cs){
  const c = cfg(cs.id);
  const wanted = c.droid
    ? [['packs', cs.packsCharged+cs.packsDepleted]]
    : [['canteen',1],['rations',cs.rationsStock],['snacks',cs.snacks],['stims',cs.stims]];
  for(const [key,qty] of wanted){
    let row = cs.inv.find(it=>it.auto===key);
    if(!row){ row = {auto:key, name:AUTO_ITEMS[key].name, type:AUTO_ITEMS[key].type, qty:0, wt:AUTO_ITEMS[key].wt}; cs.inv.push(row); }
    row.qty = qty;
  }
}
function addInv(id){ st(id).inv.push({name:'', type:'', qty:1, wt:0}); st(id).invOpen=true; render(); }
function delInv(id,i){ st(id).inv.splice(i,1); render(); }
function setInv(id,i,k,v){
  const cs = st(id), it = cs.inv[i];
  const num = Math.max(0, parseFloat(v)||0);
  if(it.auto && k==='qty'){       // editing an auto row's qty updates the real stock
    if(it.auto==='rations') cs.rationsStock = num;
    else if(it.auto==='snacks') cs.snacks = num;
    else if(it.auto==='stims') cs.stims = num;
    else if(it.auto==='packs') cs.packsCharged = Math.max(0, num - cs.packsDepleted);
  } else {
    it[k] = (k==='qty'||k==='wt') ? num : v;
    if(k==='type' && isDegradable(v)){ if(it.wear==null) it.wear=0; cs.gearOpen=true; }
  }
  render();
}

/* ---- equipment wear (weapons & worn gear) ---- */
function useItem(id,i){
  const cs=st(id), it=cs.inv[i]; if(!it) return;
  it.wear = clamp((it.wear||0)+WEAR_PER_USE, 0, 100);
  logMsg(`🔧 ${cfg(id).name} uses ${it.name||'an item'} (+${WEAR_PER_USE} wear → ${Math.round(it.wear)}${it.wear>=100?', now BROKEN':''}).`, it.wear>=100?'lw':'');
  render();
}
function tuneItem(id,i){
  const cs=st(id), it=cs.inv[i]; if(!it) return;
  it.wear = clamp((it.wear||0)-GEAR_TUNEUP, 0, 100);
  logMsg(`🔧 ${cfg(id).name} tunes up ${it.name||'an item'} (−${GEAR_TUNEUP} wear → ${Math.round(it.wear)}). Tools + a few minutes.`, 'ld');
  render();
}
function overhaulItem(id,i){
  const cs=st(id), it=cs.inv[i]; if(!it) return;
  it.wear = 0;
  logMsg(`🔧⚙ ${cfg(id).name} fully overhauls ${it.name||'an item'} — wear reset to 0. Requires a bench/kit (GM approves).`, 'ld');
  render();
}

/* ---- images ----
   Images are GM-set repo files (img/<id>.jpg|png, img/ship.*, img/scene.*), loaded
   directly in the card/scene/ship markup — see portraitSection() and renderShip().
   SCENE_IMG_OK is probed once at startup (probeScene). No in-app uploading. */
let SCENE_IMG_OK = false;
function probeScene(cb){
  const tryLoad = (src, next) => {
    const im = new Image();
    im.onload = () => { document.getElementById('ambImg').src = src; SCENE_IMG_OK = true; cb && cb(); };
    im.onerror = next;
    im.src = src;
  };
  tryLoad('img/scene.jpg', () => tryLoad('img/scene.png', () => { SCENE_IMG_OK = false; cb && cb(); }));
}
const hurtOpacity = cs => HURT_MAX_OPACITY * clamp(cs.wounds/(cs.wt||12), 0, 1);

/* ================================================================
   UI
   ================================================================ */
const needColor = v => v<35 ? 'var(--good)' : v<60 ? 'var(--warn)' : v<85 ? 'var(--bad)' : 'var(--crit)';

function needRow(cs, key, label, extras, tier){
  const v = cs[key];
  const color = tier ? tier.color : needColor(v);
  const badge = tier ? ` <span class="tierbadge needtier" style="background:${color};color:#000">${tier.name}</span>` : '';
  return `<div class="needrow">
    <span class="needlabel" title="Click to set value" onclick="editNeed('${cs.id}','${key}')">${label}</span>
    <div class="barwrap"><div class="bar" style="width:${v}%;background:${color}"></div><span class="barval">${Math.round(v)}</span></div>

}

function attrRow(cs){
  return `<div class="attrs">` + ATTRS.map(([k,lab]) =>
    `<span class="a"><span>${lab.slice(0,4)}</span><input type="number" min="1" max="7" value="${cs.attr[k]}" onchange="setAttr('${cs.id}','${k}',this.value)" title="${lab}"></span>`

function condBadges(cs){
  return cs.conds.map(cd=>{

    const def = CONDS[cd.id];
    const lvl = def.lvls ? ` <span style="cursor:pointer" onclick="condLvl('${cs.id}','${cd.id}',-1)">−</span>${cd.lvl}<span style="cursor:pointer" onclick="condLvl('${cs.id}','${cd.id}',1)">+</span>` : '';
    return `<span class="badge b-cond" title="${condTitle(def, cd.lvl)}">${def.label}${lvl}<span class="x" onclick="rmCond('${cs.id}','${cd.id}')">×</span></span>`;

function condSelect(cs, c){
  const opts = Object.entries(CONDS)
    .filter(([k,d]) => (!!d.droid === !!c.droid) && !cs.conds.some(x=>x.id===k))

function condFxLines(cs){

function statusBadge(cs){

function invSection(cs){

}

// Weapons & Gear — a wear/degradation view over inventory rows typed Weapon or Gear (worn).
function gearSection(cs){
  const items = cs.inv.map((it,i)=>({it,i})).filter(x=>!x.it.auto && isDegradable(x.it.type));
  const rows = items.map(({it,i})=>{
    const w = clamp(it.wear||0,0,100), t = tierOf(w, WTIERS);
    const worn = /worn/i.test(it.type);
    const icon = worn ? '🧥' : '🗡';
    const nm = it.name || (worn?'(unnamed gear)':'(unnamed weapon)');
    return `<div class="gearitem">
      <div class="gearline"><span class="gearname">${icon} ${esc(nm)}</span>
        <span class="tierbadge" style="background:${t.color};color:#000">${t.name}</span></div>

function statusSection(cs, ex, t, o){

// Organic compounded-effects panel: stack each need's current-tier effect + conditions.
function organicEffects(cs, c, o){
  const needLines = NEED_KEYS.map(key=>{
    const tiers = NEEDS[key].tiers, t = tierOf(cs[key], tiers);
    if(tiers.indexOf(t)===0) return '';  // hide the satisfied/baseline tier
    return `<div class="fxneed"><span class="fxtier" style="color:${t.color}">${NEEDS[key].label.split(' ')[0]} ${t.name}</span> — ${t.fx}</div>`;
  }).filter(Boolean).join('');
  const condLines = condFxLines(cs);
  const alerts =
    (o.dead?`<b class="lb">☠ Wound threshold exceeded — dying/dead without immediate medical aid.</b><br>`:'') +
    (o.uncon&&!o.dead?`<b class="lw">💫 Strain threshold exceeded — unconscious until strain recovers.</b><br>`:'') +
    (o.over>0?`<b class="lw">⚖ Encumbered +${o.over}: needs drain ${Math.round(o.over*ENC_DRAIN_PER_PT*100)}% faster; RAW: add ${o.over} Setback to Brawn/Agility checks.</b><br>`:'');
  const body = needLines || `<span class="fxnone">No active need effects — all needs satisfied.</span>`;
  return `<div class="exwrap">
    ${alerts?`<div class="fx">${alerts.replace(/<br>$/,'')}</div>`:''}
    <div class="fx fxstack">${body}${condLines?`<div class="fxneed condstack">${condLines}</div>`:''}</div>
    ${talliesRow(cs)}
  </div>`;
}

      <span class="gi">🥤 <b>${cs.canteen}</b>/${OZ_PER_CANTEEN}oz <button class="mini" onclick="refill('${cs.id}')">refill</button></span>
      <span class="gi">🍞 <input type="number" min="0" step="0.5" value="${cs.rationsStock}" onchange="setStock('${cs.id}','rationsStock',this.value)" title="Rations carried"></span>
      <span class="gi">🍪 <input type="number" min="0" value="${cs.snacks}" onchange="setStock('${cs.id}','snacks',this.value)" title="Snacks carried"></span>
      <span class="gi">💉 <input type="number" min="0" value="${cs.stims}" onchange="setStock('${cs.id}','stims',this.value)" title="Stimpacks carried"> <button class="mini" onclick="useStim('${cs.id}')">use</button> <span title="Used today / safe limit">${cs.stimsToday}/${STIM.maxHeals}</span></span>
      <span class="gi" title="Encumbrance threshold = Brawn + 5 (auto; editable)">⚖ thresh <input type="number" min="0" value="${cs.encThresh}" onchange="setThresh('${cs.id}','encThresh',this.value)"></span>
      ${c.fs?`<span class="gi">✨ Force <input type="number" min="0" max="8" value="${cs.force}" onchange="setForce('${cs.id}',this.value)" title="Committed Force points (0–8)"></span>`:''}
    </div>
    ${invSection(cs)}
    ${gearSection(cs)}
    ${organicEffects(cs, c, {dead, uncon, over})}`;
}

function droidCard(cs, c, div){
  const ex = exhaustion(cs), t = tierOf(ex, DTIERS);
  const disabled = cs.strain>=cs.st && cs.st>0;
  const wrecked  = cs.wounds>cs.wt && cs.wt>0;
  const over = overload(cs);
  const badges =
    (cs.charge>=100 ? `<span class="badge b-off">🔋 SHUTDOWN</span> ` : '') +
    (over>0 ? `<span class="badge b-enc">⚖ over +${over}</span>` : '') +
    condBadges(cs);
  div.className = 'card droidcard'+(wrecked?' dead':disabled?' uncon':'');
  div.innerHTML = `
    ${portraitSection(cs,c)}
    <div class="cardhead">
      <div><span class="cname">${c.name.split(' ')[0]}</span> 🤖 ${wrecked?'☠':disabled?'💫':''}
        <div class="cmeta">${c.species} · ${c.h} · ${c.build} · 1 pack ≈ ${c.packHrs} hrs light operation</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">
        <select onchange="setAct('${cs.id}',this.value)" title="Current activity">
          ${Object.entries(ACTS).map(([k,a])=>`<option value="${k}" ${cs.activity===k?'selected':''}>${a.dLabel}</option>`).join('')}
        </select>
        ${condSelect(cs,c)}
      </div>
    </div>
    <div class="trait">${c.trait}</div>
    ${badges ? `<div style="margin-bottom:6px">${badges}</div>` : ''}
    ${customCondForm(cs)}
    ${attrRow(cs)}
    ${needRow(cs,'charge','🔋 Charge',
      `<button class="mini droid" onclick="swapPack('${cs.id}')">swap pack</button><button class="mini droid" onclick="rechargeAll('${cs.id}')">⚡ recharge</button>`)}
    ${needRow(cs,'maint','🔧 Wear',
      `<button class="mini droid" onclick="tuneUp('${cs.id}')">tune-up</button><button class="mini droid" onclick="overhaul('${cs.id}')">overhaul</button>`)}
    <div class="gearrow">
      <span class="gi">🔋 charged <input type="number" min="0" value="${cs.packsCharged}" onchange="setStock('${cs.id}','packsCharged',this.value)" title="Charged spare packs"></span>
      <span class="gi">🪫 depleted <input type="number" min="0" value="${cs.packsDepleted}" onchange="setStock('${cs.id}','packsDepleted',this.value)" title="Depleted packs"></span>
      <span class="gi" title="Encumbrance threshold = Brawn + 5 (auto; editable)">⚖ thresh <input type="number" min="0" value="${cs.encThresh}" onchange="setThresh('${cs.id}','encThresh',this.value)"></span>
    </div>
    ${invSection(cs)}
    ${gearSection(cs)}
    ${statusSection(cs, ex, t, {dead:wrecked, uncon:disabled, over})}`;
}

function render(){
  document.getElementById('clock').textContent = clockStr();
  const envSel = document.getElementById('envSel');
  if(envSel.value !== S.env) envSel.value = S.env;   // keep the dropdown honest after reset/load
  renderChips();
  const loc=document.getElementById('locIn'), dst=document.getElementById('destIn'), eta=document.getElementById('etaIn');
  if(document.activeElement!==loc) loc.value = S.location;
  if(document.activeElement!==dst) dst.value = S.travelDest;
  if(document.activeElement!==eta) eta.value = S.travelEta;
  document.getElementById('etaNote').textContent =
    S.travelDest && S.travelEta>0 ? `→ arriving ${S.travelDest} in ${fmtDur(S.travelEta)}` : '';
  const amb=document.getElementById('ambience');
  amb.style.display = SCENE_IMG_OK ? 'block' : 'none';
  if(SCENE_IMG_OK){
    document.getElementById('ambCap').textContent = `📍 ${S.location || 'Unknown location'}`;
    document.getElementById('ambEnv').textContent = `🌍 ${ENVS[S.env].label}`;
  }
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    syncInv(cs);
    const c = cfg(cs.id);
    const div = document.createElement('div');
    (c.droid ? droidCard : organicCard)(cs, c, div);
    wrap.appendChild(div);
  }
  renderShip();
  scheduleSync();   // push any local change to the live room (no-op when solo/applying)
}

function renderShip(){
  const el = document.getElementById('ship');
  if(!el || !S.ship) return;
  const sh = S.ship;
  const fpct = sh.fuel/SHIP.fuelCap*100;
  const fCol = fpct>50?'var(--good)':fpct>25?'var(--warn)':fpct>10?'var(--bad)':'var(--crit)';
  const burn = SHIP_ACTS[sh.activity].tph;
  const endurance = burn>0 ? ` · ~${(sh.fuel/burn).toFixed(1)} hrs (${(sh.fuel/burn/24).toFixed(1)} days) at current burn` : ' · no burn while docked';

  const spdBonus = overcharged('engines')?SHIP_ENERGY_BONUS.engines.speed:0;
  const hdlBonus = overcharged('engines')?SHIP_ENERGY_BONUS.engines.handling:0;
  const statBar = [['Silhouette',SHIP.silhouette,0],['Speed',SHIP.speed,spdBonus],['Armor',SHIP.armor,0],['Handling',SHIP.handling,hdlBonus],['Hard Points',SHIP.hardpoints,0]]
    .map(([l,v,b])=>`<div class="stat"><div class="sv"${b?' style="color:var(--gold)"':''}>${v+b}${b?`<span class="sbonus">+${b}</span>`:''}</div><div class="sl">${l}</div></div>`).join('');

  ).join('');

  const holdRows = hold => sh[hold].map((it,i)=>`<tr>
    <td><input value="${esc(it.name)}" placeholder="item" onchange="setCargo('${hold}',${i},'name',this.value)"></td>
    <td>${typeSelect(it.type, `setCargo('${hold}',${i},'type',this.value)`, 82)}</td>
    <td><input type="number" min="0" step="0.5" value="${it.qty}" onchange="setCargo('${hold}',${i},'qty',this.value)"></td>
    <td><input type="number" min="0" step="0.05" value="${it.wt}" onchange="setCargo('${hold}',${i},'wt',this.value)"></td>
    <td class="tot">${((it.qty||0)*(it.wt||0)).toFixed(2)}</td>

  const smugWt = holdWeight('smuggle'), smugOver = Math.max(0, Math.ceil(smugWt) - SHIP.smuggleCap);

  el.innerHTML = `<div class="shipwrap">
    <div class="shipportrait" id="shipPortrait"><img src="img/ship.jpg" alt="${SHIP.name}"
         onerror="if(!this.dataset.p){this.dataset.p=1;this.src='img/ship.png'}else{this.closest('#shipPortrait').style.display='none'}"></div>
    <div class="shiphead">
      <div>
        <div class="stitle">${SHIP.name}</div>

      <div class="spanel"><h3>🛡 Defense (shield dice by arc)</h3>

      </div>

    <div class="fuelpanel">
      <h3 style="font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">⛽ Fuel — ${sh.fuel} / ${SHIP.fuelCap} tons${endurance}</h3>

      </div>
      ${sh.fuelLog.length?`<div class="fuellog">${sh.fuelLog.map(l=>`<p><b>${l.t}</b> · ${l.m}</p>`).join('')}</div>`:''}

    <div class="shipsec"><h2>🔩 System Condition &amp; Energy <span class="reserve" title="Unallocated energy — reroute it into any system">⚡ Reserve ${sh.reserve}</span> <button class="mini" style="vertical-align:middle" onclick="resetEnergy()" title="Reset every system to the default energy draw, reserve empty">↺ balance</button></h2><div class="sysgrid">${sysCards}</div></div>

        ${smugOver>0?`<div class="cfx" style="color:var(--bad);margin:6px 0">⚠ Compartment overloaded by ${smugOver} — a bulging false floor invites discovery (GM may grant searchers Boost dice on Perception).</div>`:''}

    <div class="shipsec"><h2>🧑‍🚀 Crew Stations</h2><div class="crewgrid">${crewRows}</div></div>
    <datalist id="crewNames">${CHARS.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist>
  </div>`;
}

function renderChips(){
  const el = document.getElementById('viewChips');
  const allOn = CHARS.every(c=>S.visible[c.id]);
  el.innerHTML =
    `<button class="chip ${allOn?'on':''}" onclick="viewAll()">👥 All</button>` +
    CHARS.map(c=>`<button class="chip ${S.visible[c.id]?'on':''}" onclick="toggleView('${c.id}')">${c.name.split(' ')[0]}</button>`).join('');
}
function toggleView(id){ S.visible[id]=!S.visible[id]; render(); }
function viewAll(){
  const allOn = CHARS.every(c=>S.visible[c.id]);
  CHARS.forEach(c=>S.visible[c.id]=!allOn);
  render();
}

function setAct(id,v){
  const cs = st(id);
  if(cs.status){  // switching activity interrupts any timed status (keeps what was already gained)
    const label = STATUSES[cs.status.kind].label.replace(/^\S+ /,'').toLowerCase();
    cancelStatus(id, true);
    logMsg(`✖ ${cfg(id).name} stops ${label} — now ${ACTS[v].label.replace(/^\S+ /,'').toLowerCase()}.`);
  }
  cs.activity = v;
  render();
}
function setEnv(v){ S.env=v; logMsg(`🌍 Environment is now ${ENVS[v].label}.`); render(); }
/* party-wide controls: act on every visible character */
function partySetAct(v){
  if(!v) return;
  const names = [];
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    if(cs.status) cancelStatus(cs.id, true);
    cs.activity = v;
    names.push(cfg(cs.id).name.split(' ')[0]);
  }
  if(names.length) logMsg(`👥 Party activity: ${ACTS[v].label} — ${names.join(', ')}.`);
  render();
}
function partyAddCond(v){
  if(!v) return;
  const def = CONDS[v], names = [];
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    if(!!def.droid !== !!cfg(cs.id).droid) continue;    // organic conds skip droids & vice versa
    if(cs.conds.some(x=>x.id===v)) continue;
    cs.conds.push(def.lvls ? {id:v, lvl:1} : {id:v});
    names.push(cfg(cs.id).name.split(' ')[0]);
  }
  logMsg(names.length ? `${def.label} — applied to ${names.join(', ')}.` : `${def.label}: no eligible visible characters.`, 'lw');
  render();
}
function setThresh(id,k,v){ st(id)[k]=parseInt(v)||0; render(); }
function setStock(id,k,v){ st(id)[k]=Math.max(0,parseFloat(v)||0); render(); }
function adj(id,k,d){ const cs=st(id); cs[k]=Math.max(0,cs[k]+d); render(); }
function editNeed(id,key){
  const cs=st(id);
  const v=prompt(`Set ${key} (0 = satisfied, 100 = critical) for ${cfg(id).name}:`, Math.round(cs[key]));
  if(v!==null && !isNaN(+v)){ cs[key]=clamp(+v,0,100); render(); }
}
function editWear(id,i){
  const cs=st(id), it=cs.inv[i]; if(!it) return;
  const v=prompt(`Set wear (0 = pristine, 100 = broken) for ${it.name||'this item'}:`, Math.round(it.wear||0));
  if(v!==null && !isNaN(+v)){ it.wear=clamp(+v,0,100); render(); }
}

function logMsg(msg, cls){
  S.log.unshift({t:clockStr(), m:msg, c:cls||''});
  S.log = S.log.slice(0,100);
  rebuildLog();
  scheduleSync();   // log-only changes (notes, etc.) don't run render(); push them to the room
}
function rebuildLog(){
  document.getElementById('logEntries').innerHTML =
    (S.log||[]).map(l=>`<p class="${l.c}"><b>${l.t}</b> · ${l.m}</p>`).join('');
}
function addNote(){   // freeform player/GM note, timestamped at the current game time
  const inp = document.getElementById('noteIn');
  const text = (inp.value||'').trim();
  if(!text) return;
  inp.value='';
  logMsg('📝 '+esc(text), 'ln');
  inp.focus();
}
function clearLog(){ S.log=[]; rebuildLog(); scheduleSync(); }

function showTab(t){
  for(const [pane,btn] of [['tracker','tabT'],['ship','tabS'],['rules','tabR']]){
    document.getElementById(pane).style.display = t===pane?'block':'none';
    document.getElementById(btn).className      = t===pane?'on':'';
  }
}

/* ================================================================
   SAVE / LOAD
   ================================================================ */
function exportState(){
  const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `survival_day${dayNow()+1}.json`;
  a.click();
}
function importState(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => { try{ S = migrate(JSON.parse(e.target.result)); rebuildLog(); render(); }catch(err){ alert('Invalid save file.'); } };
  r.readAsText(f);
  inp.value='';
}
let resetArm = null;
function resetAll(){  // two-click confirm (no blocking popup — works in embedded browsers too)
  const btn = document.getElementById('resetBtn');
  if(resetArm){
    clearTimeout(resetArm); resetArm = null; btn.textContent = '↺ Reset';
    S = freshState(); rebuildLog();
    logMsg('↺ Tracker reset — Day 1, 00:00. All needs at 0, canteens full, droid packs recharged.');
    render();
  } else {
    btn.textContent = '⚠ Click again to confirm';
    resetArm = setTimeout(()=>{ resetArm = null; btn.textContent = '↺ Reset'; }, 4000);
  }
}

  <h2>🧼 Hygiene ladder</h2>
  <p>Reaches Diseased in <b>~30 days</b>. Grime is decelerating — you feel grubby within days, but genuine disease takes a month. Hygiene never threatens life on its own: its teeth are the 🤒 Sick stacks and social penalties — with one upside: filth makes you scarier (Coercion stays Boosted at every dirty tier).</p>
  ${ladderTable('hygiene')}

  <h2>😴 Sleep ladder (sleep debt — no death)</h2>
  <p>Mental and <i>time-awake-driven</i>: +${BASE.sleepAwake}/hr while conscious regardless of activity — one tier per full day awake. An all-nighter leaves you <b>Drowsy</b> (~25 h); <b>microsleeps begin around the 48 h mark</b> (Sleep-Deprived); <b>Delirious</b> at ~72 h; <b>Wrecked at ~96 h</b> — four days without sleep. A worn-out body accelerates the slide (Exhausted fatigue: +50%). Only proper sleep clears it; resting ticks it at half rate; the 30-min Force trance counts as 15 min of sleep.</p>
  ${ladderTable('sleep')}

  <h2>⚡ Fatigue ladder (physical — no death)</h2>
  <p>Physical and <i>activity-driven</i> — it climbs from doing, not time, and is managed all day with rest breaks. A full day's unbroken march leaves you Spent; sustained combat gets there in ~3 h.</p>
  ${ladderTable('rest')}
  <p><b>Coupling:</b> while <b>Sleep-Deprived (51+)</b>, fatigue accrues <b>×1.5</b> and rest recovers <b>25% less</b> — tired minds wear out bodies faster. At <b>Exhausted (76+) fatigue</b>, sleep debt accrues <b>+50%</b> — a worn-out body craves rest. Sleep clears both; rest chips both; meditation is how a Jedi buys alertness without a bunk.</p>

/* ================================================================
   MULTIPLAYER SYNC — live shared "room" via Firebase Realtime Database.
   Everyone in a room edits the same tracker and changes propagate in <1s.
   - Anyone can edit. Writes are per-character, so two people editing
     DIFFERENT characters don't clobber each other.
   - A live update that lands while you're typing in a field is held until
     you finish (focus guard), then applied.
   - Images are GM-set repo files (img/…) and are never synced.
   - 'visible' (the Show chips) stays local to each device — a view pref.
   Known limit: the shared log is last-write-wins, so two log entries created
   within the same moment can collide; character edits still merge cleanly.
   ================================================================ */
