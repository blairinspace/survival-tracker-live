/* ---- repairs: tune-up and overhaul are timed jobs done by a MECHANIC (the "repairs by" pick on the
   owner's card; the owner by default). The job is a status on the mechanic; when the clock runs it out the
   mechanic holds a pending cs.repair and rolls Mechanics (rollRepair → Dice tab). The roll decides the wear:
     tune-up   success −15 (−5 more per extra success) · failure nothing
     overhaul  success wear to 0 · failure half the wear comes off
     Despair   the work makes it worse (+10 wear)
   A droid's own service works the same way, with the droid on the bench and its "repairs by" pick rolling. ---- */
const REPAIR_DESPAIR_WEAR = 10, REPAIR_EXTRA_PER_SUCCESS = 5;
const mechOf = cs => (cs.mech && st(cs.mech)) || cs;                       // who does this card's repairs
function setMech(id, v){ const cs = st(id); cs.mech = (v && v!==id && st(v)) ? v : ''; render(); }
function repairTarget(holder, j){   // → the droid itself, or the item being worked on (in its owner's inventory)
  if(j.self) return { self:true, cs:holder };
  const owner = st(j.owner) || holder;
  const it = (owner.inv[j.i] && owner.inv[j.i].name===j.name) ? owner.inv[j.i] : owner.inv.find(x=>x && x.name===j.name);
  return it ? { it, owner } : null;
}
function repairTargetLabel(holder, j){
  const t = repairTarget(holder, j); if(!t) return j.name || 'an item';
  if(t.self) return cfg(holder.id).name;
  return (t.owner.id!==holder.id ? cfg(t.owner.id).name+"'s " : '') + (invLabel(t.it) || 'item');
}
// Difficulty by how far gone it is: Worn/Scuffed · Faulty · Failing/Broken → tune-up 1/2/3, overhaul 2/3/4
const repairDiff = (kind, wear) => (wear>=80 ? 3 : wear>=60 ? 2 : 1) + (kind==='overhaul' ? 1 : 0);
const hasTools = cs => cs.inv.some(it=>it && isCarried(it) && isTool(it)) || !!cfg(cs.id).droid;
function startRepair(id, i, kind){
  const owner = st(id), it = owner.inv[i], def = STATUSES[kind]; if(!it || !def) return;
  const mech = mechOf(owner);
  if(mech.status) cancelStatus(mech.id, true);
  if(mech.repair) logMsg(`🔧 ${cfg(mech.id).name} sets aside the unrolled job on ${esc(repairTargetLabel(mech, mech.repair))}.`, 'lw');
  delete mech.repair;
  mech.prevAct = mech.activity;
  mech.status = { kind, remain:def.dur, total:def.dur, item:{ owner:id, i, name:it.name||'' } };
  logMsg(`${def.label} — ${cfg(mech.id).name} starts work on ${esc(repairTargetLabel(mech, mech.status.item))} (${fmtDur(def.dur)}). Advance the clock, then roll Mechanics${kind==='overhaul'?'; needs a bench or kit (GM approves)':''}.`, 'ld');
  render();
}
// The job is finished: load the Mechanics check into the Dice tab. Rolling it applies the result.
function rollRepair(id){
  const holder = st(id), j = holder && holder.repair; if(!j) return;
  const t = repairTarget(holder, j);
  if(!t){ logMsg(`🔧 The item ${esc(j.name||'')} is no longer in the inventory — job dropped.`, 'lw'); delete holder.repair; render(); return; }
  const roller = j.self ? mechOf(holder) : holder, wear = t.self ? holder.maint : (t.it.wear||0);
  const s = skillState(roller, SKILLS.find(x=>x.k==='mechanics')), diff = repairDiff(j.kind, wear), noKit = !hasTools(roller);
  Object.assign(DICE_UI.pool, {p:s.p, a:s.a, b:0, k:noKit?1:0, d:diff, c:0, F:0});
  Object.assign(DICE_UI, { who:roller.id, ch:s.cv, rk:s.rank, label:`Mechanics — ${j.kind==='overhaul'?'overhaul':'tune-up'}`, weapon:null,
    repair:{ holder:id, note:`${j.kind==='overhaul'?'Overhaul':'Tune-up'} of ${repairTargetLabel(holder, j)} (wear ${Math.round(wear)}): ${DIFFS[diff][0]} difficulty${noKit?', +1 Setback for no tools carried':''}. Add Setback yourself for no bench or bad conditions.` } });
  tdLoad(roller, 'mechanics');
  document.getElementById('diceLabel').value = DICE_UI.label;
  showTab('dice');
}
function repairDrop(id){ const cs = st(id); if(cs && cs.repair){ logMsg(`🔧 ${cfg(id).name} drops the unrolled job on ${esc(repairTargetLabel(cs, cs.repair))} — no repair made.`, 'lw'); delete cs.repair; render(); } }
// Apply a rolled Mechanics result (r = tally of the dice) to the pending job. Returns the plain-text outcome.
function applyRepair(id, r){
  const holder = st(id), j = holder && holder.repair; if(!j) return '';
  const t = repairTarget(holder, j); delete holder.repair; if(!t) return '';
  const droid = !!t.self, before = droid ? holder.maint : (t.it.wear||0), ok = r.netS > 0;
  let after = before;
  if(j.kind==='overhaul') after = ok ? 0 : before/2;
  else if(ok) after = before - (droid ? TUNEUP : GEAR_TUNEUP) - REPAIR_EXTRA_PER_SUCCESS*(r.netS-1);
  if(r.y > 0) after += REPAIR_DESPAIR_WEAR;
  after = clamp(+after.toFixed(2), 0, 100);
  if(droid){ holder.maint = after; if(ok) holder.conds = holder.conds.filter(x=>x.id!=='corroded'); } else t.it.wear = after;
  const what = repairTargetLabel(holder, {...j}), job = j.kind==='overhaul' ? 'overhaul' : 'tune-up';
  const out = [`${ok?'Success':'Failed'} — ${job} of ${what}: wear ${Math.round(before)} → ${Math.round(after)}${!ok && j.kind!=='overhaul' ? ' (no improvement; the time is spent)' : ''}.`];
  if(r.y > 0) out.push(`Despair: the work made it worse (+${REPAIR_DESPAIR_WEAR} wear).`);
  if(r.x > 0) out.push(`Triumph: a Boost die on its next use.`);
  if(r.netA > 0) out.push(`${r.netA} Advantage to spend — time saved, or a Boost on the next repair.`);
  if(r.netA < 0) out.push(`${-r.netA} Threat — strain for the mechanic, or a spare part used up.`);
  return out.join(' ');
}
function tuneItem(id,i){ startRepair(id, i, 'tuneup'); }
function overhaulItem(id,i){ startRepair(id, i, 'overhaul'); }

/* ---- images ----
   Images are GM-set repo files (img/<id>.jpg|png, img/ship.*, img/scene.*), loaded
   directly in the card/scene/ship markup — see portraitSection() and renderShip().
   SCENE_IMG_OK is probed once at startup (probeScene). No in-app uploading. */
let SCENE_IMG_OK = false;
function probeScene(cb){
  const tryLoad = (src, next) => {
    const im = new Image();
    im.onload = () => { document.getElementById('ambImg').src = src; SCENE_IMG_OK = true; cb && cb(); };
    im.onerror = next;
    im.src = src;
  };
  tryLoad('img/scene.jpg', () => tryLoad('img/scene.png', () => { SCENE_IMG_OK = false; cb && cb(); }));
}
const hurtOpacity = cs => HURT_MAX_OPACITY * clamp(cs.wounds/(cs.wt||12), 0, 1);

/* ================================================================
   UI
   ================================================================ */
const needColor = v => v<26 ? 'var(--good)' : v<51 ? 'var(--warn)' : v<76 ? 'var(--bad)' : 'var(--crit)';   // same breaks as the need ladders

function needRow(cs, key, label, extras, tier){
  const v = cs[key];
  const color = tier ? tier.color : needColor(v);
  const badge = tier ? ` <span class="tierbadge needtier" style="background:${color};color:#000">${tier.name}</span>` : '';
  return `<div class="needrow">
    <span class="needlabel" title="Click to set value" onclick="editNeed('${cs.id}','${key}')">${label}</span>
    <div class="barwrap"><div class="bar" style="width:${v}%;background:${color}"></div><span class="barval">${Math.round(v)}</span></div>
    ${extras||''}${badge}</div>`;
}


function condBadges(cs){
  return cs.conds.map(cd=>{
    if(cd.custom)
      return `<span class="badge b-cond" title="${esc(cd.fx||'custom condition')}">🏷 ${esc(cd.label)}<span class="x" onclick="rmCond('${cs.id}','${cd.id}')">×</span></span>`;
    const def = CONDS[cd.id];
    const lvl = def.lvls ? ` <span style="cursor:pointer" onclick="condLvl('${cs.id}','${cd.id}',-1)">−</span>${cd.lvl}<span style="cursor:pointer" onclick="condLvl('${cs.id}','${cd.id}',1)">+</span>` : '';
    const timer = def.decayHrs   // timed conditions count down to the next step, like the Stim bubble
      ? ` <span class="cdt" title="${def.lvls?'eases one level in':'wears off in'}">⏳${fmtDur(Math.max(0, def.decayHrs - (cd.hrs||0) - (cs.hourAcc||0)))}</span>` : '';
    return `<span class="badge b-cond" title="${condTitle(def, cd.lvl)}">${def.label}${lvl}${timer}<span class="x" onclick="rmCond('${cs.id}','${cd.id}')">×</span></span>`;
  }).join('');
}
function condSelect(cs, c){
  const opts = Object.entries(CONDS)
    .filter(([k,d]) => (!!d.droid === !!c.droid) && !cs.conds.some(x=>x.id===k))
    .map(([k,d]) => `<option value="${k}" title="${condTitle(d)}">${d.label}</option>`).join('');
  return `<select onchange="addCond('${cs.id}',this.value);this.value=''" title="Add a condition — hover an option for its effect"><option value="">＋ condition…</option>${opts}<option value="__custom" title="Invent a condition: name + effect text (shown on the badge, in the effects box and the log)">🏷 custom…</option></select>`;
}
function condFxLines(cs){
  return cs.conds.map(cd=>{
    if(cd.custom) return `<span class="condline">🏷 <b>${esc(cd.label)}</b>${cd.fx?` — ${esc(cd.fx)}`:''}</span>`;
    return `<span class="condline">${fxText(CONDS[cd.id], cd.lvl)}</span>`;
  }).join('<br>');
}

function statusBadge(cs){
  const pend = cs.repair ? `<span class="badge b-status" title="The work is done — roll Mechanics to see how it went">🔧 ${cs.repair.kind==='overhaul'?'Overhaul':'Tune-up'} of ${esc(repairTargetLabel(cs, cs.repair))} done <button class="mini atk" onclick="rollRepair('${cs.id}')">roll Mechanics</button><span class="x" onclick="repairDrop('${cs.id}')" title="Drop the job — no repair is made">✖</span></span> ` : '';
  if(!cs.status) return pend;
  const def = STATUSES[cs.status.kind];
  const tgt = cs.status.item ? `: ${esc(repairTargetLabel(cs, cs.status.item))}` : '';
  return pend + `<span class="badge b-status">${def.label}${tgt} — ${fmtDur(Math.max(0,cs.status.remain))} left<span class="x" onclick="cancelStatus('${cs.id}')" title="Cancel — return to normal">✖</span></span>`;
}

// The card's inventory: an encumbrance line, then three dropdowns — Weapons, Armor, Gear — listing what is
// CARRIED (ticked on the sheet, where everything is edited). The Eq tick marks what is in hand or worn.
// Weapons and armor have a wear track (use or hit / tune-up / overhaul) while equipped; gear has none.
function invSection(cs){
  const id = cs.id, w = invWeight(cs), over = overload(cs), eff = effThresh(cs), pb = packBonus(cs);
  const carried = cs.inv.map((it,i)=>({it,i})).filter(x=>isCarried(x.it)).sort(byLabel(invLabel));   // A–Z by what the card calls it
  const eqBox = (it,i,tip) => it.auto ? '' : `<input type="checkbox" ${it.eq?'checked':''} onchange="invSet('${id}',${i},'eq',this.checked)" title="Equipped — ${tip}">`;
  const nameCell = it => `<span class="${it.auto?'auto':''}" title="${esc(it.alias && it.alias!==it.name ? it.name : '')}">${esc(invLabel(it)||'(unnamed)')}</span>${(+it.qty||0)!==1 && !it.auto ? ` <span style="color:var(--dim)">×${+it.qty||0}</span>` : ''}`;
  const sect = (flag, icon, label, list, body, empty) => {
    const nEq = list.filter(x=>isEquipped(x.it)).length;
    return `<details class="inv" ${cs[flag]?'open':''} ontoggle="st('${id}').${flag}=this.open">
      <summary>${icon} ${label} <b>${list.length}</b>${nEq?` <span style="color:var(--gold)">· ${nEq} equipped</span>`:''}</summary>
      ${list.length ? body : `<div class="gearempty">${empty}</div>`}</details>`;
  };
  const weps = carried.filter(x=>isWeapon(x.it)), arms = carried.filter(x=>isArmor(x.it)), tools = carried.filter(x=>isTool(x.it)), cons = carried.filter(x=>isCons(x.it));
  const gear = carried.filter(x=>!isWeapon(x.it) && !isArmor(x.it) && !isTool(x.it) && !isCons(x.it));
  const wearRow = (it,i,t,wr,useLabel,useTip,useCall) => `<div class="needrow">
        <span class="needlabel" title="Click to set wear" onclick="editWear('${id}',${i})">🔧 Wear</span>
        <div class="barwrap"><div class="bar" style="width:${wr}%;background:${t.color}"></div><span class="barval">${Math.round(wr)}</span></div>
        <button class="mini ${useCall==='rollAttack'?'atk':''}" onclick="${useCall}('${id}',${i})" title="${useTip}">${useLabel}</button>
        <button class="mini droid" onclick="tuneItem('${id}',${i})" title="Field tune-up — ${fmtDur(STATUSES.tuneup.dur)} of work, then a Mechanics check: −${GEAR_TUNEUP} wear on a success, −${REPAIR_EXTRA_PER_SUCCESS} more per extra success.">tune-up</button>
        <button class="mini droid" onclick="overhaulItem('${id}',${i})" title="Full overhaul — ${fmtDur(STATUSES.overhaul.dur)} of work, then a Mechanics check: wear back to 0 on a success, half of it on a failure.">overhaul</button>
      </div>
      <div class="fx gearfx">${t.fx}</div>`;
  const wepBody = weps.map(({it,i})=>{
    const ws = weaponState(cs, it), eq = isEquipped(it);
    const wr = clamp(it.wear||0,0,100), t = tierOf(wr, WTIERS);
    return `<div class="gearitem" style="${eq?'':'opacity:.7'}">
      <div class="gearline"><span class="gearname">${eqBox(it,i,'in hand or holstered ready. An equipped weapon shows its wear track and lends Defensive / Deflection to your defense.')} ${nameCell(it)}</span>
        ${eq ? `<span class="tierbadge" style="background:${t.color};color:#000">${t.name}</span>` : ''}</div>
      <div class="gearfx">${esc(ws.skill.n)} · damage ${ws.brn?`${ws.total} (Brawn +${ws.dam})`:ws.dam} · crit ${ws.crit||'—'} · ${ws.rng}${ws.q?` · ${esc(ws.q)}`:''}</div>
      ${eq ? wearRow(it, i, t, wr, '⚔ attack', `Roll an attack with this weapon: opens the Dice tab with its pool loaded (wear penalties included). Each attack rolled adds ${WEAR_PER_ATTACK} wear.`, 'rollAttack') : ''}
    </div>`;
  }).join('');
  const armBody = arms.map(({it,i})=>{
    const a = armorState(it), eq = isEquipped(it), wr = clamp(it.wear||0,0,100);
    const rating = (now, base, word) => now!==base && eq ? `${word} <b style="color:var(--warn)">${now}</b> <s>${base}</s>` : `${word} ${base}`;
    return `<div class="gearitem" style="${eq?'':'opacity:.7'}">
      <div class="gearline"><span class="gearname">${eqBox(it,i,'worn. Equipped armor adds its soak and defense, and shows its wear track.')} ${nameCell(it)}</span>
        ${eq ? `<span class="tierbadge" style="background:${a.tier.color};color:#000">${a.tier.name}</span>` : ''}</div>
      <div class="gearfx">${rating(a.def, a.baseDef, 'defense')} · ${rating(a.soak, a.baseSoak, 'soak')}</div>
      ${eq ? wearRow(it, i, a.tier, wr, 'hit', `The armor took a solid hit — adds ${WEAR_PER_USE} wear`, 'useItem') : ''}
    </div>`;
  }).join('');
  const toolBody = tools.map(({it,i})=>{
    const eq = isEquipped(it), wr = clamp(it.wear||0,0,100), t = tierOf(wr, WTIERS), rec = dbOf(it);
    return `<div class="gearitem" style="${eq?'':'opacity:.7'}">
      <div class="gearline"><span class="gearname">${eqBox(it,i,'in hand or on your belt, ready to use. An equipped tool shows its wear track.')} ${nameCell(it)}</span>
        ${eq ? `<span class="tierbadge" style="background:${t.color};color:#000">${t.name}</span>` : ''}</div>
      ${rec && (rec.f||rec.d) ? `<div class="gearfx">${esc(rec.f||rec.d)}</div>` : ''}
      ${eq ? wearRow(it, i, t, wr, 'use', `Use this tool hard (a repair job, a long climb) — adds ${WEAR_PER_USE} wear`, 'useItem') : ''}
    </div>`;
  }).join('');
  const listBody = list => `<table class="invtable"><tr><th>Item</th><th>Type</th><th>Qty</th><th>Enc</th></tr>` + list.map(({it})=>{
    const tot = (it.qty||0)*(it.wt||0);
    const totCell = isPack(it) ? `<td class="tot" style="color:var(--gold)" title="Capacity this pack grants (adds to threshold)">+${tot.toFixed(2)}</td>` : `<td class="tot">${tot.toFixed(2)}</td>`;
    return `<tr><td><span class="${it.auto?'auto':''}" title="${esc(it.alias && it.alias!==it.name ? it.name : '')}">${esc(invLabel(it)||'(unnamed)')}</span></td>
      <td><span class="auto">${esc(it.type||'—')}</span></td><td>${+it.qty||0}</td>${totCell}</tr>`;
  }).join('') + `</table>`;
  const gearBody = listBody(gear), consBody = listBody(cons);
  const nCarried = carried.filter(x=>!x.it.auto).length;
  return `<details class="inv invall" ${cs.allInvOpen?'open':''} ontoggle="st('${id}').allInvOpen=this.open">
    <summary>🎒 Inventory <b>${nCarried}</b><span class="encsum" title="Encumbrance carried / threshold">⚖ Enc <b style="color:${over>0?'var(--bad)':'var(--text)'}">${w.toFixed(1)}</b> / ${eff||'—'}${pb?` <span style="color:var(--gold)" title="${cs.encThresh} body + ${pb} from packs">(${cs.encThresh}+${pb} 🎒)</span>`:''}</span></summary>
    <div class="encline" style="margin-top:4px;border-top:none;padding-top:0"><span title="Who does the tune-ups and overhauls started from this card. They are busy for the job, then roll Mechanics for the result.">🔧 repairs by <select onchange="setMech('${id}',this.value)">${S.chars.map(x=>`<option value="${x.id===id?'':x.id}" ${(cs.mech||'')===(x.id===id?'':x.id)?'selected':''}>${esc(cfg(x.id).name)}${x.id===id?' (self)':''}</option>`).join('')}</select></span></div>
    ${sect('gearOpen', '🗡', 'Weapons', weps, wepBody, 'No weapons carried.')}
    ${sect('armorOpen', '🛡', 'Armor', arms, armBody, 'No armor carried.')}
    ${sect('toolsOpen', '🔧', 'Tools', tools, toolBody, 'No tools carried.')}
    ${sect('consOpen', '🍞', 'Consumables', cons, consBody, 'No snacks, rations or meals carried.')}
    ${sect('invOpen', '🎒', 'Gear', gear, gearBody, 'No gear carried.')}
  </details>`;
}

/* Portraits are GM-set repo files at img/<id>.jpg (or .png). If neither exists the
   whole portrait block hides itself, so missing images never leave a broken frame. */
function portraitSection(cs, c){
  return `<div class="portrait">
    <img src="img/${cs.id}.jpg" alt="${esc(c.name)}"
         onerror="if(!this.dataset.p){this.dataset.p=1;this.src='img/${cs.id}.png'}else{this.closest('.portrait').style.display='none'}">
    <div class="hurt" style="opacity:${hurtOpacity(cs).toFixed(3)}"></div>
  </div>`;
}

function talliesRow(cs){
  const c = cfg(cs.id), mods = strainMods(cs, c), eff = effStrainThresh(cs, c);
  const sum = mods.reduce((a,[,m])=>a+m, 0);
  const effTag = mods.length && cs.st>0
    ? ` <span class="steff" title="${esc(mods.map(([n,m])=>`${n} ${m>0?'+':''}${m}`).join(' · '))}">${sum>0?'+':''}${sum} → <b>${eff}</b></span>` : '';
  return `<div class="tallies">
      <span class="strain">Strain <b>${cs.strain}</b> / <span title="Strain threshold (base) — edit it on the Sheets tab">${cs.st}</span>${effTag}</span>
      <button class="mini" onclick="adj('${cs.id}','strain',-1)">−</button><button class="mini" onclick="adj('${cs.id}','strain',1)">+</button>
      <span class="wounds">Wounds <b>${cs.wounds}</b> / <span title="Wound threshold — edit it on the Sheets tab">${cs.wt}</span></span>
      <button class="mini" onclick="adj('${cs.id}','wounds',-1)">−</button><button class="mini" onclick="adj('${cs.id}','wounds',1)">+</button>
    </div>`;
}

// Droid degradation panel (organics use organicEffects instead)
function statusSection(cs, ex, t, o){
  const condLines = condFxLines(cs);
  return `<div class="exwrap">
    <div class="needrow">
      <span class="needlabel">Degrad.</span>
      <div class="barwrap exbar"><div class="bar" style="width:${ex}%;background:${t.color}"></div><span class="barval">${Math.round(ex)}</span></div>
      <span class="tierbadge" style="background:${t.color};color:#000">${t.name}</span>
    </div>
    <div class="fx">${o.dead?`<b class="lb">☠ Wound threshold exceeded — critical damage; needs major repairs.</b><br>`:''}${o.uncon&&!o.dead?`<b class="lw">💫 Strain threshold exceeded — disabled until strain is relieved.</b><br>`:''}${o.over>0?`<b class="lw">⚖ Encumbered +${o.over}: needs drain ${Math.round(o.over*ENC_DRAIN_PER_PT*100)}% faster; RAW: add ${o.over} Setback to Agility checks.</b><br>`:''}${t.fx}${condLines?`<br>${condLines}`:''}</div>
    ${talliesRow(cs)}
  </div>`;

// Organic compounded-effects panel: stack each need's current-tier effect + conditions.
function organicEffects(cs, c, o){
  const needLines = NEED_KEYS.map(key=>{
    const tiers = NEEDS[key].tiers, t = tierOf(cs[key], tiers);
    if(tiers.indexOf(t)===0) return '';  // hide the satisfied/baseline tier
    return `<div class="fxneed"><span class="fxtier" style="color:${t.color}">${NEEDS[key].label.split(' ')[0]} ${t.name}</span> — ${t.fx}</div>`;
  }).filter(Boolean).join('');
  const stimLine = cs.stimHrs>0
    ? `<span class="condline">💉 <b>Stim</b> (${fmtDur(cs.stimHrs)} left): fatigue accrues at <b>×${STIM.fatigueMult}</b> and strain threshold is <b>+${STIM.stMod}</b> while the stimulant lasts; −${STIM.fatigue} fatigue was applied on injection. When it ends the headroom goes too: 💥 Crash ${clamp(cs.stimsToday,1,STIM.crashMaxLvl)}/${STIM.crashMaxLvl} (+${STIM.crashFatigue*clamp(cs.stimsToday,1,STIM.crashMaxLvl)} fatigue back).</span>` : '';
  const condLines = [stimLine, condFxLines(cs)].filter(Boolean).join('<br>');
  const alerts =
    (o.dead?`<b class="lb">☠ Wound threshold exceeded — dying/dead without immediate medical aid.</b><br>`:'') +
    (o.uncon&&!o.dead?`<b class="lw">💫 Strain threshold exceeded — unconscious until strain recovers.</b><br>`:'') +
    (o.over>0?`<b class="lw">⚖ Encumbered +${o.over}: needs drain ${Math.round(o.over*ENC_DRAIN_PER_PT*100)}% faster; RAW: add ${o.over} Setback to Brawn/Agility checks.</b><br>`:'');
  const body = needLines || `<span class="fxnone">No active need effects — all needs satisfied.</span>`;
  return `<div class="exwrap">
    ${alerts?`<div class="fx">${alerts.replace(/<br>$/,'')}</div>`:''}
    <div class="fx fxstack">${body}${condLines?`<div class="fxneed condstack">${condLines}</div>`:''}</div>
    ${talliesRow(cs)}
  </div>`;
}

function organicCard(cs, c, div){

    ${portraitSection(cs,c)}

    ${needRow(cs,'hygiene','🧼 Hygiene',
      `<button class="mini" onclick="startStatus('${cs.id}','wash')" title="Full wash / bath — 30-min timed status, ample water (GM approves)">wash</button><button class="mini" onclick="wipeDown('${cs.id}')" title="Quick wipe-down / field clean — uses ${HYG.wipeOz} oz canteen water">wipe</button><button class="mini" onclick="cleanClothes('${cs.id}')" title="Change into clean clothing (GM approves)">👕</button>`, tier('hygiene'))}
    ${needRow(cs,'sleep','😴 Sleep',
      `<input type="number" min="0.5" max="16" step="0.5" value="${cs.sleepHrs}" style="width:50px" title="Hours to sleep (remembered; defaults to this character's nightly need)" onchange="setSleepHrs('${cs.id}',this.value)"><button class="mini" onclick="startSleep('${cs.id}')">sleep</button>`, tier('sleep'))}

      `<button class="mini" onclick="startStatus('${cs.id}','rest15')">15m</button><button class="mini" onclick="startStatus('${cs.id}','rest30')">30m</button>`+
      (isFS(cs)?`<button class="mini force" onclick="startStatus('${cs.id}','med15')">🧘15</button><button class="mini force" onclick="startStatus('${cs.id}','med30')">🧘30</button>`:''), tier('rest'))}
    <div class="gearrow">
      <span class="gi">🥤 <b>${cs.canteen}</b>/${OZ_PER_CANTEEN}oz <button class="mini" onclick="refill('${cs.id}')">refill</button></span>
      <span class="gi">💉 <b title="Stimpacks carried — the Stimpack rows in the inventory; change the quantity on the Sheets tab">${stockOf(cs,'Stim')}</b> <button class="mini" onclick="useStim('${cs.id}')">use</button> <span title="Doses in the current ${STIM.windowHrs} h window / safe limit">${cs.stimsToday}/${STIM.maxHeals}${cs.stimsToday>0?` (resets in ${fmtDur(stimResetIn(cs))})`:''}</span></span>

    ${invSection(cs)}

}

function droidCard(cs, c, div){
  const ex = exhaustion(cs), t = tierOf(ex, DTIERS);
  const disabled = strainOut(cs, c);
  const wrecked  = cs.wounds>cs.wt && cs.wt>0;
  const over = overload(cs);
  const badges = statusBadge(cs) +
    (cs.charge>=100 ? `<span class="badge b-off">🔋 SHUTDOWN</span> ` : '') +
    (over>0 ? `<span class="badge b-enc">⚖ over +${over}</span>` : '') +
    condBadges(cs);
  div.className = 'card droidcard'+(wrecked?' dead':disabled?' uncon':'');
  div.innerHTML = `
    ${portraitSection(cs,c)}
    <div class="cardhead">
      <div><span class="cname">${c.name.split(' ')[0]}</span> 🤖 ${wrecked?'☠':disabled?'💫':''}
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">
        <select onchange="setAct('${cs.id}',this.value)" title="Current activity">
          ${Object.entries(ACTS).map(([k,a])=>`<option value="${k}" ${cs.activity===k?'selected':''}>${a.dLabel}</option>`).join('')}
        </select>
        ${condSelect(cs,c)}
      </div>
    </div>
    ${badges ? `<div style="margin-bottom:6px">${badges}</div>` : ''}
    ${customCondForm(cs)}
    ${needRow(cs,'charge','🔋 Charge',
      `<button class="mini droid" onclick="swapPack('${cs.id}')">swap pack</button><button class="mini droid" onclick="rechargeAll('${cs.id}')">⚡ recharge</button>`)}
    ${needRow(cs,'maint','🔧 Wear',
      `<button class="mini droid" onclick="tuneUp('${cs.id}')" title="Tune-up — ${fmtDur(DROID_REPAIR_HRS.tuneup)} on the bench, then a Mechanics check: −${TUNEUP} wear and corrosion cleaned on a success.">tune-up</button><button class="mini droid" onclick="overhaul('${cs.id}')" title="Full overhaul — ${fmtDur(DROID_REPAIR_HRS.overhaul)} on the bench, then a Mechanics check: wear back to 0 on a success, half of it on a failure.">overhaul</button>`)}
    <div class="gearrow">
      <span class="gi">🔋 charged <input type="number" min="0" value="${cs.packsCharged}" onchange="setStock('${cs.id}','packsCharged',this.value)" title="Charged spare packs"></span>
      <span class="gi">🪫 depleted <input type="number" min="0" value="${cs.packsDepleted}" onchange="setStock('${cs.id}','packsDepleted',this.value)" title="Depleted packs"></span>
    </div>
    ${cmdCardLine(cs)}
    ${invSection(cs)}
    ${statusSection(cs, ex, t, {dead:wrecked, uncon:disabled, over})}`;
}

function render(){
  document.getElementById('clock').textContent = clockStr();
  const envSel = document.getElementById('envSel');
  if(envSel.value !== S.env) envSel.value = S.env;   // keep the dropdown honest after reset/load
  renderChips();
  const loc=document.getElementById('locIn');
  if(document.activeElement!==loc) loc.value = S.location;
  renderCounters();
  renderObjectives();
  const amb=document.getElementById('ambience');
  amb.style.display = SCENE_IMG_OK ? 'block' : 'none';
  if(SCENE_IMG_OK){
    document.getElementById('ambCap').textContent = `📍 ${S.location || 'Unknown location'}`;
    document.getElementById('ambEnv').textContent = `🌍 ${ENVS[S.env].label}`;
  }
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  S.chars.forEach(syncInv);   // every character, not just the visible ones — encumbrance reads the auto rows
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    const c = cfg(cs.id);
    const div = document.createElement('div');
    (c.droid ? droidCard : organicCard)(cs, c, div);
    wrap.appendChild(div);
  }
  renderShip();
  renderItems();
  renderDestiny();
  renderSheet();
  renderTrees();
  scheduleSync();   // push any local change to the live room (no-op when solo/applying)
}

function setAct(id,v){
  const cs = st(id);
  if(cs.status){  // switching activity interrupts any timed status (keeps what was already gained)
    const label = plainLabel(STATUSES[cs.status.kind].label).toLowerCase();
    cancelStatus(id, true);
    logMsg(`✖ ${cfg(id).name} stops ${label} — now ${plainLabel(ACTS[v].label).toLowerCase()}.`);
  }
  cs.activity = v;
  render();
}
/* ---- countdowns: labelled timers that run down as the clock advances ---- */
function parseDur(text){   // "6" → 6 h · "90m" → 1.5 · "2d" → 48 · "1d 12h" → 36
  let hrs = 0, any = false;
  for(const m of String(text||'').toLowerCase().matchAll(/([\d.]+)\s*(d|h|m)?/g)){
    const n = parseFloat(m[1]); if(!Number.isFinite(n)) continue;
    hrs += m[2]==='d' ? n*24 : m[2]==='m' ? n/60 : n; any = true;
  }
  return any ? +hrs.toFixed(3) : 0;
}
function counterAdd(){
  const l = document.getElementById('cdLabel'), t = document.getElementById('cdTime');
  const hrs = clamp(parseDur(t.value), 0, 24*3650), label = (l.value||'').trim().slice(0,60) || 'Countdown';
  if(!(hrs>0)){ t.focus(); return; }
  S.counters.push({ id:randomId().slice(0,8), label, hrs, total:hrs });
  l.value = ''; t.value = '';
  logMsg(`⏳ Countdown started: <b>${esc(label)}</b> — ${fmtDur(hrs)}.`);
  render();
}
function counterDel(id){ S.counters = S.counters.filter(c=>c.id!==id); render(); }
function counterEdit(id){
  const c = S.counters.find(x=>x.id===id); if(!c) return;
  const v = prompt(`Time left for “${c.label}” (hours, or 90m / 6h / 2d):`, c.hrs);
  if(v===null) return;
  c.hrs = clamp(parseDur(v), 0, 24*3650); c.total = Math.max(c.total||0, c.hrs); render();
}
function renderCounters(){
  const el = document.getElementById('counters'); if(!el) return;
  el.innerHTML = (S.counters||[]).map(c=>{
    const done = !(c.hrs>0), pct = c.total>0 ? Math.round(100*(1-c.hrs/c.total)) : 100;
    return `<span class="cdchip ${done?'done':''}" style="background:linear-gradient(90deg,#1f3a5f ${pct}%,transparent ${pct}%)"><b>${esc(c.label)}</b>
      <span class="cdt" onclick="counterEdit('${c.id}')" title="Click to change the time left">${done ? '✔ done' : fmtDur(c.hrs)}</span>
      <button class="mini" onclick="counterDel('${c.id}')" title="Remove this countdown">✕</button></span>`;
  }).join('');
}
function setEnv(v){ S.env=v; logMsg(`🌍 Environment is now ${ENVS[v].label}.`); render(); }
/* party-wide controls: act on every visible character */
function partySetAct(v){
  if(!v) return;
  const names = [];
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    if(cs.status) cancelStatus(cs.id, true);
    cs.activity = v;
    names.push(cfg(cs.id).name.split(' ')[0]);
  }
  if(names.length) logMsg(`👥 Party activity: ${ACTS[v].label} — ${names.join(', ')}.`);
  render();
}
function partyAddCond(v){
  if(!v) return;
  const def = CONDS[v], names = [];
  for(const cs of S.chars){
    if(!S.visible[cs.id]) continue;
    if(!!def.droid !== !!cfg(cs.id).droid) continue;    // organic conds skip droids & vice versa
    if(cs.conds.some(x=>x.id===v)) continue;
    cs.conds.push(def.lvls ? {id:v, lvl:1} : {id:v});
    names.push(cfg(cs.id).name.split(' ')[0]);
  }
  logMsg(names.length ? `${def.label} — applied to ${names.join(', ')}.` : `${def.label}: no eligible visible characters.`, 'lw');
  render();
}
function setThresh(id,k,v){ st(id)[k]=parseInt(v)||0; render(); }
const WHOLE_STOCK = new Set(['packsCharged','packsDepleted']);
function setStock(id,k,v){ const n=Math.max(0,parseFloat(v)||0); st(id)[k]=WHOLE_STOCK.has(k)?Math.round(n):n; render(); }
function adj(id,k,d){ const cs=st(id); cs[k]=Math.max(0,cs[k]+d); render(); }
function editNeed(id,key){
  const cs=st(id);
  const v=prompt(`Set ${key} (0 = satisfied, 100 = critical) for ${cfg(id).name}:`, Math.round(cs[key]));
  if(v!==null && !isNaN(+v)){ cs[key]=clamp(+v,0,100); render(); }
}
function editWear(id,i){
  const cs=st(id), it=cs.inv[i]; if(!it) return;
  const v=prompt(`Set wear (0 = pristine, 100 = broken) for ${it.name||'this item'}:`, Math.round(it.wear||0));
  if(v!==null && !isNaN(+v)){ it.wear=clamp(+v,0,100); render(); }
}

function logMsg(msg, cls){
  if(!Array.isArray(S.log)) S.log=[];   // belt & braces — see migrate()
  S.log.unshift({t:clockStr(), m:msg, c:cls||''});
  S.log = S.log.slice(0, LOG_MAX);
  rebuildLog();
  scheduleSync();   // log-only changes (notes, etc.) don't run render(); push them to the room
}
const LOG_MAX = 500;   // entries kept: a whole session, so nothing rolls off before it is exported for the lore book
const LOG_UI = { open:false }; try{ LOG_UI.open = localStorage.getItem('st_log_open')==='1'; }catch(e){}
function logToggle(){ LOG_UI.open = !LOG_UI.open; try{ localStorage.setItem('st_log_open', LOG_UI.open?'1':'0'); }catch(e){} rebuildLog(); }
const LOG_CLASSES = new Set(['', 'lw', 'lb', 'lg', 'ld', 'lf', 'ln']);
function rebuildLog(){
  const box = document.getElementById('log'), title = document.getElementById('logTitle'), n = (S.log||[]).length;
  if(box) box.className = 'log' + (LOG_UI.open ? ' open' : '');
  if(title) title.textContent = `${LOG_UI.open?'▾':'▸'} Event log · ${n}${n>=LOG_MAX?' (full: oldest entries are dropping off — export)':''}`;
  document.getElementById('logEntries').innerHTML =
    (S.log||[]).map(l=>`<p class="${LOG_CLASSES.has(l.c)?l.c:''}"><b>${esc(l.t)}</b> · ${l.m}</p>`).join('');
}
function addNote(){   // freeform player/GM note, timestamped at the current game time
  const inp = document.getElementById('noteIn');
  const text = (inp.value||'').trim();
  if(!text) return;
  inp.value='';
  const by = CLOUD.player && CLOUD.player!=='Player' ? ` <span style="color:var(--dim);font-style:normal">— ${esc(CLOUD.player)}</span>` : '';
  logMsg('📝 '+esc(text)+by, 'ln');
  inp.focus();
}
function logText(){   // the whole log as plain text, oldest first, with the objectives as they stand
  const plain = h => String(h).replace(/<br\s*\/?>/gi, '\n    ').replace(/<[^>]*>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  const lines = (S.log||[]).slice().reverse().map(l=>`${l.t} · ${plain(l.m)}`);
  const obj = o => { const [d,n] = objProgress(o); return `  - [${o.st==='done'?'x':o.st==='failed'?'!':' '}] ${o.t}${n?` (${d}/${n})`:''}` + o.subs.map(x=>`\n      - [${x.d?'x':' '}] ${x.t}`).join(''); };
  const objs = Object.keys(OBJ_CATS).map(c=>{ const list = S.obj.filter(o=>o.cat===c); return list.length ? `${OBJ_CATS[c][0]}\n${list.map(obj).join('\n')}` : ''; }).filter(Boolean);
  return `Session log — exported at ${clockStr()}${S.location?` · ${S.location}`:''}\n(game time · entry; notes start with 📝)\n\n` + lines.join('\n') + (objs.length ? `\n\nObjectives as they stand\n${objs.join('\n')}` : '') + '\n';
}
function exportLog(){
  const blob = new Blob([logText()], {type:'text/plain'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `session_log_day${dayNow()+1}.txt`; a.click();
}
function clearLog(){ if(!confirm('Clear the whole event log? Export it first if you want it for the lore book.')) return; S.log=[]; logMsg('🧹 Event log cleared.'); }  // entry keeps the synced array non-empty (RTDB drops empty arrays)

let TAB = 'tracker';
function showTab(t){
  TAB = t;
  for(const [pane,btn] of [['tracker','tabT'],['sheet','tabC'],['ship','tabS'],['items','tabI'],['trees','tabTr'],['dice','tabD'],['lore','tabL'],['core','tabK'],['rules','tabR'],['gm','tabG']]){
    document.getElementById(pane).style.display = t===pane?'block':'none';
    document.getElementById(btn).className      = t===pane?'on':'';
  }
  if(t==='dice'){ renderDice(); renderFeed(); }
  if(t==='trees') renderTrees();
  if(t==='core') renderCore();
  if(t==='lore') loreLoad(renderLore);
  if(t==='gm') speciesLoad(renderSpecies);
}

const SKILL_GROUPS = ['General','Combat','Knowledge','Custom'];
const SKILL_RANK_MAX = 5;
const ATTR_TIPS = {
  br:'Brawn — strength and toughness. Sets soak, wound threshold and encumbrance; rolled for Athletics, Resilience, Brawl, Melee and Lightsaber.',

const SHEET_TEXT = ['species','career','specs','morS','morW'];
const SHEET_NUM  = { soakMod:[-10,30], defRMod:[-5,10], defMMod:[-5,10], fr:[0,10], xp:[0,99999], xpTotal:[0,99999], credits:[0,99999999], mor:[0,100], conf:[0,99] };
const SHEET_UI = { id:'', open:{ crate:true, weapons:true, armor:true, tools:true, cons:true, gear:true, tal:true, mor:true, cmd:true } };   // which inventory dropdowns are open — per device, remembered
try{ Object.assign(SHEET_UI.open, JSON.parse(localStorage.getItem('st_sheet_open')||'{}')); }catch(e){}
function sheetOpen(k, v){ if(SHEET_UI.open[k]===v) return; SHEET_UI.open[k] = v; try{ localStorage.setItem('st_sheet_open', JSON.stringify(SHEET_UI.open)); }catch(e){} }

const BIO_FIELDS = [['age','Age','e.g. 23'],['gender','Gender',''],['h','Height',`e.g. 5'11"`],['build','Build',''],['hair','Hair',''],['eyes','Eyes',''],['home','Homeworld',''],['feat','Notable features','scars, markings, cybernetics']];
function sheetBio(id, k, v){
  const sh = st(id).sheet; if(!BIO_FIELDS.some(f=>f[0]===k)) return;
  if(k==='build'){ if(!setBuild(cfg(id), v)) return; sh.bio.build = v; logMsg(`🧍 ${cfg(id).name}'s build set to ${v} — ${BUILDS[v].tip}`); }
  else sh.bio[k] = String(v).slice(0,60);
  render();
}
function sheetName(id, v){ const sh = st(id).sheet, c = cfg(id), was = c.name; sh.name = cleanName(v); setName(c, sh.name); if(c.name!==was) logMsg(`🪪 ${was} is now called ${c.name}.`); render(); }
/* What a build costs per day of light activity, worked out from the simulation's own rates so the
   figure on the sheet always matches what the Tracker does: water from c.waterOz, rations from the
   baseline hunger rate × the build's multiplier ÷ what one ration restores. */
function dailyNeeds(c){
  if(c.droid) return { pack:c.packHrs };
  const water = Math.round(c.waterOz * (c.mods.waterRate||1));
  return { water, canteens:water/OZ_PER_CANTEEN, rations:c.rationsDay };
}
function needsText(c){ const n = dailyNeeds(c); return c.droid ? `1 power pack ≈ ${n.pack} hrs light operation` : `${n.water} oz water (${n.canteens.toFixed(1)} canteens) and ${n.rations} ration${n.rations===1?'':'s'} a day`; }
function sheetSil(id, v){ st(id).sheet.sil = clamp(parseInt(v)||0, 0, 4); render(); }
function sheetFS(id, v){ const cs = st(id); cs.sheet.fs = +v ? 1 : 0; if(!cs.sheet.fs && cs.force) cs.force = 0; render(); }
function newSheet(c){
  setBuild(c, c.build0); setName(c, '');
  return { name:'', species:c.species||'', career:'', specs:'', morS:'', morW:'', mor:50, conf:0, dark:0, obl:[], duty:[], soakMod:0, defRMod:0, defMMod:0,
           fr:c.fs?1:0, xp:0, xpTotal:0, credits:0, sk:{}, cust:[], tr:{},
           bio:Object.fromEntries(BIO_FIELDS.map(([k])=>[k, k==='h' ? String(c.h||'') : k==='build' ? c.build0 : ''])), sil:c.sil===undefined ? 1 : c.sil };
}
function normSheet(cs, c){   // every field well-formed, whatever an old save or the room handed us
  const def = newSheet(c), sh = (cs.sheet && typeof cs.sheet==='object') ? cs.sheet : (cs.sheet = {});
  for(const k of SHEET_TEXT) if(typeof sh[k]!=='string') sh[k] = def[k];
  // soak and defense used to be typed-in totals; they are now derived (Brawn + equipped armor + bonus).
  // Carry an old total over as the bonus so nobody's number changes until they equip armor.
  if(sh.soak!==undefined && sh.soakMod===undefined) sh.soakMod = (+sh.soak||0) - ((cs.attr&&cs.attr.br)||0);
  if(sh.defR!==undefined && sh.defRMod===undefined) sh.defRMod = +sh.defR||0;
  if(sh.defM!==undefined && sh.defMMod===undefined) sh.defMMod = +sh.defM||0;
  delete sh.soak; delete sh.defR; delete sh.defM;
  for(const k in SHEET_NUM){ const n = Math.round(+sh[k]); sh[k] = Number.isFinite(n) && sh[k]!==undefined ? clamp(n, ...SHEET_NUM[k]) : def[k]; }
  if(!sh.sk || typeof sh.sk!=='object' || Array.isArray(sh.sk)) sh.sk = {};
  sh.cust = arrayify(sh.cust); if(!Array.isArray(sh.cust)) sh.cust = [];
  sh.cust = sh.cust.filter(x=>x && typeof x==='object' && x.id);
  for(const x of sh.cust){ if(typeof x.n!=='string') x.n=''; if(!ATTR_TIPS[x.ch]) x.ch='int'; }
  for(const k of ['obl','duty']){   // Obligation / Duty entries: { id, n type, v magnitude }
    sh[k] = arrayify(sh[k]); if(!Array.isArray(sh[k])) sh[k] = [];
    sh[k] = sh[k].filter(x=>x && typeof x==='object' && x.id);
    for(const x of sh[k]){ if(typeof x.n!=='string') x.n=''; x.v = clamp(Math.round(+x.v)||0, 0, 100); }
  }
  sh.dark = sh.dark ? 1 : 0; if(sh.mor < 30) sh.dark = 1;
  sh.name = cleanName(sh.name); setName(c, sh.name);
  if(!sh.bio || typeof sh.bio!=='object' || Array.isArray(sh.bio)) sh.bio = {};   // the short bio from the Character Creator
  for(const [k] of BIO_FIELDS) if(typeof sh.bio[k]!=='string') sh.bio[k] = k==='h' ? String(c.h||'') : '';
  if(!setBuild(c, sh.bio.build)){ sh.bio.build = c.build0; setBuild(c, c.build0); }   // the build drives water, hunger and pack life
  sh.sil = Number.isFinite(+sh.sil) && sh.sil!==undefined && sh.sil!==null ? clamp(Math.round(+sh.sil), 0, 4) : (c.sil===undefined ? 1 : c.sil);
  if(sh.fs!==undefined) sh.fs = +sh.fs ? 1 : 0;
  if(c.console) normCmd(sh);
  if(sh.cc && (typeof sh.cc!=='object' || Array.isArray(sh.cc))) delete sh.cc;   // Character Creator in progress
  if(sh.cc) for(const g of ['fc','fs','fp']) if(!sh.cc[g] || typeof sh.cc[g]!=='object') sh.cc[g] = {};
  if(!sh.tr || typeof sh.tr!=='object' || Array.isArray(sh.tr)) sh.tr = {};
  for(const k in sh.tr) if(!sh.tr[k] || typeof sh.tr[k]!=='object' || Array.isArray(sh.tr[k])) delete sh.tr[k];
  // committed Force dice are cs.force (the Tracker card's field) — one value for both tabs. A save from
  // before the Force rating existed may have more committed than the default rating: keep the commit.
  delete sh.frCommit;
  if(cs.force > sh.fr) sh.fr = Math.min(SHEET_NUM.fr[1], cs.force);
}
function skillList(cs){
  return SKILLS.concat(cs.sheet.cust.map(x=>({k:'x_'+x.id, n:x.n, ch:x.ch, g:'Custom', cust:x.id,
    tip:'Custom skill — for homebrew or skills from other books.'})));
}
function skillState(cs, sk){
  const o = cs.sheet.sk[sk.k] || {}, ch = (!sk.cust && ATTR_TIPS[o.ch]) ? o.ch : sk.ch;
  const rank = clamp(Math.round(+o.r)||0, 0, SKILL_RANK_MAX), cv = +(cs.attr||{})[ch]||0;
  return { rank, career:!!o.c, ch, cv, p:Math.min(cv, rank), a:Math.max(cv, rank)-Math.min(cv, rank) };
}
function sheetSkill(id, key, field, v){
  const cs = st(id), sk = skillList(cs).find(x=>x.k===key); if(!sk) return;
  const o = cs.sheet.sk[key] || (cs.sheet.sk[key] = {});
  if(field==='r'){ const r = clamp(parseInt(v)||0, 0, SKILL_RANK_MAX); if(r) o.r = r; else delete o.r; }
  if(field==='c'){ if(v) o.c = 1; else delete o.c; }
  if(field==='ch'){ if(ATTR_TIPS[v] && v!==sk.ch) o.ch = v; else delete o.ch; }
  if(!Object.keys(o).length) delete cs.sheet.sk[key];
  render();
}
function sheetSet(id, k, v){
  const sh = st(id).sheet;
  if(SHEET_TEXT.includes(k)) sh[k] = String(v).slice(0,120);
  else if(SHEET_NUM[k]) sh[k] = clamp(Math.round(parseFloat(v))||0, ...SHEET_NUM[k]);
  if(k==='mor') moralSync(sh);
  if(k==='fr' && st(id).force > forceCap(st(id))) setForce(id, sh.fr);   // lowering the rating releases the excess
  render();
}
function sheetStat(id, k, v){   // wounds / strain current values (thresholds go through setThresh)
  st(id)[k] = clamp(parseInt(v)||0, 0, 99); render();
}
function sheetAddSkill(id){ st(id).sheet.cust.push({id:randomId().slice(0,6), n:'', ch:'int'}); render(); }
function sheetCust(id, cid, k, v){
  const x = st(id).sheet.cust.find(y=>y.id===cid); if(!x) return;
  if(k==='n') x.n = String(v).slice(0,40);
  if(k==='ch' && ATTR_TIPS[v]) x.ch = v;
  render();
}
function sheetDelSkill(id, cid){
  const sh = st(id).sheet;
  sh.cust = sh.cust.filter(y=>y.id!==cid); delete sh.sk['x_'+cid]; render();
}
/* ---- inventory ⇄ Items database. Every inventory row (cs.inv) can link to a database record by
   name (row.ref): the catalog from the workbook, items-custom.js, or a homebrew item. The link gives
   the row its description and default stats; the row keeps its own editable copies.
     alias  what the Tracker card calls it ("Dad's blaster")      eq  1 = equipped
     weapon: sk dam crit rng q brn(1 = add Brawn)                  armor: def soak
   Rows are linked automatically by name (linkRow); anything that can't be matched is flagged on
   the sheet, where it can be pointed at a database item or given a new homebrew entry. ---- */
const WEAPON_RANGES = ['Engaged','Short','Medium','Long','Extreme'];
const COMBAT_SKILLS = SKILLS.filter(x=>x.g==='Combat');
const CAT_SKILL = { 'Lightsaber':'lightsaber', 'Gunnery':'gunnery', 'Melee':'melee', 'Brawl':'brawl', 'Mechanics':'melee',
  'Ranged (Heavy)':'ranged_heavy', 'Ranged (Light)':'ranged_light', 'Skulduggery / Ranged (Light or Heavy)':'ranged_light' };
// kit names that mean a database item under another name (lower-case → database name)
const DB_ALIASES = { 'lightsaber':'Basic Lightsaber', 'comlink':'Comlink (handheld)', 'armored clothing':'Armoured Clothing',
  'toolkit':'Tool Kit', 'field rations':'Field Ration Pack', 'rations':'Field Ration Pack', 'ration':'Field Ration Pack',
  'multi-tool':'Multitool', 'backpack':'Backpack', 'bd-1 battery packs':'BD-1 Battery Pack', 'power packs':'Droid Power Pack' };
let CAT_BY_NAME = null;
function dbFind(name){
  if(!CAT_BY_NAME){ CAT_BY_NAME = {}; for(const it of CATALOG){ const k=(it.n||'').toLowerCase(); if(!(k in CAT_BY_NAME)) CAT_BY_NAME[k]=it; } }
  let k = String(name||'').replace(/\s*\((worn|spares?)\)\s*$/i,'').trim().toLowerCase(); if(!k) return null;
  if(DB_ALIASES[k]) k = DB_ALIASES[k].toLowerCase();
  const hb = n => ((typeof S!=='undefined' && S && S.homebrew)||[]).find(h=>h && (h.n||'').toLowerCase()===n);
  return CAT_BY_NAME[k] || hb(k) || (k.endsWith('s') ? (CAT_BY_NAME[k.slice(0,-1)] || hb(k.slice(0,-1))) : null) || null;
}
const dbOf = it => (it && it.ref && dbFind(it.ref)) || null;
const invLabel = it => it.alias || it.name || '';
// display order only (the stored order never changes): A–Z, unnamed rows last so a new blank row stays at the bottom
const byLabel = key => (a, b) => { const x = (key(a.it)||'').trim(), y = (key(b.it)||'').trim(); return (!x)-(!y) || x.localeCompare(y, undefined, {sensitivity:'base', numeric:true}) || a.i-b.i; };
const isWeapon = it => (it.type||'').toLowerCase()==='weapon';
const numOr = (...vs) => { for(const v of vs){ if(v!==undefined && v!==null && v!=='' && Number.isFinite(+v) && Math.abs(+v)<1000) return +v; } return 0; };
function dbDesc(rec){   // plain text — callers escape
  if(!rec) return '';
  return [rec.f, rec.d, rec.req?`Requires: ${rec.req}`:'', rec.hp?`${rec.hp} hard point${rec.hp===1?'':'s'}`:'',
    rec.p!=null?`${Number(rec.p).toLocaleString('en-US')} cr`:(rec.pt?`${rec.pt} cr`:''), rec.ra!=null?`rarity ${rec.ra}`:'', rec.r?'restricted':''].filter(Boolean).join(' · ');
}
// Copy a database record's stats onto a row. force = the player picked this record just now, so it
// overwrites; otherwise only blanks are filled (an auto-link must never clobber what was typed).
function fillFromDb(row, rec, force){
  const set = (k, v) => { if(v!==undefined && v!==null && v!=='' && (force || row[k]===undefined)) row[k] = v; };
  if(force || !row.type) row.type = invTypeFor(rec);
  if(force || row.wt===undefined) row.wt = numOr(rec.e);
  if(rec.sk){
    set('sk', CAT_SKILL[rec.sk] || 'ranged_light'); set('brn', (rec.sk==='Melee'||rec.sk==='Brawl') ? 1 : 0);
    set('dam', numOr(rec.dam)); set('crit', numOr(rec.crit)); if(WEAPON_RANGES.includes(rec.rng)) set('rng', rec.rng); set('q', rec.q ? String(rec.q) : (force ? '' : undefined));
  }
  if(rec.g==='Armour'){ set('def', numOr(rec.def)); set('soak', numOr(rec.soak)); }
}
function linkRow(row){
  if(!row || row.auto || row.ref || !row.name) return;
  const rec = dbFind(row.name); if(!rec) return;
  const typed = String(row.name).replace(/\s*\((worn|spares?)\)\s*$/i,'').trim();
  if(typed.toLowerCase()!==rec.n.toLowerCase() && !row.alias) row.alias = typed;   // keep what the table calls it
  row.name = rec.n; row.ref = rec.n;
  fillFromDb(row, rec, false);
}
function weaponState(cs, it){
  const cat = dbOf(it) || {}, catSk = CAT_SKILL[cat.sk];
  const guess = /saber/i.test(it.name) ? 'lightsaber' : /rifle|carbine|bow|launcher/i.test(it.name) ? 'ranged_heavy'
    : /knife|blade|sword|staff|vibro|axe|spear|truncheon|dagger/i.test(it.name) ? 'melee' : 'ranged_light';
  const sk = COMBAT_SKILLS.some(x=>x.k===it.sk) ? it.sk : (catSk || guess);
  const brn = it.brn!==undefined ? !!it.brn : (cat.sk ? (cat.sk==='Melee'||cat.sk==='Brawl') : (sk==='melee'||sk==='brawl'));
  const dam = numOr(it.dam, cat.dam), crit = numOr(it.crit, cat.crit);
  const rng = WEAPON_RANGES.includes(it.rng) ? it.rng : WEAPON_RANGES.includes(cat.rng) ? cat.rng : (sk.startsWith('ranged')||sk==='gunnery' ? 'Medium' : 'Engaged');
  const q = typeof it.q==='string' ? it.q : (cat.q||'');
  return { sk, brn, dam, crit, rng, q, total: dam + (brn ? (cs.attr.br||0) : 0), skill: SKILLS.find(x=>x.k===sk) };
}
function armorState(it){   // def / soak are what it protects with right now; base* are the ratings on the sheet
  const cat = dbOf(it) || {}, baseDef = numOr(it.def, cat.def), baseSoak = numOr(it.soak, cat.soak);
  const t = tierOf(clamp(it.wear||0, 0, 100), ATIERS);
  return { baseDef, baseSoak, tier:t, def: Math.max(0, baseDef - t.defLoss), soak: Math.max(0, baseSoak - t.soakLoss) };
}
const qualN = (q, name) => { const m = String(q||'').match(new RegExp('\\b'+name+'\\s*(\\d+)', 'i')); return m ? +m[1] : 0; };

// + Deflection (ranged) / Defensive (melee) from equipped weapons, + bonus.
function combatStats(cs){
  const sh = cs.sheet, eq = cs.inv.filter(isEquipped);
  const armors = eq.filter(isArmor).map(armorState), weps = eq.filter(isWeapon).map(it=>weaponState(cs, it));
  const aSoak = armors.reduce((a,x)=>a+x.soak, 0), aDef = armors.reduce((a,x)=>Math.max(a,x.def), 0);
  const defl = weps.reduce((a,w)=>Math.max(a, qualN(w.q,'Deflection')), 0), dfns = weps.reduce((a,w)=>Math.max(a, qualN(w.q,'Defensive')), 0);
  const br = cs.attr.br||0;
  return { br, aSoak, aDef, defl, dfns,
    soak: Math.max(0, br + aSoak + sh.soakMod),
    defR: Math.max(0, aDef + defl + sh.defRMod), defM: Math.max(0, aDef + dfns + sh.defMMod) };
}
function invSet(id, i, k, v){
  const it = st(id).inv[i]; if(!it) return;
  if(it.auto){ if(k==='wt') it.wt = Math.max(0, parseFloat(v)||0); render(); return; }   // canteen / droid packs: only the weight is editable
  if(k==='carry'){ if(v) delete it.carry; else { it.carry = 0; it.eq = 0; } }   // stowing an item unequips it
  else if(k==='eq') it.eq = (v && isCarried(it)) ? 1 : 0;
  else if(k==='brn') it.brn = v ? 1 : 0;
  else if(k==='db'){            // the Item box: a database name links the row (and imports its stats); anything else is a free-typed name
    const name = String(v).trim().slice(0,80), rec = dbFind(name);
    if(rec){ it.name = rec.n; it.ref = rec.n; fillFromDb(it, rec, true); }
    else { it.name = name; delete it.ref; }
  }
  else if(k==='alias'){ const a = String(v).trim().slice(0,60); if(a) it.alias = a; else delete it.alias; }
  else if(k==='q') it.q = String(v).slice(0,160);
  else if(k==='type') it.type = String(v).slice(0,30);
  else if(k==='sk'){ if(COMBAT_SKILLS.some(x=>x.k===v)) it.sk = v; }
  else if(k==='rng'){ if(WEAPON_RANGES.includes(v)) it.rng = v; }
  else if(k==='qty' || k==='wt') it[k] = Math.max(0, +(parseFloat(v)||0).toFixed(2));
  else if(['dam','crit','def','soak'].includes(k)) it[k] = clamp(Math.round(parseFloat(v))||0, -5, 99);
  render();
}
function rowFromDb(rec){ const row = { name:rec.n, ref:rec.n, qty:1 }; fillFromDb(row, rec, true); return row; }
// "add" box under each table: a database name brings the item in with its stats; other text makes an unlinked row of that table's type
function invAdd(id, type, text){

function invCreateEntry(id, i){

// Load an attack into the Dice tab: the weapon's skill pool, Average difficulty, and the weapon

function rollAttack(id, i){

function sheetPick(id){ SHEET_UI.id = id; render(); }
// Load a skill into the Dice tab: Ability/Proficiency from the sheet, Average difficulty to start from.
/* ---- talents on the dice. rules.js gives some talents dice effects (d[]): add Boost, ignore Setback,
   upgrade the pool, downgrade or shorten the difficulty — always, or under a condition. For one skill:
     auto   Boost dice that always apply (already in the pool the sheet shows)
     ign    Setback dice the roll ignores (they only matter once the GM adds Setback)
     opts   situational effects: tick boxes on the Dice tab, off until the player says they apply */
const TD_WORD = { b:'Boost', k:'Setback ignored', up:'upgrade', dn:'difficulty downgrade', df:'fewer Difficulty' };
function tdSkillKeys(name){
  if(name==='*') return SKILLS.map(x=>x.k);
  if(name==='combat') return SKILLS.filter(x=>x.g==='Combat').map(x=>x.k);
  if(name==='Knowledge') return SKILLS.filter(x=>x.g==='Knowledge').map(x=>x.k);
  if(name==='Piloting') return ['pilot_planet','pilot_space'];
  if(name==='Ranged') return ['ranged_light','ranged_heavy'];
  const k = skillKeyByName(name); return k ? [k] : [];
}
function talentDice(cs, key){
  const out = { key, auto:0, ign:0, notes:[], opts:[] };
  if(!cs || !RULES_DB.trees.length) return out;
  for(const r of talentRanks(cs)){
    const fx = (RULES_DB.talents[r.n]||{}).d; if(!fx) continue;
    fx.forEach((e, i)=>{
      if(!e.sk.some(n=>tdSkillKeys(n).includes(key))) return;
      const amt = e.n * (e.r ? r.rank : 1), who = r.n + (r.rank>1 && e.r ? ` ×${r.rank}` : '');
      if(e.c) out.opts.push({ id:r.n+'#'+i, n:r.n, t:e.t, amt, c:e.c });
      else if(e.t==='b'){ out.auto += amt; out.notes.push(`${who}: +${amt} Boost`); }
      else if(e.t==='k'){ out.ign += amt; out.notes.push(`${who}: ignores ${amt} Setback`); }
    });
  }
  return out;
}
function tdLoad(cs, key){   // attach a skill's talents to the pool being built; the always-on Boost goes straight in
  const td = talentDice(cs, key);
  DICE_UI.tal = (td.auto || td.ign || td.opts.length) ? { ...td, on:{}, undo:{} } : null;
  if(td.auto) DICE_UI.pool.b = clamp(DICE_UI.pool.b + td.auto, 0, POOL_MAX);
}
function tdToggle(id, on){   // a situational talent ticked or unticked on the Dice tab
  const T = DICE_UI.tal, o = T && T.opts.find(x=>x.id===id), p = DICE_UI.pool; if(!o || !!T.on[id]===!!on) return;
  if(on){
    const done = [];
    for(let i=0;i<o.amt;i++){
      if(o.t==='b'){ if(p.b<POOL_MAX){ p.b++; done.push('b'); } }
      else if(o.t==='k'){ T.ign++; done.push('k'); }
      else if(o.t==='up'){ if(p.a>0){ p.a--; p.p++; done.push('conv'); } else { p.a++; done.push('add'); } }
      else if(o.t==='dn'){ if(p.c>0){ p.c--; p.d++; done.push('dn'); } }
      else if(o.t==='df'){ if(p.d>0){ p.d--; done.push('df'); } }
    }
    T.on[id] = 1; T.undo[id] = done;
  } else {
    for(const step of (T.undo[id]||[]).slice().reverse()){
      if(step==='b') p.b = Math.max(0, p.b-1);
      if(step==='k') T.ign = Math.max(0, T.ign-1);
      if(step==='conv' && p.p>0){ p.p--; p.a++; }
      if(step==='add') p.a = Math.max(0, p.a-1);
      if(step==='dn' && p.d>0){ p.d--; p.c++; }
      if(step==='df') p.d++;
    }
    delete T.on[id]; delete T.undo[id];
  }
  renderDice();
}
function tdSummary(ignored){   // one line for the roll feed: which talents shaped this roll
  const T = DICE_UI.tal; if(!T) return '';
  const parts = T.notes.filter(n=>/Boost/.test(n));
  if(ignored) parts.push(`${ignored} Setback ignored` + (T.notes.filter(n=>/Setback/.test(n)).length ? ` (${T.notes.filter(n=>/Setback/.test(n)).map(n=>n.split(':')[0]).join(', ')})` : ''));
  for(const o of T.opts) if(T.on[o.id]) parts.push(`${o.n}: ${o.t==='b'?'+'+o.amt+' Boost':o.t==='k'?'ignores '+o.amt+' Setback':o.amt+' '+TD_WORD[o.t]}`);
  return parts.join(' · ').slice(0, 240);
}
function rollSkill(id, key){
  const cs = st(id), sk = skillList(cs).find(x=>x.k===key); if(!sk) return;
  const s = skillState(cs, sk);
  Object.assign(DICE_UI.pool, {p:s.p, a:s.a, b:0, k:0, d:2, c:0, F:0});
  Object.assign(DICE_UI, { who:id, ch:s.cv, rk:s.rank, label:sk.n, weapon:null, repair:null });
  tdLoad(cs, key);
  document.getElementById('diceLabel').value = sk.n;
  showTab('dice');
}
function rollForce(id){
  const cs = st(id), n = Math.max(0, cs.sheet.fr - (cs.force||0)); if(!n) return;
  Object.assign(DICE_UI.pool, {p:0, a:0, b:0, k:0, d:0, c:0, F:n});
  Object.assign(DICE_UI, { who:id, label:'Force power', weapon:null, repair:null });
  document.getElementById('diceLabel').value = 'Force power';
  showTab('dice');
}
const rankCostTip = (s) => s.rank>=SKILL_RANK_MAX ? 'Rank 5 is the maximum.'
  : `Next rank (${s.rank+1}) costs ${5*(s.rank+1) + (s.career?0:5)} XP — 5 × the new rank${s.career?'':', +5 because this is not a career skill'}. Ranks are bought one at a time; no skill above rank 2 at character creation.`;
const skillCost = s => 5*(s.rank+1) + (s.career ? 0 : 5);   // next rank: 5 × new rank, +5 if not a career skill
function skillBuy(id, key){
  const cs = st(id), sk = skillList(cs).find(x=>x.k===key); if(!sk) return false;
  const s = skillState(cs, sk), cost = skillCost(s);
  if(s.rank >= SKILL_RANK_MAX || cs.sheet.xp < cost) return false;
  (cs.sheet.sk[key] || (cs.sheet.sk[key] = {})).r = s.rank + 1; cs.sheet.xp -= cost;
  render(); return true;
}

/* ================================================================
   TREES — specialization talent trees, signature abilities and Force
   powers (rules.js, generated from the rules vault by tools/import-rules.py).
   What a character owns lives in cs.sheet.tr:
     tr[treeId] = { _:1, _x:XP paid for the specialization, nodeId:1, ... }
   (the "_" marker keeps a specialization with no talents yet alive on the
   wire — the room drops empty objects). A specialization must be added
   before its talents can be bought; a Force power or signature ability is
   added by buying its top box. A box can be bought when it is in the top
   row (or is the top box) or is joined to one already owned.
   ================================================================ */
const RULES_DB = typeof RULES!=='undefined' ? RULES : { trees:[], talents:{} };
RULES_DB.species = RULES_DB.species || []; RULES_DB.careers = RULES_DB.careers || []; RULES_DB.morality = RULES_DB.morality || [];
const TREE_BY = {};
for(const t of RULES_DB.trees){ TREE_BY[t.id] = t; t.by = {}; for(const n of t.nodes) t.by[n.id] = n; }
const TREE_KINDS = { spec:'Specializations', sig:'Signature abilities', power:'Force powers' };
const TREE_ROW_H = 76;
const TREES_UI = { who:'', q:'', kind:'spec', book:'', career:'', id:'' };
const normName = s => String(s||'').trim().toLowerCase();

function treeOwned(cs, tid){ return cs.sheet.tr[tid] || null; }
function treeNodes(cs, tid){ const o = treeOwned(cs, tid), t = TREE_BY[tid]; return o && t ? t.nodes.filter(n=>o[n.id]) : []; }
function ownedSpecs(cs){ return Object.keys(cs.sheet.tr).filter(k=>TREE_BY[k] && TREE_BY[k].k==='spec'); }
function specInCareer(cs, t){ return t.career==='Universal' || !normName(cs.sheet.career) || normName(cs.sheet.career)===normName(t.career); }
function specCost(cs, t){   // a new specialization: 10 × how many you will then have, +10 outside your career; the first is free
  const n = ownedSpecs(cs).length + 1;
  return n===1 ? 0 : 10*n + (specInCareer(cs, t) ? 0 : 10);
}
function nodeState(cs, t, n){   // own · can (buyable now) · lock, with the reason it is locked
  const o = treeOwned(cs, t.id);
  if(o && o[n.id]) return { s:'own' };
  if(t.k==='spec' && !o) return { s:'lock', why:'Add this specialization to the character first.' };
  if(t.k==='power' && n.root && cs.sheet.fr < t.fr) return { s:'lock', why:`Needs Force rating ${t.fr}.` };
  if(!n.root && !(o && n.to.some(x=>o[x]))) return { s:'lock', why:'Not connected to anything you own yet.' };
  return { s:'can' };
}
/* Talents that change the sheet's numbers the moment they are bought, and change them back on a refund:
   Grit +1 strain threshold · Toughened +2 wound threshold · Enduring +1 soak · Force Rating +1 · Dedication +1 to one
   characteristic (the player picks; 6 is the ceiling). The owned box remembers what it did — 2 = applied,
   or the characteristic key for Dedication — so a refund only undoes what was really applied (a box bought
   before this existed holds 1 and is left alone). */
const AUTO_TALENTS = { 'Grit':'+1 strain threshold', 'Toughened':'+2 wound threshold', 'Force Rating':'+1 Force rating', 'Dedication':'+1 to a characteristic of your choice (max 6)', 'Enduring':'+1 soak', 'Sixth Sense':'+1 ranged defense', 'Superior Reflexes':'+1 melee defense', 'Secrets of the Jedi':'Lightsaber becomes a career skill', 'Insight':'Perception and Discipline become career skills', 'Well Rounded':'two skills of your choice become career skills' };
function pickAttr(cs, want){   // which characteristic Dedication raises: given, or asked
  const open = ATTRS.filter(([k])=>cs.attr[k] < 6);
  if(!open.length){ alert('Every characteristic is already 6 — Dedication has nothing to raise.'); return null; }
  let v = want;
  if(v===undefined) v = prompt(`Dedication: raise which characteristic by 1?\n${open.map(([k,n])=>`${n} (${cs.attr[k]})`).join(' · ')}`, open[0][1]);
  if(v===null || v===undefined) return null;
  const q = normName(v), hit = q && open.find(([k,n])=>k===q || normName(n).startsWith(q));
  if(!hit){ alert(`“${v}” is not a characteristic that can be raised.`); return null; }
  return hit[0];
}
function talentApply(cs, name, opt){   // returns the marker to store on the box, or null to cancel the purchase
  if(name==='Grit'){ cs.st = (+cs.st||0) + 1; return 2; }
  if(name==='Toughened'){ cs.wt = (+cs.wt||0) + 2; return 2; }
  if(name==='Enduring'){ cs.sheet.soakMod = Math.min(SHEET_NUM.soakMod[1], cs.sheet.soakMod + 1); return 2; }
  if(name==='Sixth Sense'){ cs.sheet.defRMod = Math.min(SHEET_NUM.defRMod[1], cs.sheet.defRMod + 1); return 2; }
  if(name==='Superior Reflexes'){ cs.sheet.defMMod = Math.min(SHEET_NUM.defMMod[1], cs.sheet.defMMod + 1); return 2; }
  if(name==='Secrets of the Jedi'){ skCareer(cs.sheet, 'lightsaber', true); return 1; }          // career skills stay if the talent is refunded
  if(name==='Insight'){ skCareer(cs.sheet, 'perception', true); skCareer(cs.sheet, 'discipline', true); return 1; }
  if(name==='Well Rounded'){   // two skills of the player's choice; skipping the question still buys the talent
    const v = opt!==undefined ? opt : prompt('Well Rounded: which two skills become career skills? (two names, separated by a comma — or leave blank and tick them on the sheet)', '');
    for(const n of String(v||'').split(',').slice(0,2)){ const q = normName(n), hit = q && SKILLS.find(x=>normName(x.n)===q || skillNorm(x.n)===skillNorm(n) || normName(x.n).startsWith(q)); if(hit) skCareer(cs.sheet, hit.k, true); }
    return 1;
  }
  if(name==='Force Rating'){ if(cs.sheet.fr >= SHEET_NUM.fr[1]) return 1; cs.sheet.fr++; return 2; }
  if(name==='Dedication'){
    const k = pickAttr(cs, opt); if(!k) return null;
    cs.attr[k]++; if(k==='br') cs.encThresh = cs.attr.br + 5;
    return k;
  }
  return 1;
}
function talentUnapply(cs, name, mark){
  if(mark===1 || mark===true || !mark) return;
  if(name==='Grit') cs.st = Math.max(0, (+cs.st||0) - 1);
  if(name==='Toughened') cs.wt = Math.max(0, (+cs.wt||0) - 2);
  if(name==='Enduring') cs.sheet.soakMod = Math.max(SHEET_NUM.soakMod[0], cs.sheet.soakMod - 1);
  if(name==='Sixth Sense') cs.sheet.defRMod = Math.max(SHEET_NUM.defRMod[0], cs.sheet.defRMod - 1);
  if(name==='Superior Reflexes') cs.sheet.defMMod = Math.max(SHEET_NUM.defMMod[0], cs.sheet.defMMod - 1);
  if(name==='Force Rating'){ cs.sheet.fr = Math.max(0, cs.sheet.fr - 1); if(cs.force!==undefined && cs.force > forceCap(cs)) cs.force = forceCap(cs); }
  if(name==='Dedication' && cs.attr[mark]!==undefined){ cs.attr[mark] = Math.max(1, cs.attr[mark] - 1); if(mark==='br') cs.encThresh = cs.attr.br + 5; }
}
function treeBuy(id, tid, nid, opt){
  const cs = st(id), t = TREE_BY[tid], n = t && t.by[nid]; if(!cs || !n) return false;
  const stt = nodeState(cs, t, n);
  if(stt.s==='own') return false;
  if(stt.s==='lock'){ alert(stt.why); return false; }
  if(cs.sheet.xp < n.c){ alert(`${cfg(id).name} has ${cs.sheet.xp} XP available — ${n.n} costs ${n.c}.`); return false; }
  const mark = t.k==='spec' ? talentApply(cs, n.n, opt) : 1; if(mark===null) return false;   // Dedication cancelled
  const o = cs.sheet.tr[tid] || (cs.sheet.tr[tid] = { _:1, _x:0 });
  o[nid] = mark; cs.sheet.xp -= n.c;
  render(); return true;
}
function treeCanRefund(cs, t, nid){   // everything else owned must still be reachable without this box
  const o = treeOwned(cs, t.id); if(!o || !o[nid]) return false;
  const own = t.nodes.filter(n=>o[n.id] && n.id!==nid), seen = new Set(own.filter(n=>n.root).map(n=>n.id)), queue = [...seen];
  while(queue.length) for(const x of t.by[queue.pop()].to) if(o[x] && x!==nid && !seen.has(x)){ seen.add(x); queue.push(x); }
  return seen.size===own.length;
}
function treeRefund(id, tid, nid){
  const cs = st(id), t = TREE_BY[tid], n = t && t.by[nid]; if(!cs || !n) return false;
  if(!treeCanRefund(cs, t, nid)){ alert(`Something further down the tree depends on ${n.n} — refund that first.`); return false; }
  const o = cs.sheet.tr[tid];
  if(t.k==='spec') talentUnapply(cs, n.n, o[nid]);
  delete o[nid]; cs.sheet.xp = Math.min(SHEET_NUM.xp[1], cs.sheet.xp + n.c);
  if(t.k!=='spec' && !treeNodes(cs, tid).length) delete cs.sheet.tr[tid];
  render(); return true;
}
function treeClick(id, tid, nid){
  const cs = st(id), t = TREE_BY[tid], n = t && t.by[nid]; if(!cs || !n) return;
  if((treeOwned(cs, tid)||{})[nid]){ if(confirm(`Refund ${n.n} and get ${n.c} XP back?`)) treeRefund(id, tid, nid); }
  else treeBuy(id, tid, nid);
}
function specAdd(id, tid, free){

  if(cs.sheet.xp < cost){ alert(`${cfg(id).name} has ${cs.sheet.xp} XP available — ${t.n} costs ${cost}.`); return false; }
  cs.sheet.tr[tid] = { _:1, _x:cost }; cs.sheet.xp -= cost;
  const list = cs.sheet.specs.split(',').map(x=>x.trim()).filter(Boolean);   // keep the sheet's Specializations box in step
  if(!list.some(x=>normName(x)===normName(t.n))) cs.sheet.specs = list.concat(t.n).join(', ').slice(0,120);
  for(const name of t.skills){ const k = skillKeyByName(name); if(k) (cs.sheet.sk[k] || (cs.sheet.sk[k] = {})).c = 1; }   // its career skills

function specRemove(id, tid){

/* ================================================================
   COMMAND CONSOLE — for a droid that takes orders (roster flag console:true).
   From the Defender Droid operation manual: authorized users in priority
   order, orders with a priority and an urgency flag (1 is highest, blank
   means 1), macro commands, an override, and knowledge modules.
   Lives in cs.sheet.cmd, so it syncs with the room and saves with the sheet:
     users[]  { id, c roster id | n typed name, pr 1 principal, ov 1 override set }   (list order = priority)
     orders[] { id, t text, p, u, by user id, s active|done|ignored, ov 1 override, at clock }
     macros[] { id, n name, ph activation phrase, st[] steps }
     mods[]   knowledge module names
   ================================================================ */
const CMD_MODS = ['Human Physiology and Needs','Food Preparation','Survival Skills','Language Translation (Basic)','Threat Analysis','Childhood Education (Age 12)'];
const CMD_USERS = [['bode',0],['kata',1],['cal',0],['merrin',0],['tann',0],['gibbs',0],['pike',0]];   // priority order; Kata is the principal
const cmdId = () => randomId().slice(0,6);
function normCmd(sh){
  let m = sh.cmd;
  if(!m || typeof m!=='object' || Array.isArray(m)){   // first time: the protector package as shipped
    m = sh.cmd = { v:1, users:CMD_USERS.filter(([c])=>cfg(c)).map(([c,pr])=>({ id:cmdId(), c, pr })), orders:[], mods:CMD_MODS.slice(),
      macros:[{ id:cmdId(), n:'Secure', ph:'Secure The Room', st:['Check Room for Assailants','Check Room for Observation Devices','Report'] }] };
  }
  for(const k of ['users','orders','macros','mods']){ m[k] = arrayify(m[k]); if(!Array.isArray(m[k])) m[k] = []; }
  m.users = m.users.filter(x=>x && typeof x==='object' && x.id); m.orders = m.orders.filter(x=>x && typeof x==='object' && x.id);
  m.macros = m.macros.filter(x=>x && typeof x==='object' && x.id); m.mods = m.mods.filter(x=>typeof x==='string' && x);
  for(const x of m.macros){ x.st = arrayify(x.st); if(!Array.isArray(x.st)) x.st = []; x.st = x.st.filter(y=>typeof y==='string' && y); }
  for(const o of m.orders){ o.p = clamp(Math.round(+o.p)||1, 1, 9); o.u = clamp(Math.round(+o.u)||1, 1, 9); if(!['active','done','ignored'].includes(o.s)) o.s = 'active'; }

      `<tr><td colspan="4">${others.length ? `<select onchange="cmdUserAdd('${id}',this.value);this.value=''"><option value="">＋ authorize a crew member…</option>${others.map(x=>`<option value="${x.id}">${esc(cfg(x.id).name)}</option>`).join('')}</select> ` : ''}<input type="text" placeholder="or type a name" style="width:130px" onchange="cmdUserAdd('${id}',this.value);this.value=''"></td></tr></table></div>

/* ================================================================
   MORALITY · CONFLICT · OBLIGATION · DUTY — on each sheet.
   Morality 0–100 (start 50) with the session's Conflict; at session end
   roll 1d10 − Conflict and add it to Morality. Below 30 the character is a
   dark side Force user and stays one until Morality climbs above 70.
   Obligation and Duty are lists of { id, n type, v magnitude } per
   character; the session-start d100 is rolled against the party total.
   ================================================================ */
function moralSync(sh){ if(sh.mor < 30) sh.dark = 1; else if(sh.mor > 70) sh.dark = 0; }
function moralBand(sh){
  if(sh.mor > 70) return { name:'Light side paragon', color:'var(--accent)', fx:'+1 Light Destiny point each session' + (sh.mor>90 ? ' · strain threshold +2' : sh.mor>80 ? ' · strain threshold +1' : '') };
  if(sh.dark) return { name:'Dark side Force user', color:'var(--bad)',
    fx:'uses ● dark side results freely (○ costs strain and a Destiny flip) · +1 Dark Destiny each session' + (sh.mor<10 ? ' · strain threshold −2, wound threshold +2' : sh.mor<20 ? ' · strain threshold −1, wound threshold +1' : '') + (sh.mor>=30 ? ' · stays dark until Morality passes 70' : '') };
  return { name:'Light side Force user', color:'var(--dim)', fx:'using ● dark side results costs strain, Conflict and a Destiny flip' };
}
/* emotional strength / weakness: picked from the rulebook's paired table (rules.js), or typed via "other" */
function moralPick(id, k, v){
  const sh = st(id).sheet, key = k==='s' ? 'morS' : 'morW';
  if(v==='__other'){ const t = prompt(`Type the emotional ${k==='s'?'strength':'weakness'}:`, sh[key]); if(t===null){ render(); return; } v = t; }
  sh[key] = String(v).slice(0,120);
  const pair = k==='s' && RULES_DB.morality.find(m=>m.s===v);
  if(pair && (!sh.morW || RULES_DB.morality.some(m=>m.w===sh.morW))) sh.morW = pair.w;   // a strength brings its paired weakness along
  render();
}
function moralRoll(id, forced){   // d100 on the table; 97–00 means roll twice, so just roll again
  let roll, row; do { roll = forced || rollInt(100)+1; row = RULES_DB.morality.find(m=>roll>=m.lo && roll<=m.hi); forced = 0; } while(!row && RULES_DB.morality.length);
  if(!row) return null;
  const sh = st(id).sheet; sh.morS = row.s; sh.morW = row.w; render(); return row;
}
function moralPickHtml(cs){
  const sh = cs.sheet, id = cs.id, T = RULES_DB.morality;
  const sel = (k, cur, lab, tip) => { const names = T.map(m=>m[k]), custom = cur && !names.includes(cur);
    return `<label title="${esc(tip)}">${lab}<select onchange="moralPick('${id}','${k}',this.value)"><option value="">— choose —</option>` +
      names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('') + (custom ? `<option selected>${esc(cur)}</option>` : '') + `<option value="__other">other (type it)…</option></select></label>`; };
  const sRow = T.find(m=>m.s===sh.morS), wRow = T.find(m=>m.w===sh.morW);
  return `<div class="shead">
      ${sel('s', sh.morS, 'Emotional strength', 'Emotional strength — no rules effect; who the character is at their best. Picking one also sets its paired weakness.')}
      ${sel('w', sh.morW, 'Emotional weakness', 'Emotional weakness — the flip side of the strength; what tempts the character toward Conflict.')}
      ${T.length ? `<button class="mini" onclick="moralRoll('${id}')" title="Roll d100 on the Morality table for a random pair">🎲 roll a pair</button>` : ''}
    </div>` + (sRow || wRow ? `<div class="tinfo">${sRow ? `<b>${esc(sRow.s)}:</b> ${esc(sRow.se)}` : ''}${sRow && wRow ? '<br>' : ''}${wRow ? `<b>${esc(wRow.w)}:</b> ${esc(wRow.we)}` : ''}</div>` : '');
}
function sheetAdj(id, k, d){ sheetSet(id, k, st(id).sheet[k] + d); }
function conflictResolve(id, doubled, forced){   // end of session: 1d10 − Conflict, doubled if the GM triggered this Morality
  const cs = st(id), sh = cs.sheet, roll = forced || rollInt(10)+1, delta = (roll - sh.conf) * (doubled ? 2 : 1), was = sh.mor;
  sh.mor = clamp(sh.mor + delta, 0, 100); moralSync(sh);
  postFeed({ k:'p', h:'Morality', m:`${cfg(id).name}: rolled ${roll} − ${sh.conf} Conflict${doubled?' (×2, triggered)':''} → Morality ${delta>=0?'+':''}${delta} (${was} → ${sh.mor}). ${moralBand(sh).name}.` });
  sh.conf = 0; render(); return delta;
}
function tallyAdd(id, kind){ st(id).sheet[kind].push({ id:randomId().slice(0,6), n:'', v:TALLY[kind].start }); render(); }
function tallySet(id, kind, eid, k, v){
  const x = st(id).sheet[kind].find(y=>y.id===eid); if(!x) return;
  if(k==='n') x.n = String(v).slice(0,60); else x.v = clamp(Math.round(parseFloat(v))||0, 0, 100);
  render();
}
function tallyDel(id, kind, eid){ const sh = st(id).sheet; sh[kind] = sh[kind].filter(y=>y.id!==eid); render(); }
function partyTally(kind){   // every character's entries in roster order — the d100 table
  const rows = []; let total = 0;
  for(const cs of S.chars) for(const x of cs.sheet[kind]) if(x.v > 0){ rows.push({ who:cs.id, n:x.n, from:total+1, to:total+x.v }); total += x.v; }
  return { rows, total };
}
function tallyRoll(kind, forced){   // session start: d100 against the party's total Obligation or Duty
  const { rows, total } = partyTally(kind), roll = forced || rollInt(100)+1, name = kind==='obl' ? 'Obligation' : 'Duty';
  const hit = rows.find(r=>roll>=r.from && roll<=r.to), dbl = roll<100 && roll%11===0;
  let m = `Rolled ${roll} against a party total of ${total}. `;
  if(!hit) m += kind==='obl' ? 'Not triggered — the party\'s troubles leave them alone this session.' : 'Not triggered.';
  else if(kind==='obl') m += `Triggered: ${cfg(hit.who).name}'s ${hit.n || 'Obligation'}. This session everyone's strain threshold is −${dbl?2:1}, and ${cfg(hit.who).name}'s is −${dbl?4:2}${dbl?' (doubles: effect doubled)':''}.`;
  else m += `Triggered: ${cfg(hit.who).name}'s ${hit.n || 'Duty'}. This session everyone's wound threshold is +${dbl?2:1}, and ${cfg(hit.who).name}'s is +${dbl?4:2}${dbl?' (doubles: effect doubled)':''}.`;
  postFeed({ k:'p', h:name+' check', m });
  return { roll, hit, dbl };
}
/* Obligation (Edge of the Empire) and Duty (Age of Rebellion) types, with a one-line explanation each.
   These two books are not in the rules vault, so the wording here is the tracker's own. */
const TALLY = {

    tip:'Obligation: debts, bounties, oaths — what the galaxy holds over you. At session start the GM rolls d100 against the party total; if it comes up, everyone is distracted (strain threshold −1, yours −2).',

      ['Dutybound','You are sworn to a cause, code or person that makes demands on you.'],
      ['Family','Kin who need your protection, your money or your presence.'],
      ['Favor','You owe someone a serious favour, and they can call it in at any time.'],
      ['Oath','A personal vow you have promised to keep or fulfil.'],
      ['Obsession','A fixation on a person, thing or goal that pulls you off course.'],
      ['Responsibility','People, a place or a creature that depend on you by choice rather than blood.'],
    ] },
  duty: { label:'Duty', start:10,
    tip:'Duty: your standing mission for the cause. At session start the GM rolls d100 against the party total; if it comes up, everyone is inspired (wound threshold +1, yours +2). Duty grows as you serve, and every 100 the group earns raises its standing.',
    types:[
      ['Combat Victory','Win fights against the enemy and prove they can be beaten.'],
      ['Counter-Intelligence','Find and stop enemy spies and informants, and keep your own side\'s secrets safe.'],
      ['Intelligence','Gather information on enemy plans, movements and weaknesses.'],
      ['Internal Security','Root out traitors and threats inside your own organisation.'],
      ['Personnel','Look after your people: rescue the captured, protect the vulnerable, keep morale up.'],
      ['Political Support','Win worlds, leaders and public opinion over to the cause.'],
      ['Recruiting','Bring new, capable people into the fight.'],
      ['Resource Acquisition','Secure the supplies, credits and raw materials the cause runs on.'],
      ['Sabotage','Destroy or cripple enemy equipment, facilities and operations.'],
      ['Space Superiority','Control the space lanes: win ship battles and keep routes open.'],
      ['Tech Procurement','Obtain advanced or experimental technology, often by stealing the enemy\'s.'],
      ['Support','Make everyone else\'s mission possible: transport, medicine, repairs, logistics.'],
    ] },
};
function tallyType(id, kind, eid, v){
  if(v==='__other'){ const x = st(id).sheet[kind].find(y=>y.id===eid), t = prompt(`Type the ${TALLY[kind].label}:`, x ? x.n : ''); if(t===null){ render(); return; } v = t; }
  tallySet(id, kind, eid, 'n', v);
}
function tallyHtml(cs, kind){
  const sh = cs.sheet, id = cs.id, T = TALLY[kind], pt = partyTally(kind), mine = sh[kind].reduce((a,x)=>a+x.v, 0), names = T.types.map(t=>t[0]);
  return `<div><table class="taltable"><tr><th title="${esc(T.tip)}">${T.label}</th><th>Size</th><th></th></tr>` +
    sh[kind].map(x=>{ const desc = (T.types.find(t=>t[0]===x.n)||[])[1] || '';
      return `<tr><td><select style="width:100%" title="${esc(desc)}" onchange="tallyType('${id}','${kind}','${x.id}',this.value)"><option value="">— choose a type —</option>` +
        T.types.map(t=>`<option ${t[0]===x.n?'selected':''} title="${esc(t[1])}">${esc(t[0])}</option>`).join('') + (x.n && !names.includes(x.n) ? `<option selected>${esc(x.n)}</option>` : '') +
        `<option value="__other">other (type it)…</option></select>${desc ? `<div class="tinfo" style="margin:2px 0 0">${esc(desc)}</div>` : ''}</td>
      <td><input type="number" min="0" max="100" value="${x.v}" onchange="tallySet('${id}','${kind}','${x.id}','v',this.value)"></td>
      <td><button class="mini" onclick="tallyDel('${id}','${kind}','${x.id}')" title="Remove">✕</button></td></tr>`; }).join('') +

      <span class="tinfo"> ${esc(cfg(id).name)}: <b>${mine}</b> · party total <b>${pt.total}</b></span>
      <button class="mini atk" onclick="tallyRoll('${kind}')" ${pt.total?'':'disabled'} title="Session start: roll d100 against the party total. The result goes to the roll feed on the Dice tab.">🎲 roll ${T.label} check</button></td></tr></table></div>`;
